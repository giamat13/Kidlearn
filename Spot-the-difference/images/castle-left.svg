  <!-- Stone block pattern on main wall -->
  <line x1="80" y1="310" x2="420" y2="310" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="420" y2="340" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="80" y1="370" x2="420" y2="370" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="80" y1="400" x2="420" y2="400" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="80" y1="430" x2="420" y2="430" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="80" y1="460" x2="420" y2="460" stroke="#5a5a4a" stroke-width="1.5"/>
  <!-- Vertical joints offset -->
  <line x1="130" y1="310" x2="130" y2="340" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="200" y1="310" x2="200" y2="340" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="280" y1="310" x2="280" y2="340" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="360" y1="310" x2="360" y2="340" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="110" y1="340" x2="110" y2="370" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="180" y1="340" x2="180" y2="370" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="260" y1="340" x2="260" y2="370" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="340" y1="340" x2="340" y2="370" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="410" y1="340" x2="410" y2="370" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="135" y1="370" x2="135" y2="400" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="210" y1="370" x2="210" y2="400" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="295" y1="370" x2="295" y2="400" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="375" y1="370" x2="375" y2="400" stroke="#5a5a4a" stroke-width="1"/>

  <!-- Left tower -->
  <rect x="55" y="200" width="100" height="310" fill="#7a7a6a"/>
  <!-- Left tower battlements -->
  <rect x="55" y="182" width="20" height="22" rx="2" fill="#7a7a6a"/>
  <rect x="85" y="182" width="20" height="22" rx="2" fill="#7a7a6a"/>
  <rect x="115" y="182" width="20" height="22" rx="2" fill="#7a7a6a"/>
  <rect x="55" y="200" width="100" height="8" fill="#6a6a5a"/>
  <!-- Left tower stones -->
  <line x1="55" y1="230" x2="155" y2="230" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="55" y1="260" x2="155" y2="260" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="55" y1="290" x2="80" y2="290" stroke="#5a5a4a" stroke-width="1"/>
  <line x1="100" y1="290" x2="155" y2="290" stroke="#5a5a4a" stroke-width="1"/>

  <!-- Right tower -->
  <rect x="345" y="200" width="100" height="310" fill="#7a7a6a"/>
  <!-- Right tower battlements -->
  <rect x="345" y="182" width="20" height="22" rx="2" fill="#7a7a6a"/>
  <rect x="375" y="182" width="20" height="22" rx="2" fill="#7a7a6a"/>
  <rect x="405" y="182" width="20" height="22" rx="2" fill="#7a7a6a"/>
  <rect x="345" y="200" width="100" height="8" fill="#6a6a5a"/>
  <!-- Right tower stones -->
  <line x1="345" y1="230" x2="445" y2="230" stroke="#5a5a4a" stroke-width="1.5"/>
  <line x1="345" y1="260" x2="445" y2="260" stroke="#5a5a4a" stroke-width="1.5"/>

  <!-- Center top battlements -->
  <rect x="80" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="115" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="150" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="185" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="220" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="255" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="290" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="325" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="360" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="395" y="262" width="25" height="22" rx="2" fill="#8a8a7a"/>

  <!-- Center tower / keep -->
  <rect x="170" y="130" width="160" height="155" fill="#8a8a7a"/>
  <!-- Keep battlements -->
  <rect x="170" y="112" width="24" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="204" y="112" width="24" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="238" y="112" width="24" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="272" y="112" width="24" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="306" y="112" width="24" height="22" rx="2" fill="#8a8a7a"/>
  <rect x="170" y="130" width="160" height="8" fill="#7a7a6a"/>
  <!-- Keep stones -->
  <line x1="170" y1="160" x2="330" y2="160" stroke="#7a7a6a" stroke-width="1.5"/>
  <line x1="170" y1="190" x2="330" y2="190" stroke="#7a7a6a" stroke-width="1.5"/>
  <line x1="170" y1="220" x2="330" y2="220" stroke="#7a7a6a" stroke-width="1.5"/>
  <line x1="170" y1="250" x2="330" y2="250" stroke="#7a7a6a" stroke-width="1.5"/>

  <!-- ═══ FLAG (cx≈0.50, cy≈0.15 → x≈250, y≈90) ═══ -->
  <!-- Flagpole -->
  <rect x="247" y="40" width="6" height="75" rx="2" fill="#6b4020"/>
  <!-- LEFT: Red flag with cross -->
  <path d="M 253 42 L 295 55 L 253 68 Z" fill="#cc0000"/>
  <line x1="265" y1="46" x2="265" y2="66" stroke="white" stroke-width="2"/>
  <line x1="255" y1="56" x2="292" y2="56" stroke="white" stroke-width="2"/>

  <!-- ═══ WALL STONES (cx≈0.35, cy≈0.45 → x≈175, y≈270) ═══ -->
  <!-- LEFT: Has darker accent stones in wall -->
  <rect x="88" y="342" width="38" height="26" rx="1" fill="#5a5040" opacity="0.6"/>
  <rect x="145" y="313" width="48" height="25" rx="1" fill="#5a5040" opacity="0.6"/>
  <rect x="88" y="403" width="38" height="25" rx="1" fill="#4a4838" opacity="0.6"/>

  <!-- ═══ WINDOW (cx≈0.65, cy≈0.50 → x≈325, y≈300) ═══ -->
