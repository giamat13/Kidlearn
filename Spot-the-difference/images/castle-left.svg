<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#c8d8f0"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8a7a"/>
      <stop offset="100%" stop-color="#6a6a5a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="500" height="600" fill="url(#skyGrad)"/>
  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="55" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="110" cy="50" rx="40" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="55" cy="55" rx="30" ry="16" fill="white" opacity="0.8"/>
  <ellipse cx="370" cy="80" rx="60" ry="22" fill="white" opacity="0.7"/>
  <ellipse cx="400" cy="70" rx="45" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="340" cy="75" rx="35" ry="16" fill="white" opacity="0.7"/>

  <!-- Ground / moat -->
  <rect x="0" y="500" width="500" height="100" fill="#4a6a30"/>
  <rect x="0" y="490" width="500" height="20" fill="#3a5a20"/>
  <!-- Moat water -->
  <ellipse cx="250" cy="510" rx="220" ry="25" fill="#2a4a7a" opacity="0.7"/>
  <ellipse cx="250" cy="510" rx="200" ry="18" fill="#3a5a8a" opacity="0.5"/>
  <!-- Water ripples -->
  <path d="M 80 508 Q 120 502 160 508" stroke="#6a8aaa" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 320 506 Q 360 500 400 506" stroke="#6a8aaa" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Drawbridge -->
  <rect x="200" y="478" width="100" height="15" rx="2" fill="#5a3a18"/>
  <line x1="200" y1="478" x2="180" y2="440" stroke="#3a2a10" stroke-width="4"/>
  <line x1="300" y1="478" x2="320" y2="440" stroke="#3a2a10" stroke-width="4"/>

  <!-- ═══ MAIN CASTLE BODY ═══ -->
