  <rect x="300" y="310" width="60" height="75" rx="4" fill="#1a1a2a"/>
  <rect x="303" y="313" width="54" height="69" rx="3" fill="#2a3050"/>
  <!-- Window arch -->
  <path d="M 300 325 Q 300 310 330 310 Q 360 310 360 325" fill="#1a1a2a"/>
  <!-- Iron bars on window -->
  <line x1="315" y1="313" x2="315" y2="385" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="330" y1="313" x2="330" y2="385" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="345" y1="313" x2="345" y2="385" stroke="#3a3a3a" stroke-width="3"/>
  <line x1="303" y1="342" x2="357" y2="342" stroke="#3a3a3a" stroke-width="3"/>
  <!-- Candle light from inside -->
  <circle cx="330" cy="355" r="8" fill="#ff8c00" opacity="0.3"/>

  <!-- Left tower window -->
  <rect x="88" y="235" width="32" height="44" rx="3" fill="#1a1a2a"/>
  <rect x="91" y="238" width="26" height="38" rx="2" fill="#2a3050"/>
  <path d="M 88 248 Q 88 235 104 235 Q 120 235 120 248" fill="#1a1a2a"/>

  <!-- Right tower window -->
  <rect x="380" y="235" width="32" height="44" rx="3" fill="#1a1a2a"/>
  <rect x="383" y="238" width="26" height="38" rx="2" fill="#2a3050"/>
  <path d="M 380 248 Q 380 235 396 235 Q 412 235 412 248" fill="#1a1a2a"/>

  <!-- Keep window -->
  <rect x="220" y="165" width="60" height="50" rx="3" fill="#1a1a2a"/>
  <rect x="223" y="168" width="54" height="44" rx="2" fill="#2a3050"/>
  <path d="M 220 182 Q 220 165 250 165 Q 280 165 280 182" fill="#1a1a2a"/>
  <line x1="250" y1="165" x2="250" y2="215" stroke="#3a3a4a" stroke-width="2"/>
  <line x1="220" y1="190" x2="280" y2="190" stroke="#3a3a4a" stroke-width="2"/>

  <!-- ═══ DOOR (cx≈0.50, cy≈0.70 → x≈250, y≈420) ═══ -->
  <!-- LEFT: Arched door with visible hinges and studs -->
  <path d="M 205 490 L 205 415 Q 205 400 250 400 Q 295 400 295 415 L 295 490 Z" fill="#2a1a08"/>
  <path d="M 208 490 L 208 417 Q 208 405 250 405 Q 292 405 292 417 L 292 490 Z" fill="#3a2a10"/>
  <!-- Door hinges -->
  <rect x="208" y="420" width="14" height="8" rx="2" fill="#8b6030"/>
  <rect x="208" y="460" width="14" height="8" rx="2" fill="#8b6030"/>
  <rect x="278" y="420" width="14" height="8" rx="2" fill="#8b6030"/>
  <rect x="278" y="460" width="14" height="8" rx="2" fill="#8b6030"/>
  <!-- Door studs -->
  <circle cx="225" cy="432" r="3" fill="#8b6030"/>
  <circle cx="240" cy="432" r="3" fill="#8b6030"/>
  <circle cx="260" cy="432" r="3" fill="#8b6030"/>
  <circle cx="275" cy="432" r="3" fill="#8b6030"/>
  <circle cx="225" cy="448" r="3" fill="#8b6030"/>
  <circle cx="275" cy="448" r="3" fill="#8b6030"/>
  <!-- Door knocker -->
  <circle cx="250" cy="455" r="7" fill="none" stroke="#8b6030" stroke-width="3"/>
  <circle cx="250" cy="448" r="3" fill="#8b6030"/>

  <!-- ═══ CHIMNEY STONE (cx≈0.25, cy≈0.60 → x≈125, y≈360) ═══ -->
  <!-- Chimney on left tower -->
  <rect x="90" y="178" width="22" height="28" rx="2" fill="#6a6a5a"/>
  <!-- LEFT: Chimney has a different/missing stone (darker patch) -->
  <rect x="93" y="190" width="16" height="12" rx="1" fill="#3a3830"/>

  <!-- Ivy/vines on walls -->
  <path d="M 80 380 Q 92 360 88 340 Q 82 358 80 380 Z" fill="#2a5020" opacity="0.7"/>
  <path d="M 83 340 Q 95 318 90 298" stroke="#2a5020" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 420 400 Q 412 375 415 350" stroke="#2a5020" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Birds in sky -->
  <path d="M 150 130 Q 155 124 160 130" stroke="#2a2a3a" stroke-width="2" fill="none"/>
  <path d="M 165 120 Q 171 114 177 120" stroke="#2a2a3a" stroke-width="2" fill="none"/>
  <path d="M 350 100 Q 356 94 362 100" stroke="#2a2a3a" stroke-width="2" fill="none"/>
</svg>
