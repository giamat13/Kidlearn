<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8ac8"/>
      <stop offset="100%" stop-color="#a0c8f0"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6a30"/>
      <stop offset="100%" stop-color="#2a4a18"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="500" height="600" fill="url(#skyGrad)"/>
  <!-- Sky dapple through trees -->
  <ellipse cx="250" cy="80" rx="120" ry="60" fill="#7aaae0" opacity="0.3"/>

  <!-- Background trees (far) -->
  <rect x="20" y="200" width="18" height="280" fill="#2a1a0a"/>
  <ellipse cx="29" cy="185" rx="32" ry="55" fill="#1a4a10"/>
  <rect x="460" y="220" width="18" height="260" fill="#2a1a0a"/>
  <ellipse cx="469" cy="205" rx="30" ry="50" fill="#1a4a10"/>
  <rect x="380" y="230" width="14" height="250" fill="#2a1a0a"/>
  <ellipse cx="387" cy="215" rx="28" ry="48" fill="#204820"/>

  <!-- Ground -->
  <rect x="0" y="420" width="500" height="180" fill="url(#groundGrad)"/>
  <rect x="0" y="420" width="500" height="15" fill="#3a5a22"/>
  <!-- Grass tufts -->
  <path d="M 30 420 Q 35 408 40 420" stroke="#2a5018" stroke-width="2" fill="none"/>
  <path d="M 80 420 Q 85 410 90 420" stroke="#2a5018" stroke-width="2" fill="none"/>
  <path d="M 150 420 Q 155 408 160 420" stroke="#2a5018" stroke-width="2" fill="none"/>
  <path d="M 300 420 Q 305 410 310 420" stroke="#2a5018" stroke-width="2" fill="none"/>
  <path d="M 420 420 Q 425 408 430 420" stroke="#2a5018" stroke-width="2" fill="none"/>
  <path d="M 470 420 Q 475 410 480 420" stroke="#2a5018" stroke-width="2" fill="none"/>

  <!-- ═══ STREAM / BROOK ═══ -->
  <path d="M 0 460 Q 60 450 130 465 Q 200 478 270 465 Q 340 452 400 468 Q 450 478 500 465 L 500 490 Q 450 500 400 488 Q 340 472 270 485 Q 200 498 130 485 Q 60 472 0 482 Z" fill="#4a80b0" opacity="0.7"/>
  <path d="M 30 468 Q 80 462 130 470" stroke="#6aaad0" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 250 462 Q 300 456 360 464" stroke="#6aaad0" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- ═══ STONES IN STREAM (cx≈0.50, cy≈0.80 → x≈250, y≈480) ═══ -->
  <!-- LEFT: has stones in stream -->
  <ellipse cx="200" cy="474" rx="18" ry="9" fill="#7a7a6a"/>
  <ellipse cx="200" cy="472" rx="16" ry="7" fill="#9a9a8a"/>
  <ellipse cx="260" cy="477" rx="22" ry="10" fill="#7a7a6a"/>
  <ellipse cx="260" cy="475" rx="19" ry="8" fill="#9a9a8a"/>
  <ellipse cx="320" cy="472" rx="15" ry="8" fill="#7a7a6a"/>
  <ellipse cx="320" cy="470" rx="13" ry="6" fill="#9a9a8a"/>

  <!-- ═══ LEFT CENTER TREE (large, cx≈0.40) ═══ -->
  <!-- Trunk -->
  <rect x="168" y="250" width="45" height="250" rx="8" fill="#3a2010"/>
  <rect x="175" y="255" width="15" height="245" rx="5" fill="#4a2a15" opacity="0.5"/>
  <!-- Bark texture -->
  <line x1="172" y1="280" x2="168" y2="320" stroke="#2a1808" stroke-width="2" opacity="0.5"/>
  <line x1="205" y1="290" x2="210" y2="330" stroke="#2a1808" stroke-width="2" opacity="0.5"/>
  <!-- Root flares -->
  <path d="M 168 490 Q 155 480 145 500 L 168 500 Z" fill="#3a2010"/>
  <path d="M 213 490 Q 225 480 235 500 L 213 500 Z" fill="#3a2010"/>
  <!-- Branch left -->
  <path d="M 172 310 Q 140 290 118 275" stroke="#3a2010" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M 118 275 Q 98 265 85 255" stroke="#3a2010" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Branch right -->
  <path d="M 210 295 Q 240 278 262 268" stroke="#3a2010" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Foliage -->
  <ellipse cx="190" cy="188" rx="88" ry="75" fill="#1a5010"/>
  <ellipse cx="140" cy="215" rx="60" ry="50" fill="#204818"/>
  <ellipse cx="240" cy="210" rx="62" ry="52" fill="#204818"/>
  <ellipse cx="190" cy="145" rx="58" ry="48" fill="#1a5010"/>
  <ellipse cx="155" cy="175" rx="45" ry="38" fill="#2a5820"/>
  <ellipse cx="225" cy="170" rx="45" ry="38" fill="#2a5820"/>

  <!-- ═══ BIRD IN TREE (cx≈0.50, cy≈0.25 → x≈250, y≈150) ═══ -->
  <!-- LEFT: bird is sitting on branch (visible) -->
  <!-- Bird on branch of center tree -->
  <ellipse cx="220" cy="155" rx="10" ry="7" fill="#c84020"/>
  <ellipse cx="212" cy="153" rx="6" ry="5" fill="#d05030"/>
  <circle cx="209" cy="151" r="4" fill="#d05030"/>
  <!-- Eye -->
  <circle cx="207" cy="150" r="1.5" fill="#0a0a0a"/>
  <!-- Beak -->
  <path d="M 205 150 L 200 150 L 205 152 Z" fill="#f0c030"/>
  <!-- Tail -->
  <path d="M 228 156 L 236 152 L 234 159 Z" fill="#a02818"/>
  <!-- Wings folded -->
  <path d="M 218 158 Q 222 163 228 160" stroke="#b03020" stroke-width="2" fill="none"/>

  <!-- ═══ RIGHT TREE (cx≈0.70) ═══ -->
  <!-- Trunk -->
  <rect x="310" y="270" width="40" height="230" rx="7" fill="#3a2010"/>
  <rect x="316" y="275" width="12" height="225" rx="4" fill="#4a2a15" opacity="0.5"/>
  <!-- Branch -->
  <path d="M 348" y="300" Q 375 285 395 275" stroke="#3a2010" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 348 300 Q 375 285 395 275" stroke="#3a2010" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 312 320 Q 285 305 265 295" stroke="#3a2010" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Foliage -->
  <ellipse cx="330" cy="210" rx="75" ry="65" fill="#1a5010"/>
  <ellipse cx="285" cy="230" rx="50" ry="42" fill="#204818"/>
  <ellipse cx="375" cy="228" rx="52" ry="44" fill="#204818"/>
  <ellipse cx="330" cy="170" rx="50" ry="42" fill="#2a5820"/>

  <!-- ═══ SNAKE IN RIGHT TREE (cx≈0.70, cy≈0.60 → x≈350, y≈360) ═══ -->
  <!-- LEFT: snake is coiled on branch, green -->
  <path d="M 345 295 Q 365 285 375 300 Q 385 315 370 325 Q 355 335 360 350 Q 365 362 355 368" stroke="#2a7a20" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 345 295 Q 365 285 375 300 Q 385 315 370 325 Q 355 335 360 350 Q 365 362 355 368" stroke="#3a9a30" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Snake head -->
  <ellipse cx="352" cy="372" rx="7" ry="5" fill="#2a7a20"/>
  <circle cx="349" cy="370" r="1.5" fill="#0a0a0a"/>
  <!-- Forked tongue -->
  <path d="M 346 373 L 338 371 M 346 373 L 338 375" stroke="#cc2020" stroke-width="1.5" fill="none"/>

  <!-- ═══ MUSHROOM (cx≈0.30, cy≈0.55 → x≈150, y≈330) ═══ -->
  <!-- LEFT: red mushroom with white spots -->
  <rect x="142" y="400" width="10" height="25" rx="2" fill="#d8c8a0"/>
  <ellipse cx="147" cy="402" rx="22" ry="12" fill="#cc2020"/>
  <ellipse cx="147" cy="400" rx="20" ry="10" fill="#dd3030"/>
  <!-- Spots -->
  <circle cx="140" cy="397" r="3.5" fill="white"/>
  <circle cx="152" cy="396" r="3" fill="white"/>
  <circle cx="147" cy="404" r="2.5" fill="white"/>
  <circle cx="136" cy="402" r="2" fill="white"/>
  <circle cx="158" cy="402" r="2" fill="white"/>

  <!-- ═══ LEAVES ON TREE (cx≈0.40, cy≈0.35 → x≈200, y≈210) ═══ -->
  <!-- LEFT: extra autumn leaves falling from tree -->
  <ellipse cx="170" cy="240" rx="8" ry="5" fill="#c84020" transform="rotate(-20,170,240)"/>
  <ellipse cx="155" cy="258" rx="7" ry="4" fill="#d06020" transform="rotate(15,155,258)"/>
  <ellipse cx="215" cy="248" rx="8" ry="5" fill="#c84020" transform="rotate(25,215,248)"/>
  <ellipse cx="200" cy="265" rx="6" ry="4" fill="#a83018" transform="rotate(-10,200,265)"/>
  <!-- Leaf stems -->
  <line x1="170" y1="245" x2="168" y2="252" stroke="#6a3010" stroke-width="1.5"/>
  <line x1="155" y1="263" x2="152" y2="270" stroke="#6a3010" stroke-width="1.5"/>
  <line x1="215" y1="253" x2="218" y2="260" stroke="#6a3010" stroke-width="1.5"/>

  <!-- Ferns on ground -->
  <path d="M 60 422 Q 50 410 40 418 Q 52 408 65 415 Q 60 405 72 413" stroke="#2a5018" stroke-width="2.5" fill="none"/>
  <path d="M 420 422 Q 410 410 400 418 Q 412 408 425 415 Q 420 405 432 413" stroke="#2a5018" stroke-width="2.5" fill="none"/>
  <path d="M 100 424 Q 90 414 80 420 Q 92 412 105 418" stroke="#204018" stroke-width="2" fill="none"/>

  <!-- Flowers on ground -->
  <circle cx="350" cy="423" r="5" fill="#f0e030"/>
  <circle cx="350" cy="423" r="2.5" fill="#e08020"/>
  <circle cx="360" cy="421" r="4" fill="#f060a0"/>
  <circle cx="360" cy="421" r="2" fill="#e04080"/>

  <!-- Sunbeam rays through trees -->
  <path d="M 250 0 L 220 200 L 280 200 Z" fill="#fff8c0" opacity="0.08"/>
  <path d="M 280 0 L 258 180 L 320 180 Z" fill="#fff8c0" opacity="0.06"/>
</svg>
