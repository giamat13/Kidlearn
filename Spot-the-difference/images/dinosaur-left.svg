<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="jurassic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="60%" style="stop-color:#98FB98"/>
      <stop offset="100%" style="stop-color:#228B22"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#jurassic)"/>
  <!-- Volcano in background -->
  <polygon points="300,500 250,200 350,200 400,500" fill="#555"/>
  <polygon points="250,200 270,210 350,200 330,210" fill="#FF4400" opacity="0.8"/>
  <!-- Lava -->
  <path d="M270 210 Q265 240 275 260 Q280 240 285 260 Q290 240 295 210" fill="#FF4400" opacity="0.7"/>
  <!-- DIFF 5: Volcano has 4 lava blobs (right has 2) -->
  <circle cx="268" cy="215" r="6" fill="#FF6600" opacity="0.8"/>
  <circle cx="280" cy="208" r="5" fill="#FF4400" opacity="0.8"/>
  <circle cx="292" cy="213" r="7" fill="#FF6600" opacity="0.8"/>
  <circle cx="274" cy="200" r="5" fill="#FF8800" opacity="0.7"/>

  <!-- Jungle plants -->
  <path d="M0 500 L0 300 Q20 260 40 300 Q20 270 50 280 Q30 300 0 500Z" fill="#228B22"/>
  <path d="M380 500 L400 500 L400 300 Q380 260 360 300 Q380 270 350 280 Q370 300 380 500Z" fill="#228B22"/>
  <path d="M30 500 Q40 430 50 380 Q60 420 70 500Z" fill="#1a7a1a"/>
  <path d="M340 500 Q350 430 360 380 Q370 420 380 500Z" fill="#1a7a1a"/>
  <!-- Ferns -->
  <path d="M10 500 Q0 460 20 430 Q10 460 30 440 Q15 465 35 450 Q20 470 10 500Z" fill="#2aaa2a"/>
  <path d="M380 500 Q390 460 370 430 Q380 460 360 440 Q375 465 355 450 Q370 470 380 500Z" fill="#2aaa2a"/>

  <!-- Ground -->
  <rect x="0" y="420" width="400" height="80" fill="#228B22"/>
  <rect x="0" y="415" width="400" height="15" fill="#2aaa2a"/>

  <!-- T-Rex body -->
  <ellipse cx="210" cy="320" rx="80" ry="55" fill="#4aaa2a"/>
  <!-- Body texture/scales -->
  <ellipse cx="190" cy="305" rx="12" ry="8" fill="#3a8a1a" opacity="0.5"/>
  <ellipse cx="215" cy="298" rx="10" ry="7" fill="#3a8a1a" opacity="0.5"/>
  <ellipse cx="238" cy="308" rx="11" ry="7" fill="#3a8a1a" opacity="0.5"/>
  <ellipse cx="225" cy="328" rx="9" ry="6" fill="#3a8a1a" opacity="0.5"/>
  <ellipse cx="198" cy="332" rx="10" ry="6" fill="#3a8a1a" opacity="0.5"/>
  <!-- Belly -->
  <ellipse cx="205" cy="335" rx="45" ry="30" fill="#88cc44"/>

  <!-- T-Rex tail -->
  <path d="M135 320 Q80 340 50 370 Q60 350 55 380 Q70 360 80 390" stroke="#4aaa2a" stroke-width="30" stroke-linecap="round" fill="none"/>
  <!-- Tail spines - DIFF 3: 5 tail spines (right has 2) -->
  <polygon points="120,307 110,288 125,310" fill="#2a7a0a"/>
  <polygon points="100,314 88,296 103,317" fill="#2a7a0a"/>
  <polygon points="80,325 67,308 82,328" fill="#2a7a0a"/>
  <polygon points="63,338 50,323 65,342" fill="#2a7a0a"/>
  <polygon points="52,354 38,341 53,358" fill="#2a7a0a"/>

  <!-- T-Rex legs -->
  <rect x="175" y="365" width="45" height="70" rx="10" fill="#4aaa2a"/>
  <rect x="230" y="365" width="45" height="70" rx="10" fill="#4aaa2a"/>
  <!-- Feet -->
  <rect x="165" y="427" width="65" height="22" rx="8" fill="#3a8a1a"/>
  <rect x="222" y="427" width="65" height="22" rx="8" fill="#3a8a1a"/>
  <!-- Claws on feet -->
  <path d="M170 448 L165 462" stroke="#2a6a0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 450 L177 464" stroke="#2a6a0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M190 450 L190 465" stroke="#2a6a0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M228 448 L223 462" stroke="#2a6a0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M238 450 L235 464" stroke="#2a6a0a" stroke-width="4" stroke-linecap="round"/>
  <path d="M248 450 L248 465" stroke="#2a6a0a" stroke-width="4" stroke-linecap="round"/>

  <!-- Small arms -->
  <path d="M255 298 Q285 285 295 305" stroke="#4aaa2a" stroke-width="20" stroke-linecap="round" fill="none"/>
  <!-- Hand/claws -->
  <path d="M292 307 L300 295" stroke="#3a8a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M294 310 L305 302" stroke="#3a8a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck and head -->
  <path d="M210 265 Q230 230 250 210" stroke="#4aaa2a" stroke-width="40" stroke-linecap="round" fill="none"/>
  <!-- Head -->
  <ellipse cx="270" cy="195" rx="60" ry="38" fill="#4aaa2a"/>
  <!-- Snout (longer) -->
  <ellipse cx="320" cy="205" rx="30" ry="22" fill="#3a8a1a"/>
  <!-- Teeth - DIFF 1: 7 teeth on top (right has 4) -->
  <path d="M300 214 L304 228 L308 214 L312 228 L316 214 L320 228 L324 214 L328 228 L332 214 L336 228 L340 214 L344 228 L348 214" fill="white"/>
  <!-- Lower jaw -->
  <ellipse cx="312" cy="220" rx="28" ry="12" fill="#3a9a1a"/>
  <!-- Teeth bottom - 4 lower teeth -->
  <path d="M298 220 L301 232 L304 220 L310 232 L313 220 L319 232 L322 220 L328 232 L331 220" fill="white" opacity="0.8"/>

  <!-- Eye -->
  <ellipse cx="255" cy="183" rx="16" ry="14" fill="#FFD700"/>
  <circle cx="255" cy="183" r="9" fill="#2a0a00"/>
  <circle cx="252" cy="180" r="4" fill="white" opacity="0.5"/>
  <!-- Eyebrow ridge -->
  <path d="M242 174 Q255 168 268 174" stroke="#2a7a0a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Nostril -->
  <circle cx="340" cy="196" r="5" fill="#2a7a0a"/>
  <circle cx="348" cy="200" r="4" fill="#2a7a0a"/>

  <!-- DIFF 2: 4 back spines (right has 6) -->
  <polygon points="195,268 188,245 202,268" fill="#2a7a0a"/>
  <polygon points="208,263 200,238 215,263" fill="#2a7a0a"/>
  <polygon points="221,260 213,234 228,260" fill="#2a7a0a"/>
  <polygon points="234,263 227,237 240,263" fill="#2a7a0a"/>

  <!-- Pterodactyl flying -->
  <!-- DIFF 4: 3 pterodactyls (right has 1) -->
  <path d="M80 100 Q95 88 110 100" stroke="#666" stroke-width="2.5" fill="none"/>
  <ellipse cx="95" cy="98" rx="8" ry="5" fill="#777"/>
  <path d="M130 80 Q145 68 160 80" stroke="#666" stroke-width="2.5" fill="none"/>
  <ellipse cx="145" cy="78" rx="8" ry="5" fill="#777"/>
  <path d="M55 130 Q67 120 79 130" stroke="#666" stroke-width="2" fill="none"/>
  <ellipse cx="67" cy="128" rx="6" ry="4" fill="#777"/>
</svg>
