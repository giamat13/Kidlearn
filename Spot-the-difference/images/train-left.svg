<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90c8"/>
      <stop offset="100%" stop-color="#90c8f0"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c84020"/>
      <stop offset="100%" stop-color="#8b2010"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="500" height="600" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <ellipse cx="120" cy="70" rx="55" ry="22" fill="white" opacity="0.85"/>
  <ellipse cx="150" cy="58" rx="40" ry="18" fill="white" opacity="0.85"/>
  <ellipse cx="90" cy="64" rx="30" ry="16" fill="white" opacity="0.85"/>
  <ellipse cx="380" cy="55" rx="50" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="408" cy="46" rx="38" ry="16" fill="white" opacity="0.7"/>

  <!-- Rolling hills / countryside -->
  <path d="M 0 350 Q 80 290 160 330 Q 240 370 320 310 Q 400 250 500 310 L 500 600 L 0 600 Z" fill="#5a8a3a"/>
  <path d="M 0 380 Q 100 340 200 370 Q 300 400 400 360 Q 460 340 500 360 L 500 600 L 0 600 Z" fill="#6a9a45"/>
  <!-- Ground/embankment -->
  <rect x="0" y="480" width="500" height="120" fill="#7aaa50"/>

  <!-- ═══ RAILWAY TRACKS (cx≈0.50, cy≈0.75 → x≈250, y≈450) ═══ -->
  <!-- LEFT: tracks have extra cross ties (sleepers) -->
  <!-- Rails -->
  <line x1="0" y1="500" x2="500" y2="500" stroke="#5a5a5a" stroke-width="6"/>
  <line x1="0" y1="520" x2="500" y2="520" stroke="#5a5a5a" stroke-width="6"/>
  <!-- Ties/sleepers - LEFT has MORE ties -->
  <rect x="15" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="55" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="95" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="135" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="175" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="215" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="255" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="295" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="335" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="375" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="415" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="455" y="494" width="25" height="32" rx="2" fill="#3a2010"/>

  <!-- Ballast (gravel under tracks) -->
  <rect x="0" y="490" width="500" height="40" fill="#8a7a60" opacity="0.4"/>

  <!-- ═══ STEAM LOCOMOTIVE ═══ -->
  <!-- Tender (coal car) -->
  <rect x="340" y="398" width="115" height="80" rx="6" fill="#2a1a0a"/>
  <rect x="344" y="402" width="107" height="68" rx="4" fill="#3a2a15"/>
  <!-- Coal in tender -->
  <ellipse cx="397" cy="408" rx="48" ry="14" fill="#1a1a1a"/>
  <ellipse cx="397" cy="406" rx="44" ry="11" fill="#2a2a2a"/>

  <!-- Tender wheels -->
  <circle cx="365" cy="478" r="16" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="3"/>
  <circle cx="365" cy="478" r="8" fill="#2a2a2a"/>
  <circle cx="430" cy="478" r="16" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="3"/>
  <circle cx="430" cy="478" r="8" fill="#2a2a2a"/>
  <!-- Wheel spokes -->
  <line x1="365" y1="462" x2="365" y2="494" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="349" y1="478" x2="381" y2="478" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="354" y1="467" x2="376" y2="489" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="376" y1="467" x2="354" y2="489" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="430" y1="462" x2="430" y2="494" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="414" y1="478" x2="446" y2="478" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="419" y1="467" x2="441" y2="489" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="441" y1="467" x2="419" y2="489" stroke="#4a4a4a" stroke-width="2"/>

  <!-- Main locomotive body -->
  <rect x="90" y="375" width="260" height="103" rx="8" fill="url(#trainGrad)"/>
  <rect x="94" y="378" width="252" height="95" rx="6" fill="#cc3a18"/>

  <!-- Boiler (cylindrical top) -->
  <rect x="110" y="340" width="220" height="48" rx="20" fill="#c03010"/>
  <rect x="115" y="343" width="210" height="40" rx="18" fill="#d03818"/>
  <!-- Boiler bands -->
  <line x1="165" y1="340" x2="165" y2="388" stroke="#a02808" stroke-width="3" opacity="0.6"/>
  <line x1="220" y1="340" x2="220" y2="388" stroke="#a02808" stroke-width="3" opacity="0.6"/>
  <line x1="275" y1="340" x2="275" y2="388" stroke="#a02808" stroke-width="3" opacity="0.6"/>

  <!-- Cab -->
  <rect x="300" y="310" width="80" height="78" rx="5" fill="#aa2a10"/>
  <rect x="304" y="313" width="72" height="70" rx="4" fill="#ba3018"/>
  <!-- Cab roof -->
  <rect x="295" y="303" width="90" height="12" rx="4" fill="#8a1a08"/>

  <!-- Cab windows -->
  <rect x="310" y="320" width="28" height="30" rx="4" fill="#2a3050"/>
  <rect x="312" y="322" width="24" height="26" rx="3" fill="#3a4060"/>
  <!-- ═══ WINDOW SCENE — (cx≈0.25, cy≈0.40 → left window, this is x≈125,y≈240 but since cab is on right...) ═══ -->
  <!-- The cab window = right window of train -->
  <!-- Cab second window -->
  <rect x="348" y="320" width="28" height="30" rx="4" fill="#2a3050"/>
  <rect x="350" y="322" width="24" height="26" rx="3" fill="#3a4060"/>

  <!-- Chimney / smokestack -->
  <rect x="148" y="308" width="24" height="35" rx="4" fill="#2a1a0a"/>
  <rect x="144" y="304" width="32" height="10" rx="4" fill="#1a0a00"/>
  <rect x="146" y="306" width="28" height="8" rx="3" fill="#2a1a0a"/>

  <!-- ═══ SMOKE (cx≈0.50, cy≈0.25 → x≈250, y≈150) ═══ -->
  <!-- LEFT: big puffy smoke clouds -->
  <ellipse cx="160" cy="278" rx="28" ry="20" fill="#d0d0d0" opacity="0.85"/>
  <ellipse cx="148" cy="258" rx="22" ry="18" fill="#c8c8c8" opacity="0.8"/>
  <ellipse cx="168" cy="248" rx="25" ry="20" fill="#d0d0d0" opacity="0.75"/>
  <ellipse cx="152" cy="230" rx="20" ry="16" fill="#c8c8c8" opacity="0.7"/>
  <ellipse cx="165" cy="215" rx="18" ry="14" fill="#d0d0d0" opacity="0.65"/>
  <ellipse cx="150" cy="200" rx="15" ry="12" fill="#c8c8c8" opacity="0.55"/>
  <!-- Smoke wisps -->
  <path d="M 160 304 Q 155 285 162 268 Q 152 255 156 240 Q 148 225 155 210" stroke="#b8b8b8" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- Cow catcher / front -->
  <path d="M 90 450 L 68 470 L 68 478 L 90 478 Z" fill="#8a1a08"/>
  <line x1="68" y1="462" x2="90" y2="452" stroke="#6a1008" stroke-width="2"/>
  <line x1="68" y1="470" x2="90" y2="460" stroke="#6a1008" stroke-width="2"/>

  <!-- Headlight -->
  <circle cx="92" cy="415" r="12" fill="#e8e0c0"/>
  <circle cx="92" cy="415" r="9" fill="#ffe080"/>
  <circle cx="92" cy="415" r="5" fill="white"/>

  <!-- ═══ LARGE DRIVING WHEELS (cx≈0.65, cy≈0.50 → x≈325, y≈300) ═══ -->
  <!-- LEFT: Large wheels have full spokes -->
  <circle cx="160" cy="478" r="24" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="4"/>
  <circle cx="160" cy="478" r="12" fill="#2a2a2a"/>
  <circle cx="160" cy="478" r="4" fill="#4a4a4a"/>
  <!-- Spokes -->
  <line x1="160" y1="454" x2="160" y2="502" stroke="#5a5a5a" stroke-width="2.5"/>
  <line x1="136" y1="478" x2="184" y2="478" stroke="#5a5a5a" stroke-width="2.5"/>
  <line x1="143" y1="461" x2="177" y2="495" stroke="#5a5a5a" stroke-width="2.5"/>
  <line x1="177" y1="461" x2="143" y2="495" stroke="#5a5a5a" stroke-width="2.5"/>

  <circle cx="232" cy="478" r="28" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="4"/>
  <circle cx="232" cy="478" r="14" fill="#2a2a2a"/>
  <circle cx="232" cy="478" r="5" fill="#4a4a4a"/>
  <line x1="232" y1="450" x2="232" y2="506" stroke="#5a5a5a" stroke-width="3"/>
  <line x1="204" y1="478" x2="260" y2="478" stroke="#5a5a5a" stroke-width="3"/>
  <line x1="212" y1="458" x2="252" y2="498" stroke="#5a5a5a" stroke-width="3"/>
  <line x1="252" y1="458" x2="212" y2="498" stroke="#5a5a5a" stroke-width="3"/>

  <!-- Connecting rod between wheels -->
  <rect x="148" y="468" width="95" height="8" rx="3" fill="#3a3a3a"/>

  <!-- Small front wheel -->
  <circle cx="108" cy="478" r="16" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="3"/>
  <circle cx="108" cy="478" r="8" fill="#2a2a2a"/>
  <line x1="108" y1="462" x2="108" y2="494" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="92" y1="478" x2="124" y2="478" stroke="#4a4a4a" stroke-width="2"/>

  <!-- ═══ TICKETS IN WINDOW (cx≈0.35, cy≈0.55 → x≈175, y≈330) ═══ -->
  <!-- LEFT: conductor's window has tickets visible -->
  <!-- Side window of locomotive -->
  <rect x="200" y="388" width="45" height="38" rx="4" fill="#2a3050"/>
  <rect x="202" y="390" width="41" height="34" rx="3" fill="#3a4060"/>
  <!-- Tickets sticking up in window -->
  <rect x="208" y="378" width="10" height="18" rx="1" fill="#f0e030" stroke="#c0b020" stroke-width="1"/>
  <rect x="222" y="374" width="10" height="22" rx="1" fill="#f0a030" stroke="#c07020" stroke-width="1"/>
  <rect x="236" y="380" width="10" height="16" rx="1" fill="#f0e030" stroke="#c0b020" stroke-width="1"/>
  <!-- Ticket lines -->
  <line x1="210" y1="382" x2="216" y2="382" stroke="#a09010" stroke-width="1"/>
  <line x1="210" y1="385" x2="216" y2="385" stroke="#a09010" stroke-width="1"/>
  <line x1="224" y1="379" x2="230" y2="379" stroke="#806010" stroke-width="1"/>
  <line x1="224" y1="382" x2="230" y2="382" stroke="#806010" stroke-width="1"/>

  <!-- Platform / station detail -->
  <rect x="0" y="450" width="80" height="40" rx="3" fill="#c0a870"/>
  <rect x="0" y="445" width="85" height="10" rx="3" fill="#d0b880"/>
  <!-- Station sign -->
  <rect x="5" y="420" width="70" height="24" rx="3" fill="#f0e8d0"/>
  <rect x="5" y="420" width="70" height="24" rx="3" fill="none" stroke="#8b6030" stroke-width="2"/>
  <text x="12" y="436" font-family="sans-serif" font-size="9" fill="#4a2a08">STATION</text>

  <!-- Signal post -->
  <rect x="460" y="380" width="6" height="120" rx="2" fill="#4a4a3a"/>
  <rect x="456" y="380" width="14" height="20" rx="3" fill="#1a1a1a"/>
  <circle cx="463" cy="388" r="5" fill="#cc0000"/>
  <circle cx="463" cy="398" r="5" fill="#00aa00"/>
</svg>
