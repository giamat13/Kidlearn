<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Ocean background -->
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#4a90d9"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6aa8"/>
      <stop offset="100%" style="stop-color:#0a3a5a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#sky2)"/>
  <rect y="300" width="400" height="200" fill="url(#sea)"/>

  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="50" ry="22" fill="white" opacity="0.9"/>
  <ellipse cx="50" cy="65" rx="35" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="110" cy="65" rx="35" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="320" cy="80" rx="45" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="295" cy="85" rx="30" ry="16" fill="white" opacity="0.9"/>
  <ellipse cx="348" cy="85" rx="30" ry="16" fill="white" opacity="0.9"/>

  <!-- Waves -->
  <path d="M0 310 Q50 295 100 310 Q150 325 200 310 Q250 295 300 310 Q350 325 400 310 L400 320 Q350 335 300 320 Q250 305 200 320 Q150 335 100 320 Q50 305 0 320Z" fill="#1a6aa8" opacity="0.5"/>
  <path d="M0 340 Q50 325 100 340 Q150 355 200 340 Q250 325 300 340 Q350 355 400 340 L400 350 Q350 365 300 350 Q250 335 200 350 Q150 365 100 350 Q50 335 0 350Z" fill="#1a5a98" opacity="0.5"/>

  <!-- Pirate ship hull -->
  <path d="M60 350 Q200 330 340 350 L360 420 Q200 440 40 420 Z" fill="#8B4513"/>
  <path d="M60 350 Q200 338 340 350 L340 370 Q200 355 60 370Z" fill="#A0522D"/>
  <!-- Ship planks -->
  <line x1="80" y1="355" x2="75" y2="425" stroke="#6B3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="130" y1="348" x2="122" y2="425" stroke="#6B3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="180" y1="344" x2="174" y2="428" stroke="#6B3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="230" y1="344" x2="226" y2="428" stroke="#6B3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="280" y1="348" x2="278" y2="426" stroke="#6B3410" stroke-width="1.5" opacity="0.5"/>
  <line x1="325" y1="353" x2="326" y2="422" stroke="#6B3410" stroke-width="1.5" opacity="0.5"/>
  <!-- Cannon ports -->
  <ellipse cx="130" cy="390" rx="12" ry="10" fill="#3a1a00"/>
  <ellipse cx="200" cy="388" rx="12" ry="10" fill="#3a1a00"/>
  <ellipse cx="270" cy="390" rx="12" ry="10" fill="#3a1a00"/>
  <!-- Cannons sticking out -->
  <rect x="125" y="387" width="25" height="8" rx="4" fill="#555"/>
  <rect x="195" y="385" width="25" height="8" rx="4" fill="#555"/>
  <rect x="265" y="387" width="25" height="8" rx="4" fill="#555"/>

  <!-- Mast -->
  <rect x="196" y="130" width="8" height="225" fill="#8B4513"/>
  <!-- Crow's nest -->
  <rect x="178" y="148" width="44" height="30" rx="3" fill="#A0522D"/>

  <!-- Sail - main -->
  <rect x="145" y="145" width="110" height="120" rx="3" fill="#F5F5DC"/>
  <!-- Skull and crossbones on sail -->
  <circle cx="200" cy="185" r="22" fill="#1a1a1a"/>
  <circle cx="192" cy="181" r="6" fill="white"/>
  <circle cx="208" cy="181" r="6" fill="white"/>
  <ellipse cx="200" cy="194" rx="12" ry="8" fill="white"/>
  <rect x="196" y="197" width="3" height="6" fill="#1a1a1a"/>
  <rect x="201" y="197" width="3" height="6" fill="#1a1a1a"/>
  <line x1="183" y1="202" x2="217" y2="210" stroke="white" stroke-width="3"/>
  <line x1="183" y1="210" x2="217" y2="202" stroke="white" stroke-width="3"/>
  <!-- DIFF 1: Sail has 4 rope lines (right has 2) -->
  <line x1="145" y1="165" x2="196" y2="165" stroke="#888" stroke-width="1.5"/>
  <line x1="255" y1="165" x2="204" y2="165" stroke="#888" stroke-width="1.5"/>
  <line x1="145" y1="195" x2="196" y2="195" stroke="#888" stroke-width="1.5"/>
  <line x1="255" y1="195" x2="204" y2="195" stroke="#888" stroke-width="1.5"/>

  <!-- Top sail -->
  <path d="M200 130 L155 148 L245 148 Z" fill="#F5F5DC"/>

  <!-- Pirate flag at top -->
  <line x1="200" y1="130" x2="200" y2="100" stroke="#8B4513" stroke-width="3"/>
  <rect x="200" y="100" width="50" height="30" fill="black"/>
  <!-- Mini skull on flag -->
  <circle cx="222" cy="112" r="6" fill="white"/>
  <circle cx="219" cy="110" r="2" fill="black"/>
  <circle cx="225" cy="110" r="2" fill="black"/>
  <line x1="215" y1="120" x2="229" y2="125" stroke="white" stroke-width="2"/>
  <line x1="215" y1="125" x2="229" y2="120" stroke="white" stroke-width="2"/>

  <!-- Pirate captain on deck -->
  <!-- Boots -->
  <rect x="170" y="430" width="28" height="25" rx="5" fill="#3a1a00"/>
  <rect x="202" y="430" width="28" height="25" rx="5" fill="#3a1a00"/>
  <!-- Pants -->
  <rect x="172" y="370" width="58" height="68" fill="#CC8800"/>
  <line x1="201" y1="370" x2="201" y2="438" stroke="#AA6600" stroke-width="2"/>
  <!-- Belt -->
  <rect x="170" y="368" width="62" height="10" fill="#3a1a00"/>
  <rect x="194" y="364" width="14" height="18" rx="2" fill="#FFD700"/>
  <!-- Coat -->
  <rect x="162" y="285" width="78" height="90" rx="8" fill="#8B0000"/>
  <!-- Coat lapels -->
  <polygon points="200,285 180,305 200,300" fill="#6B0000"/>
  <polygon points="200,285 220,305 200,300" fill="#6B0000"/>
  <!-- DIFF 2: 4 gold coat buttons (right has 2) -->
  <circle cx="200" cy="305" r="5" fill="#FFD700"/>
  <circle cx="200" cy="320" r="5" fill="#FFD700"/>
  <circle cx="200" cy="335" r="5" fill="#FFD700"/>
  <circle cx="200" cy="350" r="5" fill="#FFD700"/>
  <!-- Coat trim -->
  <line x1="162" y1="285" x2="162" y2="375" stroke="#FFD700" stroke-width="2"/>
  <line x1="240" y1="285" x2="240" y2="375" stroke="#FFD700" stroke-width="2"/>

  <!-- Arms -->
  <rect x="130" y="290" width="35" height="22" rx="10" fill="#8B0000" transform="rotate(20 130 290)"/>
  <rect x="240" y="290" width="35" height="22" rx="10" fill="#8B0000" transform="rotate(-20 275 290)"/>
  <!-- Hook hand on right -->
  <circle cx="262" cy="318" r="10" fill="#FDBCB4"/>
  <path d="M268 318 Q282 316 285 308 Q288 298 280 295" stroke="#888" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Left hand holding map -->
  <rect x="108" y="318" width="30" height="22" rx="3" fill="#F5DEB3" transform="rotate(10 108 318)"/>
  <!-- DIFF 3: Map has 5 dots (right has 2) -->
  <circle cx="113" cy="323" r="2" fill="#8B4513"/>
  <circle cx="120" cy="319" r="2" fill="#8B4513"/>
  <circle cx="127" cy="324" r="2" fill="#8B4513"/>
  <circle cx="118" cy="330" r="2" fill="#8B4513"/>
  <circle cx="125" cy="332" r="2" fill="#8B4513"/>
  <!-- X marks the spot -->
  <text x="128" y="328" font-size="10" fill="#CC0000">✕</text>

  <!-- Head -->
  <circle cx="200" cy="258" r="42" fill="#FDBCB4"/>
  <!-- Pirate hat -->
  <rect x="162" y="215" width="76" height="18" rx="3" fill="#1a1a1a"/>
  <path d="M172 215 Q200 185 228 215 Z" fill="#1a1a1a"/>
  <rect x="188" y="200" width="24" height="20" fill="#1a1a1a"/>
  <!-- Skull on hat -->
  <circle cx="200" cy="200" r="10" fill="white"/>
  <circle cx="196" cy="198" r="2.5" fill="black"/>
  <circle cx="204" cy="198" r="2.5" fill="black"/>
  <line x1="193" y1="207" x2="207" y2="210" stroke="black" stroke-width="1.5"/>
  <line x1="193" y1="210" x2="207" y2="207" stroke="black" stroke-width="1.5"/>

  <!-- Eyepatch -->
  <ellipse cx="188" cy="255" rx="13" ry="11" fill="black"/>
  <line x1="175" y1="250" x2="202" y2="248" stroke="black" stroke-width="2"/>
  <!-- Eye -->
  <ellipse cx="213" cy="256" rx="7" ry="6" fill="white"/>
  <circle cx="213" cy="256" r="4" fill="#3a2000"/>
  <circle cx="214" cy="254" r="1.5" fill="black"/>
  <!-- Nose -->
  <ellipse cx="200" cy="265" rx="4" ry="3" fill="#e8a090"/>
  <!-- Scar -->
  <path d="M220 248 L225 270" stroke="#CC4422" stroke-width="2"/>
  <!-- Mouth / grin -->
  <path d="M188 275 Q200 283 212 275" stroke="#8B4513" stroke-width="2" fill="none"/>
  <!-- Beard -->
  <path d="M170 270 Q180 295 200 300 Q220 295 230 270" fill="#3a2000"/>

  <!-- Parrot on shoulder -->
  <ellipse cx="150" cy="285" rx="15" ry="18" fill="#FF4400"/>
  <circle cx="150" cy="272" r="10" fill="#FF6600"/>
  <circle cx="147" cy="269" r="3" fill="black"/>
  <circle cx="148" cy="268" r="1.5" fill="white"/>
  <path d="M148 275 L144 280 L152 278Z" fill="#FFD700"/>
  <!-- Parrot wing -->
  <path d="M155 282 Q168 278 165 292 Z" fill="#00AA00"/>
  <!-- DIFF 4: Parrot has 5 tail feathers (right has 2) -->
  <line x1="153" y1="300" x2="148" y2="320" stroke="#FF4400" stroke-width="3"/>
  <line x1="150" y1="302" x2="143" y2="322" stroke="#00AA00" stroke-width="3"/>
  <line x1="156" y1="302" x2="153" y2="324" stroke="#FFDD00" stroke-width="3"/>
  <line x1="159" y1="300" x2="158" y2="322" stroke="#FF4400" stroke-width="3"/>
  <line x1="162" y1="298" x2="163" y2="320" stroke="#00AA00" stroke-width="3"/>

  <!-- Treasure island in background -->
  <ellipse cx="340" cy="310" rx="50" ry="20" fill="#F5DEB3"/>
  <ellipse cx="340" cy="305" rx="45" ry="15" fill="#F5DEB3"/>
  <!-- Palm trees on island -->
  <line x1="325" y1="305" x2="322" y2="270" stroke="#8B4513" stroke-width="4"/>
  <ellipse cx="320" cy="268" rx="18" ry="10" fill="#228B22" transform="rotate(-20 320 268)"/>
  <line x1="355" y1="303" x2="358" y2="268" stroke="#8B4513" stroke-width="4"/>
  <ellipse cx="360" cy="266" rx="18" ry="10" fill="#228B22" transform="rotate(15 360 266)"/>
  <!-- DIFF 5: X marks on island floor - 4 marks (right has 1) -->
  <text x="325" y="308" font-size="14" fill="#CC0000">✕</text>
  <text x="340" y="312" font-size="12" fill="#CC0000">✕</text>
  <text x="355" y="308" font-size="10" fill="#CC0000">✕</text>
  <text x="332" y="318" font-size="11" fill="#CC0000">✕</text>
</svg>
