<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עיר לבנייה</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <button class="back-btn" onclick="window.location.href='../index.html'" data-gamepad-back>← חזור</button>
        <h1>🏘️ עיר לבנייה</h1>
        <p class="subtitle">בונים בתים ודרכים עם המטבעות שצברתם</p>
    </header>

    <div class="balance">יש לכם <strong id="balance">0</strong> 🪙</div>

    <div class="shop" id="shop" role="radiogroup" aria-label="מה לבנות"></div>

    <p class="hint" id="hint">בחרו מבנה, ואז לחצו על חלקה ריקה. לחיצה על מבנה קיים מחזירה חצי מחירו.</p>

    <div class="grid" id="grid" aria-label="העיר שלכם"></div>

    <p class="counts" id="counts"></p>
    <div class="feedback" id="feedback" aria-live="polite"></div>
</div>

<script src="../shared/kidlearn-wallet.js"></script>
<script src="game.js"></script>
<script src="../effects/gamepad-ui.js"></script>
</body>
</html>
