<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>משחק אותיות נופלות - שמות האותיות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
        
        body {
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(to bottom, #f0f9ff, #e0f2fe);
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .letter {
            position: absolute;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            z-index: 10;
            white-space: nowrap;
            will-change: transform;
            display: block;
        }

        .letter:active {
            transform: scale(0.8);
        }

        .score-pop {
            position: absolute;
            animation: fadeUp 1s forwards;
            pointer-events: none;
            font-weight: bold;
            z-index: 100;
        }

        .score-pop.letter-changed-pop {
            animation: fadeUpBig 1.8s forwards;
            font-size: 1.5rem;
            background: #fff3cd;
            border: 2px solid #f59e0b;
            padding: 6px 14px;
            border-radius: 12px;
            white-space: nowrap;
        }

        @keyframes fadeUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        @keyframes fadeUpBig {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            20% { transform: translateY(-10px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-80px) scale(1); }
        }

        #game-container {
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        .settings-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .checkbox-letter:checked + label {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }

        /* מניעת בחירת טקסט בטעות */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* מסך משחק נגמר */
        .game-over-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-blue-50">

    <!-- ממשק עליון -->
    <div class="fixed top-0 left-0 right-0 p-2 md:p-4 z-40 flex justify-between items-start pointer-events-none">
        <div class="bg-white/80 backdrop-blur p-2 md:p-4 rounded-2xl shadow-lg pointer-events-auto border-2 border-blue-400">
            <div class="text-lg md:text-xl font-bold text-blue-800">ניקוד: <span id="score-display">0</span></div>
            <div class="text-xs md:text-sm text-blue-600">יעד: <span id="target-count-display">0</span>/<span id="goal-display">5</span></div>
            <div class="flex items-center gap-1 mt-2">
                <span class="text-xs md:text-sm text-red-600 font-bold">חיים:</span>
                <div id="lives-display" class="flex gap-1"></div>
            </div>
        </div>
        
        <div class="flex flex-col items-center gap-2">
            <div id="target-card" class="bg-white/90 p-2 md:p-4 rounded-2xl shadow-lg text-center pointer-events-auto border-2 border-purple-400 min-w-[80px] md:min-w-[120px]">
                <div class="text-[10px] md:text-sm font-bold text-gray-500 mb-1">חפש את האות:</div>
                <div id="target-letter-display" class="text-3xl md:text-5xl font-black text-purple-600">?</div>
                <button onclick="speakTarget()" class="mt-2 bg-purple-500 text-white px-2 py-1 rounded-full text-[10px] md:text-xs hover:bg-purple-600 active:scale-95 transition-all flex items-center justify-center gap-1 w-full">
                    <span>🔊 השמע</span>
                </button>
            </div>
            <button onclick="togglePause()" id="pause-btn" class="pointer-events-auto bg-gray-100 p-2 rounded-full shadow-md hover:bg-white transition-colors hidden">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
                    <path id="pause-icon" d="M10 9v6m4-6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <button onclick="toggleSettings(true)" class="pointer-events-auto bg-gray-100 p-2 rounded-full shadow-md hover:bg-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- מסך פתיחה -->
    <div id="start-screen" class="fixed inset-0 z-[100] bg-blue-600/95 flex items-center justify-center p-6 text-center">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full">
            <h1 class="text-3xl md:text-4xl font-black text-blue-600 mb-4">אותיות נופלות</h1>
            <p class="text-gray-600 mb-8 text-base md:text-lg">הקשיבו לשם האות ונסו למצוא אותה!</p>
            <div class="flex flex-col gap-3">
                <button onclick="startGame()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 md:py-4 rounded-2xl text-xl md:text-2xl shadow-xl transform transition active:scale-95">
                    מתחילים!
                </button>
                <button onclick="toggleSettings(true)" class="w-full bg-blue-100 text-blue-700 font-bold py-3 rounded-2xl hover:bg-blue-200 transition">
                    הגדרות הורים
                </button>
            </div>
        </div>
    </div>

    <!-- מסך Game Over -->
    <div id="game-over-screen" class="fixed inset-0 z-[100] game-over-overlay hidden items-center justify-center p-6 text-center">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full">
            <h1 class="text-3xl md:text-4xl font-black text-red-600 mb-4">המשחק נגמר!</h1>
            <p class="text-gray-600 mb-4 text-base md:text-lg">הניקוד שלך:</p>
            <div class="text-5xl md:text-6xl font-black text-blue-600 mb-8" id="final-score-display">0</div>
            <div class="flex flex-col gap-3">
                <button onclick="restartGame()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 md:py-4 rounded-2xl text-xl md:text-2xl shadow-xl transform transition active:scale-95">
                    שחק שוב
                </button>
                <button onclick="backToMenu()" class="w-full bg-blue-100 text-blue-700 font-bold py-3 rounded-2xl hover:bg-blue-200 transition" data-gamepad-back>
                    חזרה לתפריט
                </button>
            </div>
        </div>
    </div>

    <!-- פאנל הגדרות -->
    <div id="settings-panel" class="fixed inset-0 z-[110] settings-overlay hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-4 md:p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-xl md:text-2xl font-bold text-gray-800">הגדרות משחק</h2>
                <button onclick="toggleSettings(false)" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-4 md:p-6 overflow-y-auto flex-1 space-y-6 text-right">
                <!-- בורר עוצמה -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-base md:text-lg font-bold text-gray-800">עוצמת קול</span>
                        <span id="volume-val" class="text-blue-600 font-bold">100%</span>
                    </div>
                    <input type="range" id="volume-range" min="0" max="1" step="0.1" value="1" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateSettingsPreview()">
                </div>

                <!-- בורר מהירות -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-base md:text-lg font-bold text-gray-800">מהירות התחלתית</span>
                        <span id="speed-val" class="text-blue-600 font-bold">רגילה</span>
                    </div>
                    <input type="range" id="speed-range" min="0.5" max="3" step="0.25" value="1.2" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateSettingsPreview()">
                </div>

                <!-- בורר חיים -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-base md:text-lg font-bold text-gray-800">מספר חיים</span>
                        <span id="lives-val" class="text-blue-600 font-bold">3</span>
                    </div>
                    <input type="range" id="lives-range" min="1" max="10" step="1" value="3" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateSettingsPreview()">
                </div>

                <!-- מצב הקשבה -->
                <div class="flex items-center justify-between bg-blue-50 p-4 rounded-2xl">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="hide-letter-toggle" class="sr-only peer">
                        <div class="w-12 h-6 md:w-14 md:h-7 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 md:after:h-6 md:after:w-6 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                    <div class="mr-3 text-right">
                        <span class="block text-base md:text-lg font-bold text-gray-800">מצב "הקשבה"</span>
                        <span class="text-xs text-gray-600 italic">זיהוי לפי שם האות בלבד</span>
                    </div>
                </div>

                <!-- סיכוי להפסיד חיה -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-base md:text-lg font-bold text-gray-800">סיכוי לאבד חיה כשאות נופלת</span>
                        <span id="miss-chance-val" class="text-blue-600 font-bold">33%</span>
                    </div>
                    <input type="range" id="miss-chance-range" min="0" max="1" step="0.01" value="0.33" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateSettingsPreview()">
                </div>

                <!-- בחירת אותיות -->
                <div>
                    <h3 class="text-base md:text-lg font-bold text-gray-800 mb-4 border-r-4 border-blue-500 pr-3">בחירת אותיות</h3>
                    <div class="grid grid-cols-5 md:grid-cols-6 gap-2" id="letters-selector-grid"></div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="selectAllLetters(true)" class="flex-1 bg-gray-100 py-2 rounded-xl text-xs md:text-sm font-bold text-gray-600 hover:bg-gray-200">בחר הכל</button>
                        <button onclick="selectAllLetters(false)" class="flex-1 bg-gray-100 py-2 rounded-xl text-xs md:text-sm font-bold text-gray-600 hover:bg-gray-200">נקה הכל</button>
                    </div>
                </div>
            </div>

            <div class="p-4 md:p-6 border-t border-gray-100 bg-gray-50">
                <button onclick="saveAndCloseSettings()" class="w-full bg-blue-600 text-white font-bold py-3 md:py-4 rounded-2xl shadow-lg hover:bg-blue-700 transition active:scale-95">
                    שמור וחזור
                </button>
            </div>
        </div>
    </div>

    <!-- מסך השהיה -->
    <div id="pause-screen" class="fixed inset-0 z-[90] hidden items-center justify-center" style="background-color: rgba(0,0,0,0.6); backdrop-filter: blur(6px);">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
            <div class="text-5xl mb-4">⏸️</div>
            <h2 class="text-2xl md:text-3xl font-black text-gray-800 mb-6">משחק מושהה</h2>
            <div class="flex flex-col gap-3">
                <button onclick="togglePause()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-2xl text-xl shadow-xl transition active:scale-95">
                    המשך ▶
                </button>
                <button onclick="backToMenu()" class="w-full bg-blue-100 text-blue-700 font-bold py-3 rounded-2xl hover:bg-blue-200 transition" data-gamepad-back>
                    חזרה לתפריט
                </button>
            </div>
        </div>
    </div>

    <!-- מכל המשחק -->
    <div id="game-container"></div>

    <!-- תצוגת אות גדולה במרכז המסך -->
    <div id="big-letter-overlay" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none" style="display:none!important;">
        <div id="big-letter-box" class="flex flex-col items-center justify-center gap-4">
            <div id="big-letter-char" class="font-black" style="font-size: clamp(160px, 30vw, 320px); line-height:1; filter: drop-shadow(0 8px 32px rgba(0,0,0,0.25));"></div>
            <div id="big-letter-name" class="font-bold text-white" style="font-size: clamp(32px, 6vw, 72px); text-shadow: 0 4px 16px rgba(0,0,0,0.4);"></div>
        </div>
    </div>

    <script>
        // טעינת פונטים מ-fonts.json
        let availableFonts = [];

        async function loadFonts() {
            try {
                const res = await fetch('../effects/fonts.json');
                const data = await res.json();
                // Filter only Hebrew-compatible fonts
                availableFonts = data.filter(font => font.hebrew === true);
                // הזרקת כל הפונטים ל-Google Fonts בבת אחת
                const families = availableFonts
                    .map(f => f.family.split(',')[0].trim().replace(/ /g, '+'))
                    .join('&family=');
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${families}&display=swap`;
                document.head.appendChild(link);
            } catch(e) {
                console.warn('fonts.json לא נטען, ממשיך ללא פונטים מיוחדים', e);
            }
        }

        function getRandomFont() {
            if (!availableFonts.length) return null;
            return availableFonts[Math.floor(Math.random() * availableFonts.length)];
        }

        const letterNames = {
            'א': 'אלף', 'ב': 'בית', 'ג': 'גימל', 'ד': 'דלת', 'ה': 'הא', 'ו': 'וו', 'ז': 'זין',
            'ח': 'חית', 'ט': 'טית', 'י': 'יוד', 'כ': 'כף', 'ל': 'למד', 'מ': 'מם', 'נ': 'נון',
            'ס': 'סמך', 'ע': 'עין', 'פ': 'פא', 'צ': 'צדי', 'ק': 'קוף', 'ר': 'ריש', 'ש': 'שין', 'ת': 'תיו'
        };

        const allHebrewLetters = Object.keys(letterNames);
        const colors = ['text-red-500', 'text-blue-500', 'text-green-500', 'text-yellow-500', 'text-purple-500', 'text-pink-500', 'text-orange-500'];
        
        let settings = {
            enabledLetters: [...allHebrewLetters],
            hideTargetLetter: false,
            baseSpeed: 1.2,
            volume: 1.0,
            maxLives: 5,
            missChance: 0.33
        };

        let score = 0;
        let lives = 3;
        let currentTarget = '';
        let previousTarget = ''; // האות הקודמת שהיתה מטרה
        let targetCollected = 0;
        let targetGoal = 5;
        let gameActive = false;
        let spawnInterval;
        let levelTransitioning = false; // דגל חדש למניעת בעיות במעבר רמות
        let gamePaused = false;
        const synth = window.speechSynthesis;
        const gameContainer = document.getElementById('game-container');

        function loadSettings() {
            const saved = localStorage.getItem('falling_letters_v3_config');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // וודא שהאותיות המופעלות לא ריקות
                    if (parsed.enabledLetters && parsed.enabledLetters.length > 0) {
                        settings = {...settings, ...parsed};
                    } else {
                        settings = {...settings, volume: parsed.volume, baseSpeed: parsed.baseSpeed, hideTargetLetter: parsed.hideTargetLetter, maxLives: parsed.maxLives || 3};
                    }
                } catch (e) { console.error(e); }
            }
            applySettingsToUI();
        }

        function saveSettings() {
            localStorage.setItem('falling_letters_v3_config', JSON.stringify(settings));
        }

        function applySettingsToUI() {
            document.getElementById('hide-letter-toggle').checked = settings.hideTargetLetter;
            document.getElementById('speed-range').value = settings.baseSpeed;
            document.getElementById('volume-range').value = settings.volume;
            document.getElementById('lives-range').value = settings.maxLives;
            document.getElementById('miss-chance-range').value = settings.missChance;
            updateSettingsPreview();
            renderLettersSelector();
            updateVisualMode();
        }

        function updateSettingsPreview() {
            const vol = document.getElementById('volume-range').value;
            const speed = document.getElementById('speed-range').value;
            const livesCount = document.getElementById('lives-range').value;
            
            const missChance = document.getElementById('miss-chance-range').value;
            document.getElementById('volume-val').innerText = Math.round(vol * 100) + "%";
            document.getElementById('lives-val').innerText = livesCount;
            document.getElementById('miss-chance-val').innerText = Math.round(missChance * 100) + "%";
            
            let speedText = "רגילה";
            if (speed < 1) speedText = "איטית";
            if (speed > 1.5) speedText = "מהירה";
            if (speed > 2.2) speedText = "מהירה מאוד";
            document.getElementById('speed-val').innerText = speedText;
        }

        function renderLettersSelector() {
            const grid = document.getElementById('letters-selector-grid');
            grid.innerHTML = '';
            allHebrewLetters.forEach(char => {
                const isChecked = settings.enabledLetters.includes(char);
                const div = document.createElement('div');
                div.innerHTML = `
                    <input type="checkbox" id="check-${char}" class="checkbox-letter sr-only" ${isChecked ? 'checked' : ''} onchange="toggleLetter('${char}')">
                    <label for="check-${char}" class="flex items-center justify-center h-10 rounded-xl border-2 border-gray-200 font-bold text-lg cursor-pointer transition-all">
                        ${char}
                    </label>
                `;
                grid.appendChild(div);
            });
        }

        function toggleLetter(char) {
            const index = settings.enabledLetters.indexOf(char);
            if (index > -1) settings.enabledLetters.splice(index, 1);
            else settings.enabledLetters.push(char);
        }

        function selectAllLetters(select) {
            settings.enabledLetters = select ? [...allHebrewLetters] : [];
            renderLettersSelector();
        }

        function toggleSettings(show) {
            const panel = document.getElementById('settings-panel');
            panel.style.display = show ? 'flex' : 'none';
        }

        function saveAndCloseSettings() {
            if (settings.enabledLetters.length === 0) {
                // אל תאפשר לסגור בלי אותיות
                settings.enabledLetters = [...allHebrewLetters];
                renderLettersSelector();
            }
            settings.hideTargetLetter = document.getElementById('hide-letter-toggle').checked;
            settings.baseSpeed = parseFloat(document.getElementById('speed-range').value);
            settings.volume = parseFloat(document.getElementById('volume-range').value);
            settings.maxLives = parseInt(document.getElementById('lives-range').value);
            settings.missChance = parseFloat(document.getElementById('miss-chance-range').value);
            saveSettings();
            toggleSettings(false);
            updateVisualMode();
            if (gameActive) {
                lives = settings.maxLives;
                updateLivesDisplay();
                nextLevel();
            }
        }

        function showBigLetter(char) {
            const overlay = document.getElementById('big-letter-overlay');
            const charEl = document.getElementById('big-letter-char');
            const nameEl = document.getElementById('big-letter-name');
            const colors6 = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899','#f97316'];
            const color = colors6[Math.floor(Math.random() * colors6.length)];
            charEl.innerText = char;
            charEl.style.color = color;
            nameEl.innerText = letterNames[char] || char;
            overlay.style.removeProperty('display');
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            // fade out after 1.8s
            setTimeout(() => {
                overlay.style.transition = 'opacity 0.5s';
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; overlay.style.transition = ''; }, 500);
            }, 1800);
        }

        function speak(text) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'he-IL';
            utterance.volume = settings.volume;
            utterance.rate = 0.85;
            synth.speak(utterance);
        }

        function speakLetterName(char, prefix = "") {
            const name = letterNames[char] || char;
            speak(prefix + name);
        }

        function speakTarget() { if (currentTarget) speakLetterName(currentTarget); }

        function updateLivesDisplay() {
            const livesEl = document.getElementById('lives-display');
            livesEl.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                livesEl.innerHTML += '<span class="text-lg md:text-xl">❤️</span>';
            }
            for (let i = lives; i < settings.maxLives; i++) {
                livesEl.innerHTML += '<span class="text-lg md:text-xl opacity-30">🖤</span>';
            }
        }

        function togglePause() {
            if (!gameActive) return;
            gamePaused = !gamePaused;
            const pauseScreen = document.getElementById('pause-screen');
            const pauseBtn = document.getElementById('pause-btn');
            if (gamePaused) {
                pauseScreen.style.display = 'flex';
                synth.cancel();
                pauseBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg>`;
            } else {
                pauseScreen.style.display = 'none';
                pauseBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6"/></svg>`;
            }
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('pause-btn').classList.remove('hidden');
            gameActive = true;
            gamePaused = false;
            levelTransitioning = false;
            score = 0;
            lives = settings.maxLives;
            previousTarget = '';
            document.getElementById('score-display').innerText = "0";
            updateLivesDisplay();
            nextLevel();
            startSpawning();
        }

        function nextLevel() {
            levelTransitioning = false; // אפס את הדגל
            targetCollected = 0;
            targetGoal = Math.min(3 + Math.floor(score / 50), 12);
            const allowed = settings.enabledLetters.length > 0 ? settings.enabledLetters : allHebrewLetters;
            previousTarget = currentTarget; // שמור את האות הקודמת
            currentTarget = allowed[Math.floor(Math.random() * allowed.length)];
            // ודא שהאות החדשה שונה מהקודמת (אם יש מספיק אותיות)
            if (allowed.length > 1) {
                while (currentTarget === previousTarget) {
                    currentTarget = allowed[Math.floor(Math.random() * allowed.length)];
                }
            }
            updateVisualMode();
            document.getElementById('target-count-display').innerText = "0";
            document.getElementById('goal-display').innerText = targetGoal;
            speak("מצא את האות");
            showBigLetter(currentTarget);
        }

        function updateVisualMode() {
            const displayEl = document.getElementById('target-letter-display');
            if (settings.hideTargetLetter) {
                displayEl.innerHTML = `<span class="text-2xl md:text-3xl text-gray-300">?</span>`;
            } else if (currentTarget) {
                displayEl.innerText = currentTarget;
            }
        }

        function startSpawning() {
            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(() => {
                if (gameActive && !levelTransitioning) {
                    createLetter();
                }
            }, 1000 - Math.min(score, 500)); 
        }

        function createLetter() {
            const allowed = settings.enabledLetters.length > 0 ? settings.enabledLetters : allHebrewLetters;
            const letterEl = document.createElement('div');
            const isTarget = Math.random() > 0.65; 
            const char = isTarget ? currentTarget : allowed[Math.floor(Math.random() * allowed.length)];
            const colorClass = colors[Math.floor(Math.random() * colors.length)];
            
            const minSize = window.innerWidth < 640 ? 55 : 70;
            const size = Math.floor(Math.random() * 15) + minSize;
            
            const startX = Math.random() * (window.innerWidth - size - 40) + 20;
            
            const randomFont = getRandomFont();
            letterEl.className = `letter font-black ${colorClass}${randomFont ? ' ' + randomFont.class : ''}`;
            letterEl.style.fontSize = `${size}px`;
            if (randomFont) letterEl.style.fontFamily = randomFont.family;
            letterEl.style.left = `${startX}px`;
            letterEl.style.top = `-100px`;
            letterEl.innerText = char;
            letterEl.dataset.char = char; // שמירת התו למעקב

            const handleInteraction = (e) => {
                e.preventDefault();
                if (!gameActive || levelTransitioning) return;
                
                if (char === currentTarget) {
                    speakLetterName(char, "נכון! זאת האות ");
                    score += 10;
                    targetCollected++;
                    document.getElementById('score-display').innerText = score;
                    document.getElementById('target-count-display').innerText = targetCollected;
                    
                    const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                    const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                    createPopText(clientX, clientY, "+10", "text-green-600");
                    
                    letterEl.remove();
                    
                    if (targetCollected >= targetGoal) {
                        levelTransitioning = true; // הפעל את הדגל
                        setTimeout(() => { 
                            speak("כל הכבוד!"); 
                            nextLevel(); 
                        }, 1200);
                    }
                } else if (char === previousTarget && previousTarget !== '') {
                    // המשתמש לחץ על האות הישנה - מחזירים לו חיה!
                    if (lives < settings.maxLives) {
                        lives++;
                        updateLivesDisplay();
                    }

                    const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                    const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                    createPopText(clientX, clientY, "⚠️ האות התחלפה! +❤️", "text-orange-500", "letter-changed-pop");

                    showBigLetter(currentTarget);
                    speak("שים לב! האות התחלפה. מצא את האות " + (letterNames[currentTarget] || currentTarget));

                    letterEl.remove();
                } else {
                    speakLetterName(char, "זאת האות ");
                    score = Math.max(0, score - 5);
                    lives--;
                    
                    document.getElementById('score-display').innerText = score;
                    updateLivesDisplay();
                    
                    const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                    const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                    createPopText(clientX, clientY, "X", "text-red-600");
                    
                    if (lives <= 0) {
                        endGame();
                    }
                }
            };

            letterEl.addEventListener('touchstart', handleInteraction, { passive: false });
            letterEl.addEventListener('mousedown', handleInteraction);

            gameContainer.appendChild(letterEl);

            let currentTop = -100;
            const speed = settings.baseSpeed + (score / 300);
            
            function step() {
                // המשך לנוע גם במעבר רמות
                if (!gameActive || !letterEl.parentNode) return;
                if (gamePaused) { requestAnimationFrame(step); return; }
                
                currentTop += speed;
                letterEl.style.transform = `translateY(${currentTop + 100}px)`;
                
                if (currentTop < window.innerHeight + 100) {
                    requestAnimationFrame(step);
                } else {
                    // אות נפלה למטה בלי ללחוץ עליה
                    if (char === currentTarget && gameActive && !levelTransitioning) {
                        if (Math.random() < settings.missChance) {
                            lives--;
                            updateLivesDisplay();
                            createPopText(window.innerWidth / 2, window.innerHeight - 100, "-1 חיה", "text-red-600");
                            if (lives <= 0) endGame();
                        }
                    }
                    letterEl.remove();
                }
            }
            requestAnimationFrame(step);
        }

        function createPopText(x, y, text, color, extraClass = '') {
            const pop = document.createElement('div');
            pop.className = `score-pop ${color} text-2xl md:text-3xl ${extraClass}`;
            pop.style.left = Math.min(x, window.innerWidth - 220) + 'px';
            pop.style.top = y + 'px';
            pop.innerText = text;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), extraClass ? 1800 : 1000);
        }

        function endGame() {
            gameActive = false;
            gamePaused = false;
            document.getElementById('pause-btn').classList.add('hidden');
            document.getElementById('pause-screen').style.display = 'none';
            clearInterval(spawnInterval);
            
            // נקה את כל האותיות הנופלות
            const letters = document.querySelectorAll('.letter');
            letters.forEach(letter => letter.remove());
            
            // הצג את מסך המשחק נגמר
            document.getElementById('final-score-display').innerText = score;
            document.getElementById('game-over-screen').style.display = 'flex';
            
            speak("המשחק נגמר. הניקוד שלך " + score);
        }

        function restartGame() {
            document.getElementById('game-over-screen').style.display = 'none';
            startGame();
        }

        function backToMenu() {
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            document.getElementById('pause-btn').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            gameActive = false;
            gamePaused = false;
            clearInterval(spawnInterval);
            
            // נקה את כל האותיות הנופלות
            const letters = document.querySelectorAll('.letter');
            letters.forEach(letter => letter.remove());
        }

        window.onload = () => { loadFonts(); loadSettings(); };
    </script>
    <script src="../effects/gamepad-ui.js"></script>
</body>
</html>
