<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק אותיות נופלות - הגדרות מתקדמות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap');
        
        body {
            font-family: 'Assistant', sans-serif;
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(to bottom, #f0f9ff, #e0f2fe);
        }

        .letter {
            position: absolute;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            z-index: 10;
        }

        .letter:active {
            transform: scale(0.8);
        }

        .score-pop {
            position: absolute;
            animation: fadeUp 1s forwards;
            pointer-events: none;
            font-weight: bold;
            z-index: 100;
        }

        @keyframes fadeUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        #game-container {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .settings-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .checkbox-letter:checked + label {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body class="bg-blue-50">

    <!-- Top UI -->
    <div class="fixed top-0 left-0 right-0 p-4 z-40 flex justify-between items-start pointer-events-none">
        <div class="bg-white/80 backdrop-blur p-4 rounded-2xl shadow-lg pointer-events-auto border-2 border-blue-400">
            <div class="text-xl font-bold text-blue-800">ניקוד: <span id="score-display">0</span></div>
            <div class="text-sm text-blue-600">יעד: <span id="target-count-display">0</span>/<span id="goal-display">5</span></div>
        </div>
        
        <div class="flex flex-col items-center gap-2">
            <div id="target-card" class="bg-white/90 p-4 rounded-2xl shadow-lg text-center pointer-events-auto border-2 border-purple-400 min-w-[120px]">
                <div class="text-sm font-bold text-gray-500 mb-1">חפש את האות:</div>
                <div id="target-letter-display" class="text-5xl font-black text-purple-600">?</div>
                <button onclick="speakTarget()" class="mt-2 bg-purple-500 text-white px-4 py-1 rounded-full text-xs hover:bg-purple-600 active:scale-95 transition-all flex items-center justify-center gap-1 w-full">
                    <span>🔊 השמע</span>
                </button>
            </div>
            <button onclick="toggleSettings(true)" class="pointer-events-auto bg-gray-100 p-2 rounded-full shadow-md hover:bg-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="fixed inset-0 z-[100] bg-blue-600/95 flex items-center justify-center p-6 text-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full">
            <h1 class="text-4xl font-black text-blue-600 mb-4">אותיות נופלות</h1>
            <p class="text-gray-600 mb-8 text-lg">הקשיבו לאות ונסו למצוא אותה!</p>
            <div class="flex flex-col gap-3">
                <button onclick="startGame()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl text-2xl shadow-xl transform transition active:scale-95">
                    מתחילים!
                </button>
                <button onclick="toggleSettings(true)" class="w-full bg-blue-100 text-blue-700 font-bold py-3 rounded-2xl hover:bg-blue-200 transition">
                    הגדרות הורים
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="fixed inset-0 z-[110] settings-overlay hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-2xl font-bold text-gray-800">הגדרות משחק</h2>
                <button onclick="toggleSettings(false)" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1 space-y-6 text-right">
                <!-- Volume Slider -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-bold text-gray-800">עוצמת קול</span>
                        <span id="volume-val" class="text-blue-600 font-bold">100%</span>
                    </div>
                    <input type="range" id="volume-range" min="0" max="1" step="0.1" value="1" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateSettingsPreview()">
                </div>

                <!-- Game Speed Slider -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-bold text-gray-800">מהירות משחק התחלתית</span>
                        <span id="speed-val" class="text-blue-600 font-bold">רגילה</span>
                    </div>
                    <input type="range" id="speed-range" min="0.5" max="3" step="0.25" value="1.2" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateSettingsPreview()">
                </div>

                <!-- Listening Mode Toggle -->
                <div class="flex items-center justify-between bg-blue-50 p-4 rounded-2xl">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="hide-letter-toggle" class="sr-only peer">
                        <div class="w-14 h-7 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                    <div class="mr-3 text-right">
                        <span class="block text-lg font-bold text-gray-800">מצב "הקשבה"</span>
                        <span class="text-sm text-gray-600 italic">הסתרת האות מלמעלה (רק קריינות)</span>
                    </div>
                </div>

                <!-- Letter Selection -->
                <div>
                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-r-4 border-blue-500 pr-3">בחירת אותיות למשחק</h3>
                    <div class="grid grid-cols-6 gap-2" id="letters-selector-grid"></div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="selectAllLetters(true)" class="flex-1 bg-gray-100 py-2 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-200">בחר הכל</button>
                        <button onclick="selectAllLetters(false)" class="flex-1 bg-gray-100 py-2 rounded-xl text-sm font-bold text-gray-600 hover:bg-gray-200">נקה הכל</button>
                    </div>
                </div>
            </div>

            <div class="p-6 border-t border-gray-100 bg-gray-50">
                <button onclick="saveAndCloseSettings()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-blue-700 transition active:scale-95">
                    שמור וחזור למשחק
                </button>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container"></div>

    <script>
        const allHebrewLetters = "אבגדהוזחטיכלמנסעפצקרשת".split("");
        const colors = ['text-red-500', 'text-blue-500', 'text-green-500', 'text-yellow-500', 'text-purple-500', 'text-pink-500', 'text-orange-500'];
        
        let settings = {
            enabledLetters: [...allHebrewLetters],
            hideTargetLetter: false,
            baseSpeed: 1.2,
            volume: 1.0
        };

        let score = 0;
        let currentTarget = '';
        let targetCollected = 0;
        let targetGoal = 5;
        let gameActive = false;
        let spawnInterval;
        const synth = window.speechSynthesis;
        const gameContainer = document.getElementById('game-container');

        function loadSettings() {
            const saved = localStorage.getItem('falling_letters_v2_config');
            if (saved) {
                try {
                    settings = {...settings, ...JSON.parse(saved)};
                } catch (e) { console.error(e); }
            }
            applySettingsToUI();
        }

        function saveSettings() {
            localStorage.setItem('falling_letters_v2_config', JSON.stringify(settings));
        }

        function applySettingsToUI() {
            document.getElementById('hide-letter-toggle').checked = settings.hideTargetLetter;
            document.getElementById('speed-range').value = settings.baseSpeed;
            document.getElementById('volume-range').value = settings.volume;
            updateSettingsPreview();
            renderLettersSelector();
            updateVisualMode();
        }

        function updateSettingsPreview() {
            const vol = document.getElementById('volume-range').value;
            const speed = document.getElementById('speed-range').value;
            
            document.getElementById('volume-val').innerText = Math.round(vol * 100) + "%";
            
            let speedText = "רגילה";
            if (speed < 1) speedText = "איטית";
            if (speed > 1.5) speedText = "מהירה";
            if (speed > 2.2) speedText = "מהירה מאוד";
            document.getElementById('speed-val').innerText = speedText;
        }

        function renderLettersSelector() {
            const grid = document.getElementById('letters-selector-grid');
            grid.innerHTML = '';
            allHebrewLetters.forEach(char => {
                const isChecked = settings.enabledLetters.includes(char);
                const div = document.createElement('div');
                div.innerHTML = `
                    <input type="checkbox" id="check-${char}" class="checkbox-letter sr-only" ${isChecked ? 'checked' : ''} onchange="toggleLetter('${char}')">
                    <label for="check-${char}" class="flex items-center justify-center h-10 rounded-xl border-2 border-gray-200 font-bold text-lg cursor-pointer transition-all">
                        ${char}
                    </label>
                `;
                grid.appendChild(div);
            });
        }

        function toggleLetter(char) {
            const index = settings.enabledLetters.indexOf(char);
            if (index > -1) settings.enabledLetters.splice(index, 1);
            else settings.enabledLetters.push(char);
        }

        function selectAllLetters(select) {
            settings.enabledLetters = select ? [...allHebrewLetters] : [];
            renderLettersSelector();
        }

        function toggleSettings(show) {
            document.getElementById('settings-panel').classList.toggle('hidden', !show);
            document.getElementById('settings-panel').classList.toggle('flex', show);
        }

        function saveAndCloseSettings() {
            if (settings.enabledLetters.length === 0) {
                alert("יש לבחור לפחות אות אחת!");
                return;
            }
            settings.hideTargetLetter = document.getElementById('hide-letter-toggle').checked;
            settings.baseSpeed = parseFloat(document.getElementById('speed-range').value);
            settings.volume = parseFloat(document.getElementById('volume-range').value);
            
            saveSettings();
            toggleSettings(false);
            updateVisualMode();
            if (gameActive) nextLevel();
        }

        function speak(text) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'he-IL';
            utterance.volume = settings.volume;
            utterance.rate = 0.9;
            synth.speak(utterance);
        }

        function speakTarget() { if (currentTarget) speak(currentTarget); }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            gameActive = true;
            score = 0;
            document.getElementById('score-display').innerText = "0";
            nextLevel();
            startSpawning();
        }

        function nextLevel() {
            targetCollected = 0;
            targetGoal = Math.min(3 + Math.floor(score / 50), 12);
            const allowed = settings.enabledLetters;
            currentTarget = allowed[Math.floor(Math.random() * allowed.length)];
            
            updateVisualMode();
            document.getElementById('target-count-display').innerText = "0";
            document.getElementById('goal-display').innerText = targetGoal;
            speak("מצא את האות " + currentTarget);
        }

        function updateVisualMode() {
            const displayEl = document.getElementById('target-letter-display');
            if (settings.hideTargetLetter) {
                displayEl.innerHTML = `<span class="text-3xl text-gray-300">?</span>`;
            } else if (currentTarget) {
                displayEl.innerText = currentTarget;
            }
        }

        function startSpawning() {
            if (spawnInterval) clearInterval(spawnInterval);
            spawnInterval = setInterval(() => {
                if (gameActive) createLetter();
            }, 1000 - Math.min(score, 500)); // קצב ייצור מהיר יותר ככל שהניקוד עולה
        }

        function createLetter() {
            const allowed = settings.enabledLetters;
            const letterEl = document.createElement('div');
            const isTarget = Math.random() > 0.65; 
            const char = isTarget ? currentTarget : allowed[Math.floor(Math.random() * allowed.length)];
            
            const colorClass = colors[Math.floor(Math.random() * colors.length)];
            const size = Math.floor(Math.random() * 20) + 45;
            const startX = Math.random() * (window.innerWidth - size - 40) + 20;
            
            letterEl.className = `letter font-black ${colorClass}`;
            letterEl.style.fontSize = `${size}px`;
            letterEl.style.left = `${startX}px`;
            letterEl.style.top = `-80px`;
            letterEl.innerText = char;

            letterEl.onclick = (e) => {
                if (!gameActive) return;
                if (char === currentTarget) {
                    score += 10;
                    targetCollected++;
                    document.getElementById('score-display').innerText = score;
                    document.getElementById('target-count-display').innerText = targetCollected;
                    createPopText(e.clientX, e.clientY, "+10", "text-green-600");
                    letterEl.remove();
                    if (targetCollected >= targetGoal) {
                        gameActive = false;
                        setTimeout(() => { speak("יופי!"); gameActive = true; nextLevel(); }, 500);
                    }
                } else {
                    score = Math.max(0, score - 5);
                    document.getElementById('score-display').innerText = score;
                    createPopText(e.clientX, e.clientY, "X", "text-red-600");
                }
            };

            gameContainer.appendChild(letterEl);

            let top = -80;
            // מהירות = בסיס הגדרות + תוספת לפי ניקוד
            const speed = settings.baseSpeed + (score / 200);
            
            function fall() {
                if (!gameActive) { letterEl.remove(); return; }
                top += speed;
                letterEl.style.top = top + 'px';
                if (top < window.innerHeight) requestAnimationFrame(fall);
                else letterEl.remove();
            }
            requestAnimationFrame(fall);
        }

        function createPopText(x, y, text, color) {
            const pop = document.createElement('div');
            pop.className = `score-pop ${color} text-3xl`;
            pop.style.left = x + 'px';
            pop.style.top = y + 'px';
            pop.innerText = text;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
