<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מצלמת חיות חיה</title>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FC; --sky-dark:#D9EEF8; --ink:#22303A; --accent:#1E88C7;
    --muted:#7B8C97; --shadow:rgba(30,60,80,.12);
  }
  *{box-sizing:border-box}
  body{font-family:'Rubik',sans-serif;color:var(--ink);background:var(--sky);
    margin:0;padding:20px 16px 60px;min-height:100vh}
  a.back{display:inline-block;margin:0 0 6px;color:var(--muted);text-decoration:none;font-size:.85rem}
  a.back:hover{color:var(--accent)}
  header.masthead{max-width:640px;margin:8px auto 6px;display:flex;align-items:center;
    justify-content:center;gap:14px}
  .badge{flex:none;width:58px;height:58px;background:var(--sky-dark);
    border:2px dashed var(--accent);border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:28px;box-shadow:0 3px 0 var(--shadow)}
  h1{font-family:'Suez One',serif;color:var(--accent);text-align:center;font-size:2rem;margin:0}
  .subtitle{text-align:center;color:var(--muted);margin:2px 0 22px;font-size:.95rem}

  .card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 22px var(--shadow);
    max-width:640px;margin:0 auto}
  .card iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;display:block}
  .credit{color:var(--muted);font-size:12px;margin:8px 2px 0}

  /* favorites strip - only rendered when at least one cam is favorited */
  .favbar{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;max-height:0;opacity:0;overflow:hidden;
    transition:max-height .3s ease,opacity .25s ease,margin .3s ease}
  .favbar.show{max-height:120px;opacity:1;margin:0 auto 14px}
  .favchip{font-family:'Rubik',sans-serif;font-size:.85rem;font-weight:600;color:var(--ink);
    background:#fff;border:2px solid var(--sky-dark);border-radius:999px;
    padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
    box-shadow:0 3px 0 var(--shadow);transition:.15s}
  .favchip:hover{border-color:var(--accent)}
  .favchip.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* current-channel header row above the iframe */
  .channel-head{display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin:0 2px 10px}
  .channel-head .who{display:flex;align-items:center;gap:8px;font-weight:600}
  .channel-head .who .emoji{font-size:1.4rem}
  .channel-head .who .label{font-size:1.02rem}
  .starbtn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--sky);
    border:2px solid var(--sky-dark);cursor:pointer;font-size:18px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--shadow);
    transition:.15s}
  .starbtn:hover{border-color:var(--accent);color:var(--accent)}
  .starbtn.active{background:#FFF6DE;border-color:#E8B93A;color:#E8B93A}

  /* prev / random / next controls */
  .controls{max-width:640px;margin:16px auto 0;display:flex;gap:10px;
    justify-content:center;flex-wrap:wrap}
  .ctl{font-family:'Rubik',sans-serif;font-size:.9rem;font-weight:600;color:var(--ink);
    background:#fff;border:2px solid var(--sky-dark);border-radius:999px;
    padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:6px;
    box-shadow:0 3px 0 var(--shadow);transition:.15s}
  .ctl:hover{border-color:var(--accent)}
  .ctl.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .ctl.primary:hover{filter:brightness(1.05)}
  .ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
  .ctl:disabled:hover{border-color:var(--sky-dark)}
</style>
</head>
<body>
<a class="back" href="../index.html">⟵ חזרה</a>
<header class="masthead">
  <span class="badge">🐾</span>
  <h1>מצלמת חיות חיה</h1>
</header>
<p class="subtitle">שידור חי, ממש עכשיו, מהטבע</p>

<nav class="favbar" id="favbar"></nav>

<div class="card">
  <div class="channel-head">
    <span class="who"><span class="emoji" id="camEmoji"></span><span class="label" id="camLabel"></span></span>
    <button class="starbtn" id="starBtn" type="button" title="סמן כמועדף">★</button>
  </div>
  <div id="camSlot"></div>
  <p class="credit" id="camCredit"></p>
</div>

<div class="controls">
  <button class="ctl" id="prevBtn" type="button">⟵ הקודם</button>
  <button class="ctl primary" id="nextBtn" type="button">🔀 הבא</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../shared/kidlearn-firebase-config.js"></script>
<script src="../shared/kidlearn-cloud.js"></script>
<script src="../shared/kidlearn-widget.js"></script>
<script>KidLearn.init();</script>
<script>
  // RULE FOR ADDING NEW CAMS: do NOT add a fixed/static single-camera
  // feed, even if it's a genuine 24/7 broadcast. Every cam in this list
  // must be actively operated (pan/tilt/zoom by a human operator) or
  // switch between multiple camera angles/positions, so there's always
  // something in the shot that can change - not just a locked-off frame
  // where only the animal moves. Verify this (e.g. "camera operator",
  // "PTZ", "switches between X cameras/angles") before adding a cam,
  // the same way the video id itself is verified below.
  //
  // Every cam here pins a specific YouTube video id rather than a
  // channel's generic live_stream endpoint (that endpoint returns "video
  // unavailable" whenever the channel isn't broadcasting live at that
  // exact moment, even if the channel itself is fine).
  // On top of that, every cam here is actively operated or switches
  // between multiple camera angles, so there's always something
  // changing rather than one locked-off shot of an empty scene:
  // Brooks Falls + River Watch (Katmai) are run by a live human
  // camera-operator team that pans/zooms/tracks bears in real time;
  // the Big Bear eagle cam has a 10x zoom PTZ camera operators use
  // the same way; RoyalCam's operator pans and zooms on the albatross
  // nest; iPanda's control room switches between ~20 cameras across
  // the panda base. Fixed single-angle cams (Cornell's feeder cams,
  // an aquarium tank cam) were tried and dropped for this reason, even
  // though they were confirmed genuine 24/7 broadcasts - they just sit
  // on one static frame with no camera movement of their own.
  const cams = [
    {
      emoji: '🐻',
      label: 'דובים - אלסקה',
      title: 'שידור חי - מפלי Brooks, אלסקה (Explore.org)',
      src: 'https://www.youtube.com/embed/J7ZrIDvqlic?autoplay=0',
      credit: 'שידור חי של דובים חומים הדגים סלמון במפלי Brooks באלסקה, מ-Explore.org. המצלמה מופעלת בזמן אמת ע״י צוות אנושי שעוקב אחרי הדובים.'
    },
    {
      emoji: '🪶',
      label: 'אלבטרוס - ניו זילנד',
      title: 'שידור חי - קן אלבטרוס מלכותי, ניו זילנד (RoyalCam)',
      src: 'https://www.youtube.com/embed/Mm_zVDDUeNA?autoplay=0',
      credit: 'שידור חי מקן אלבטרוס מלכותי בחצי האי אוטגו, ניו זילנד, מ-Cornell Lab Bird Cams וה-NZ Dept. of Conservation. המצלמה מופעלת ומזוזת ע״י צוות אנושי.'
    },
    {
      emoji: '🐼',
      label: 'פנדות - סין',
      title: 'שידור חי - פנדות ענק, סין (iPanda)',
      src: 'https://www.youtube.com/embed/live_stream?channel=UCtEgLf0_j1vJLz0aNEdO2SQ&autoplay=0',
      credit: 'שידור חי 24/7 של פנדות ענק מבסיס המחקר בצ׳נגדו, סין, מהערוץ iPanda. חדר בקרה עובר בין כעשרים מצלמות ברחבי הבסיס כדי לתפוס תמיד את הפנדה המעניינת. אם אין שידור פעיל כרגע, נסו שוב מאוחר יותר.'
    },
    {
      emoji: '🐻',
      label: 'דובים - נהר בקטמאי',
      title: 'שידור חי - River Watch, קטמאי, אלסקה (Explore.org)',
      src: 'https://www.youtube.com/embed/wkVLYfU-Kew?autoplay=0',
      credit: 'שידור חי לאורך קטע נהר בפארק הלאומי קטמאי, אלסקה, שם דובים חומים דגים סלמון בקיץ, מ-Explore.org. הערוץ עובר בין כמה זוויות מצלמה סביב הנהר.'
    },
    {
      emoji: '🦅',
      label: 'עיטים - קליפורניה',
      title: 'שידור חי - קן עיט הקירח, ביג בר, קליפורניה (Friends of Big Bear Valley)',
      src: 'https://www.youtube.com/embed/B4-L2nfGcuE?autoplay=0',
      credit: 'שידור חי 24/7 מקן עיט קירח באגם ביג בר, קליפורניה, מ-Friends of Big Bear Valley. המצלמה כוללת זום פי 10 ומופעלת ע״י צוות שמזיז ומקרב אותה בזמן אמת.'
    }
  ];

  const favbarEl = document.getElementById('favbar');
  const slotEl = document.getElementById('camSlot');
  const creditEl = document.getElementById('camCredit');
  const emojiEl = document.getElementById('camEmoji');
  const labelEl = document.getElementById('camLabel');
  const starBtn = document.getElementById('starBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  const FAV_KEY = 'camFavorites';
  function saveFavorites(){
    localStorage.setItem(FAV_KEY, [...favorites].join(','));
    if(window.KidLearn && KidLearn.currentUser()) KidLearn.pushLocalStorageKey(FAV_KEY);
  }
  function loadFavorites(){
    favorites.clear();
    (localStorage.getItem(FAV_KEY) || '')
      .split(',')
      .map(s => parseInt(s, 10))
      .filter(n => Number.isInteger(n) && n >= 0 && n < cams.length)
      .forEach(n => favorites.add(n));
  }

  let current = 0;
  const history = []; // channels actually viewed before the current one, for "הקודם"
  const favorites = new Set();
  loadFavorites();

  KidLearn.onAuthChange(async (profile) => {
    if(!profile) return;
    await KidLearn.pullLocalStorageKey(FAV_KEY);
    loadFavorites();
    showCam(current);
  });

  function showCam(i){
    current = i;
    const cam = cams[i];
    slotEl.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.src = cam.src;
    iframe.title = cam.title;
    iframe.loading = 'lazy';
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    slotEl.appendChild(iframe);
    creditEl.textContent = cam.credit;
    emojiEl.textContent = cam.emoji;
    labelEl.textContent = cam.label;
    starBtn.classList.toggle('active', favorites.has(i));
    renderFavbar();
  }

  function renderFavbar(){
    const list = [...favorites].sort((a,b) => a - b);
    favbarEl.innerHTML = '';
    favbarEl.classList.toggle('show', list.length > 0);
    list.forEach(i => {
      const cam = cams[i];
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'favchip' + (i === current ? ' active' : '');
      chip.innerHTML = `<span>${cam.emoji}</span><span>${cam.label}</span>`;
      chip.addEventListener('click', () => goTo(i));
      favbarEl.appendChild(chip);
    });
  }

  function goTo(i){
    if(i === current) return;
    history.push(current);
    prevBtn.disabled = false;
    showCam(i);
  }

  prevBtn.disabled = true;
  prevBtn.addEventListener('click', () => {
    if(history.length === 0) return;
    showCam(history.pop());
    prevBtn.disabled = history.length === 0;
  });
  nextBtn.addEventListener('click', () => {
    if(cams.length <= 1) return;
    let next;
    do { next = Math.floor(Math.random() * cams.length); } while(next === current);
    goTo(next);
  });
  starBtn.addEventListener('click', () => {
    if(favorites.has(current)) favorites.delete(current);
    else favorites.add(current);
    starBtn.classList.toggle('active', favorites.has(current));
    saveFavorites();
    renderFavbar();
  });

  showCam(0);
</script>
</body>
</html>
