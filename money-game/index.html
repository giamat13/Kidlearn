<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כמה כסף?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <button class="back-btn" onclick="window.location.href='../index.html'" data-gamepad-back>← חזור</button>
        <h1>🪙 כמה כסף?</h1>
        <p class="subtitle">סופרים את המטבעות והשטרות בשקלים</p>
    </header>

    <!-- מסך הגדרות -->
    <section id="setup-screen" class="screen active">
        <h2>עד כמה שקלים?</h2>
        <div class="options">
            <button class="opt" data-max="10">עד 10 ₪<br><small>מטבעות קטנים</small></button>
            <button class="opt selected" data-max="20">עד 20 ₪<br><small>גם שטר של 10 ו־20</small></button>
            <button class="opt" data-max="50">עד 50 ₪<br><small>גם שטר של 50</small></button>
        </div>
        <button class="btn primary" id="startBtn">התחל משחק ✨</button>
    </section>

    <!-- מסך משחק -->
    <section id="game-screen" class="screen">
        <div class="stats">
            <div>ניקוד <strong id="score">0</strong></div>
            <div>שאלה <strong id="qNum">1/10</strong></div>
        </div>
        <p class="prompt">כמה כסף יש כאן?</p>
        <div class="wallet" id="wallet" aria-label="מטבעות ושטרות"></div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- מסך סיום -->
    <section id="end-screen" class="screen">
        <h2 id="endTitle">כל הכבוד! 🎉</h2>
        <div class="final"><span id="finalScore">0</span> <small>נקודות</small></div>
        <p id="endInfo"></p>
        <div class="row">
            <button class="btn primary" id="againBtn">שחק שוב 🔄</button>
            <button class="btn" id="setupBtn">הגדרות ⚙️</button>
        </div>
    </section>
</div>

<script src="../shared/kidlearn-wallet.js"></script>
<script src="game.js"></script>
<script src="../effects/gamepad-ui.js"></script>
</body>
</html>
