<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הזיכרון</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            color: white;
            font-size: 1.2em;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            transform-style: preserve-3d;
        }

        .card:hover:not(.flipped):not(.matched) {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .card.flipped, .card.matched {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .card.matched {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            animation: match 0.5s ease;
        }

        @keyframes match {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            font-size: 1.5em;
        }

        .card:not(.flipped) .card-back {
            display: flex;
        }

        .card.flipped .card-back,
        .card.matched .card-back {
            display: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
        }

        .btn-secondary:hover {
            background: white;
            transform: translateY(-2px);
        }

        .my-cards {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            min-height: 400px;
        }

        .my-cards h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .collected-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
        }

        .collected-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .no-cards {
            text-align: center;
            color: #667eea;
            font-size: 1.2em;
            padding: 50px;
            opacity: 0.7;
        }

        .victory-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .victory-message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        .victory-message h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .victory-message p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.show {
            display: block;
        }

        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .card {
                font-size: 2em;
            }

            h1 {
                font-size: 2em;
            }

            .stats {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 משחק הזיכרון</h1>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('game')">משחק</button>
            <button class="tab" onclick="switchTab('mycards')">הקלפים שלי</button>
        </div>

        <div id="game-tab" class="tab-content active">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">מהלכים</span>
                    <span class="stat-value" id="moves">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">זוגות</span>
                    <span class="stat-value" id="pairs">0/8</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">זמן</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
            </div>

            <div class="game-board" id="gameBoard"></div>

            <div class="controls">
                <button class="btn btn-primary" onclick="startGame()">משחק חדש</button>
                <button class="btn btn-secondary" onclick="resetStats()">איפוס סטטיסטיקות</button>
            </div>
        </div>

        <div id="mycards-tab" class="tab-content">
            <div class="my-cards">
                <h2>הקלפים שאספתי</h2>
                <div class="collected-cards" id="collectedCards">
                    <div class="no-cards">עדיין לא אספת קלפים. שחק כדי לאסוף!</div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="victory-message" id="victoryMessage">
        <h2>🎉 כל הכבוד!</h2>
        <p>סיימת את המשחק!</p>
        <p><strong id="finalStats"></strong></p>
        <button class="btn btn-primary" onclick="closeVictory()">סגור</button>
        <button class="btn" onclick="shareAchievement()" style="background:linear-gradient(135deg,#FF6B9D,#A78BFA);color:#fff;border:none;margin-top:8px;padding:10px 22px;border-radius:50px;font-size:1rem;cursor:pointer;">💌 שלח לאהובים!</button>
    </div>

    <script src="config.js"></script>
    <script src="game.js"></script>
</body>
</html>
