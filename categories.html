<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidLearn - בחר קטגוריה</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B9D;
            --secondary: #FEC163;
            --accent: #67D5B5;
            --purple: #A78BFA;
            --blue: #60A5FA;
            --green: #34D399;
            --orange: #FB923C;
            --bg: #FFF8F0;
            --card-bg: #FFFFFF;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Varela Round', 'Fredoka', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 107, 157, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(103, 213, 181, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(254, 193, 99, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            font-size: 1.3rem;
            color: #666;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px var(--shadow);
            border: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            transition: all 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .category-card.hebrew::before {
            background: linear-gradient(90deg, #FF6B9D, #FF8AB3);
        }

        .category-card.english::before {
            background: linear-gradient(90deg, #60A5FA, #7DD3FC);
        }

        .category-card.math::before {
            background: linear-gradient(90deg, #34D399, #5EEAD4);
        }

        .category-card.knowledge::before {
            background: linear-gradient(90deg, #F59E0B, #FCD34D);
        }

        .category-card.series::before {
            background: linear-gradient(90deg, #8B5CF6, #A78BFA);
        }

        .category-card.games::before {
            background: linear-gradient(90deg, #FEC163, #FBBF24);
        }

        .category-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .category-card.english .category-icon {
            animation-delay: 0.1s;
        }

        .category-card.math .category-icon {
            animation-delay: 0.2s;
        }

        .category-card.games .category-icon {
            animation-delay: 0.3s;
        }

        .category-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #333;
        }

        .category-subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 20px;
        }

        .category-count {
            display: inline-block;
            background: #f0f0f0;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .category-card:hover .category-title {
            color: var(--primary);
        }

        .message {
            color: #444;
            margin-top: 30px;
            font-size: 1.1rem;
            text-align: center;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .categories-grid .category-card:nth-child(1) {
            animation: fadeInDown 0.6s ease-out 0.1s both;
        }

        .categories-grid .category-card:nth-child(2) {
            animation: fadeInDown 0.6s ease-out 0.2s both;
        }

        .categories-grid .category-card:nth-child(3) {
            animation: fadeInDown 0.6s ease-out 0.3s both;
        }

        .categories-grid .category-card:nth-child(4) {
            animation: fadeInDown 0.6s ease-out 0.4s both;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .category-icon {
                font-size: 60px;
            }

            .category-title {
                font-size: 1.5rem;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 KidLearn</h1>
            <p>בחר את הנושא שלך ותחל ללמוד!</p>
            <div id="studentInfo" style="margin-top: 15px; font-size: 1.1rem; color: #666;"></div>
        </div>

        <div class="categories-grid" id="categoriesGrid"></div>
    </div>
    
    <script>
        // Cookie functions
        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return cookie.substring(nameEQ.length);
                }
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        }

        // Display student name if available
        const studentName = getCookie('studentName');
        const studentInfo = document.getElementById('studentInfo');
        if (studentName) {
            studentInfo.textContent = `שלום, ${studentName}! 👋`;
        }

        // Create style for settings button
        const style = document.createElement('style');
        style.textContent = `
            .settings-button {
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: linear-gradient(135deg, #FF6B9D, #A78BFA);
                color: white;
                border: none;
                padding: 12px 25px;
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
                transition: all 0.3s ease;
                z-index: 100;
                font-family: 'Varela Round', sans-serif;
            }

            .settings-button:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
            }
        `;
        document.head.appendChild(style);

        // Create and add settings button
        if (studentName) {
            const settingsBtn = document.createElement('button');
            settingsBtn.className = 'settings-button';
            settingsBtn.textContent = '⚙️ החלף תלמיד';
            settingsBtn.onclick = function() {
                deleteCookie('studentName');
                deleteCookie('studentGrade');
                window.location.href = 'index.html';
            };
            document.body.appendChild(settingsBtn);
        }

        function createCategoryCard(category, visibleCount) {
            const card = document.createElement('div');
            card.className = `category-card ${category.id}`;
            card.onclick = () => {
                window.location.href = `category.html?category=${category.id}`;
            };
            card.innerHTML = `
                <span class="category-icon">${category.icon}</span>
                <div class="category-title">${category.title}</div>
                <div class="category-subtitle">${category.subtitle}</div>
                <span class="category-count">${visibleCount} כלי${visibleCount === 1 ? '' : 'ים'}</span>
            `;
            return card;
        }

        async function renderCategories() {
            try {
                const response = await fetch('games.json');
                const data = await response.json();
                const grade = getCookie('studentGrade');
                const categoriesGrid = document.getElementById('categoriesGrid');

                const visibleCategories = data.categories.map(category => {
                    const visibleCount = data.items.filter(item =>
                        item.categories.includes(category.id) && (!grade || item.grades.includes(grade))
                    ).length;
                    return { category, visibleCount };
                }).filter(entry => entry.visibleCount > 0);

                if (visibleCategories.length === 0) {
                    categoriesGrid.innerHTML = '<div class="message">אין קטגוריות זמינות לכיתה זו.</div>';
                    return;
                }

                visibleCategories.forEach(entry => {
                    categoriesGrid.appendChild(createCategoryCard(entry.category, entry.visibleCount));
                });
            } catch (error) {
                const categoriesGrid = document.getElementById('categoriesGrid');
                categoriesGrid.innerHTML = '<div class="message">שגיאה בטעינת הנתונים. נא לנסות שוב מאוחר יותר.</div>';
            }
        }

        renderCategories();
    </script>
