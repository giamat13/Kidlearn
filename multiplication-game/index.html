<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח הכפל</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <button onclick="window.location.href='../index.html'" data-gamepad-back style="background:#FF6B9D;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;float:right;margin:10px;">← חזור</button>
        <h1>✖️ לוח הכפל</h1>
        <p class="subtitle">ענה מהר — כל שנייה שווה ניקוד!</p>
    </header>

    <!-- מסך הגדרות -->
    <div id="setup-screen">
        <h2>בחר טבלאות לתרגול</h2>
        <div class="tables-grid" id="tablesGrid"></div>
        <div class="select-all-row">
            <button class="btn btn-secondary btn-sm" onclick="selectAll()">בחר הכל</button>
            <button class="btn btn-secondary btn-sm" onclick="clearAll()">נקה הכל</button>
        </div>
        <button class="btn btn-primary" id="startBtn" onclick="startGame()" disabled>התחל משחק ✨</button>
    </div>

    <!-- מסך משחק -->
    <div id="game-screen">
        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">ניקוד</span>
                <span class="stat-value" id="scoreDisplay">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">שאלה</span>
                <span class="stat-value" id="questionNum">1/10</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">רצף 🔥</span>
                <span class="stat-value streak" id="streakDisplay">0</span>
            </div>
        </div>

        <div class="timer-bar-wrap">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <div class="question-card">
            <div class="question-text" id="questionText"></div>
            <div class="live-points" id="livePoints"></div>
        </div>

        <div class="answers-grid" id="answersGrid"></div>
        <div class="feedback" id="feedbackArea"></div>
    </div>

    <!-- מסך סיום -->
    <div id="end-screen">
        <div id="recordBadge" style="display:none" class="record-badge">🏆 שיא חדש!</div>
        <h2 id="endTitle">🎉 כל הכבוד!</h2>
        <div class="final-score">
            <span id="finalScore">0</span>
            <small>נקודות</small>
        </div>
        <div class="end-stats">
            <div class="end-stat">
                <div class="end-stat-label">נכון</div>
                <div class="end-stat-value" id="endCorrect">—</div>
            </div>
            <div class="end-stat">
                <div class="end-stat-label">רצף מקסימלי</div>
                <div class="end-stat-value" id="endStreak">—</div>
            </div>
            <div class="end-stat">
                <div class="end-stat-label">שיא אישי</div>
                <div class="end-stat-value" id="endRecord">—</div>
            </div>
        </div>
        <div class="end-buttons">
            <button class="btn btn-primary" onclick="startGame()">שחק שוב 🔄</button>
            <button class="btn btn-secondary" onclick="goToSetup()">הגדרות ⚙️</button>
        </div>
    </div>
</div>

<script src="game.js"></script>
<script src="../effects/gamepad-ui.js"></script>
</body>
</html>
