<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KidLearn – כניסה</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Varela+Round&display=swap" rel="stylesheet" />

  <style>
    /* ── Design tokens ─────────────────────────────────────── */
    :root {
      --pink:   #FF6B9D;
      --yellow: #FEC163;
      --mint:   #67D5B5;
      --purple: #A78BFA;
      --blue:   #60A5FA;
      --bg:     #FFF8F0;
      --card:   #FFFFFF;
      --text:   #2D2D2D;
      --muted:  #888;
      --radius: 28px;
      --shadow: 0 20px 60px rgba(255,107,157,.18);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Varela Round', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* Animated blobs in background */
    .blobs {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .18;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob:nth-child(1){ width:420px; height:420px; background:var(--pink);   top:-80px;  left:-80px;  animation-duration:14s; }
    .blob:nth-child(2){ width:320px; height:320px; background:var(--mint);   bottom:-60px; right:-60px; animation-duration:10s; }
    .blob:nth-child(3){ width:260px; height:260px; background:var(--yellow); top:40%;    right:5%;    animation-duration:16s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,20px) scale(1.1); }
    }

    /* ── Floating stars ───────────────────────────────────── */
    .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .star {
      position:absolute; border-radius:50%;
      background:var(--yellow);
      animation: twinkle 3s ease-in-out infinite;
      opacity:0;
    }
    @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:.8} }

    /* ── Card ──────────────────────────────────────────────── */
    .card {
      position: relative; z-index: 10;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 480px;
      padding: 44px 40px 48px;
      animation: popIn .7s cubic-bezier(.175,.885,.32,1.275) both;
    }
    @keyframes popIn {
      from { opacity:0; transform:scale(.8) translateY(30px); }
      to   { opacity:1; transform:scale(1)  translateY(0); }
    }

    /* ── Logo ─────────────────────────────────────────────── */
    .logo {
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .logo span {
      display: inline-block;
      background: linear-gradient(135deg, var(--pink), var(--yellow), var(--mint), var(--purple));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: bounce 2s ease-in-out infinite, gradient 4s ease infinite;
    }
    .logo span:nth-child(1){animation-delay:0s}
    .logo span:nth-child(2){animation-delay:.08s}
    .logo span:nth-child(3){animation-delay:.16s}
    .logo span:nth-child(4){animation-delay:.24s}
    .logo span:nth-child(5){animation-delay:.32s}
    .logo span:nth-child(6){animation-delay:.40s}
    .logo span:nth-child(7){animation-delay:.48s}
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes gradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    .tagline {
      text-align:center; color:var(--muted);
      font-size:1rem; margin-bottom:32px;
    }

    /* ── Tab switcher ─────────────────────────────────────── */
    .tabs {
      display: flex;
      background: #F4F0FF;
      border-radius: 50px;
      padding: 5px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab-btn {
      flex:1; border:none; background:transparent;
      font-family:'Fredoka',sans-serif; font-size:1.1rem; font-weight:600;
      padding:12px; border-radius:50px; cursor:pointer;
      color:var(--muted); transition:all .3s ease;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color:#fff;
      box-shadow: 0 4px 16px rgba(255,107,157,.35);
    }

    /* ── Forms ────────────────────────────────────────────── */
    .form-panel { display:none; }
    .form-panel.active { display:block; animation: slideUp .4s ease both; }
    @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .field { margin-bottom:18px; }
    .field label {
      display:block;
      font-family:'Fredoka',sans-serif;
      font-size:1rem; font-weight:600;
      color:var(--pink); margin-bottom:6px;
    }
    .field input, .field select {
      width:100%; padding:14px 20px;
      font-family:'Varela Round',sans-serif; font-size:1rem;
      border:2.5px solid #E8E0FF;
      border-radius:50px;
      background:#FFFEF9;
      color:var(--text);
      transition: all .3s ease;
      appearance:none;
    }
    .field input:focus, .field select:focus {
      outline:none;
      border-color:var(--purple);
      box-shadow:0 0 0 4px rgba(167,139,250,.12);
      transform:scale(1.01);
    }
    .field input::placeholder { color:#ccc; }

    /* grade pills */
    .grade-pills {
      display:flex; flex-wrap:wrap; gap:10px; margin-top:4px;
    }
    .grade-pill {
      font-family:'Fredoka',sans-serif; font-size:.95rem; font-weight:600;
      padding:10px 18px; border:2.5px solid #E8E0FF; border-radius:50px;
      background:#fff; color:var(--muted); cursor:pointer;
      transition: all .25s ease;
    }
    .grade-pill.selected {
      background: linear-gradient(135deg, var(--mint), var(--blue));
      border-color:var(--mint); color:#fff;
      box-shadow:0 4px 14px rgba(103,213,181,.4);
    }

    /* contacts section */
    .contacts-section { margin-top:8px; }
    .contacts-title {
      font-family:'Fredoka',sans-serif; font-size:1rem; font-weight:600;
      color:var(--purple); margin-bottom:10px;
    }
    .contact-row {
      display:grid; grid-template-columns:1fr 1fr 1fr auto;
      gap:8px; margin-bottom:8px; align-items:center;
    }
    .contact-row input {
      padding:10px 14px;
      border:2px solid #E8E0FF; border-radius:16px;
      font-family:'Varela Round',sans-serif; font-size:.85rem;
      background:#FFFEF9; color:var(--text);
      transition:all .3s;
    }
    .contact-row input:focus {
      outline:none; border-color:var(--purple);
      box-shadow:0 0 0 3px rgba(167,139,250,.1);
    }
    .contact-row input::placeholder { color:#ccc; }
    .remove-contact {
      background:none; border:none; cursor:pointer;
      font-size:1.2rem; color:var(--pink); padding:4px;
      transition:transform .2s;
    }
    .remove-contact:hover { transform:scale(1.3); }
    .add-contact-btn {
      background:none; border:2px dashed var(--purple);
      color:var(--purple); font-family:'Fredoka',sans-serif;
      font-size:.95rem; padding:10px 20px; border-radius:50px;
      cursor:pointer; width:100%; margin-top:4px;
      transition:all .3s;
    }
    .add-contact-btn:hover {
      background:var(--purple); color:#fff;
    }

    /* ── Submit button ────────────────────────────────────── */
    .submit-btn {
      width:100%; margin-top:24px;
      font-family:'Fredoka',sans-serif; font-size:1.4rem; font-weight:700;
      padding:16px; border:none; border-radius:50px;
      background: linear-gradient(135deg, var(--mint), var(--blue));
      color:#fff; cursor:pointer;
      box-shadow: 0 6px 20px rgba(103,213,181,.35);
      transition: all .35s cubic-bezier(.175,.885,.32,1.275);
      position:relative; overflow:hidden;
    }
    .submit-btn:hover {
      transform:translateY(-4px) scale(1.03);
      box-shadow:0 12px 35px rgba(96,165,250,.45);
    }
    .submit-btn:active { transform:scale(.97); }
    .submit-btn:disabled {
      background:#ddd; cursor:not-allowed;
      transform:none; box-shadow:none;
    }
    .submit-btn .btn-rocket {
      display:inline-block; margin-right:8px;
      transition:transform .4s ease;
    }
    .submit-btn:hover .btn-rocket { transform:translateX(-6px) rotate(-15deg); }

    /* ── Error / success toast ────────────────────────────── */
    .toast {
      border-radius: 16px; padding:14px 20px;
      font-size:.95rem; margin-top:16px;
      display:none; animation:fadeIn .3s ease;
    }
    .toast.error   { background:#FFF0F5; border:2px solid var(--pink); color:#c0335a; }
    .toast.success { background:#F0FFF9; border:2px solid var(--mint); color:#1a7a5c; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

    /* ── Loading spinner ──────────────────────────────────── */
    .spinner {
      display:inline-block; width:20px; height:20px;
      border:3px solid rgba(255,255,255,.4);
      border-top-color:#fff; border-radius:50%;
      animation:spin .7s linear infinite; vertical-align:middle;
    }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Password strength ────────────────────────────────── */
    .strength-bar {
      height:4px; border-radius:4px; margin-top:6px;
      background:#eee; overflow:hidden;
    }
    .strength-fill {
      height:100%; border-radius:4px; width:0%;
      transition:width .4s, background .4s;
    }

    @media(max-width:500px){
      .card{ padding:30px 22px 36px; }
      .contact-row{ grid-template-columns:1fr 1fr; }
      .contact-row input:last-of-type{ grid-column:span 2; }
    }
  </style>
</head>
<body>

<!-- background blobs -->
<div class="blobs">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>
<div class="stars" id="stars"></div>

<!-- main card -->
<div class="card">

  <!-- Logo -->
  <div class="logo">
    <span>K</span><span>i</span><span>d</span><span>L</span><span>e</span><span>a</span><span>r</span><span>n</span>
  </div>
  <p class="tagline">🌟 כלי למידה מהנים לילדים 🌟</p>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('login')">🚪 כניסה</button>
    <button class="tab-btn"        onclick="switchTab('register')">✨ הרשמה</button>
  </div>

  <!-- ── LOGIN ───────────────────────────────────────────── -->
  <div class="form-panel active" id="loginPanel">

    <div class="field">
      <label>👤 שם משתמש</label>
      <input type="text" id="loginUsername" placeholder="הכנס/י שם משתמש..." autocomplete="username" />
    </div>

    <div class="field">
      <label>🔒 סיסמה</label>
      <input type="password" id="loginPassword" placeholder="הכנס/י סיסמה..." autocomplete="current-password" />
    </div>

    <div class="toast" id="loginToast"></div>

    <button class="submit-btn" id="loginBtn" onclick="doLogin()">
      <span class="btn-rocket">🚀</span>בואו נתחיל!
    </button>
  </div>

  <!-- ── REGISTER ─────────────────────────────────────────── -->
  <div class="form-panel" id="registerPanel">

    <div class="field">
      <label>👤 שם משתמש (לכניסה)</label>
      <input type="text" id="regUsername" placeholder="בחר/י שם משתמש..." maxlength="20" />
    </div>

    <div class="field">
      <label>🔒 סיסמה</label>
      <input type="password" id="regPassword" placeholder="בחר/י סיסמה..." oninput="checkStrength(this.value)" />
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    </div>

    <div class="field">
      <label>🎂 גיל (לא חובה)</label>
      <input type="number" id="regAge" placeholder="בן/בת כמה?" min="3" max="12" />
    </div>

    <div class="field">
      <label>🎒 כיתה / גן</label>
      <div class="grade-pills" id="gradePills">
        <div class="grade-pill" data-g="preschool"  onclick="pickGrade(this)">🧸 טרום חובה</div>
        <div class="grade-pill" data-g="kindergarten" onclick="pickGrade(this)">🎨 גן חובה</div>
        <div class="grade-pill" data-g="first"  onclick="pickGrade(this)">📖 כיתה א׳</div>
        <div class="grade-pill" data-g="second" onclick="pickGrade(this)">✏️ כיתה ב׳</div>
      </div>
    </div>

    <div class="field">
      <label>📱 טלפון הורה (לא חובה)</label>
      <input type="tel" id="regParentPhone" placeholder="05X-XXXXXXX" />
    </div>

    <!-- Contacts (for SMS/mail later) -->
    <div class="field">
      <div class="contacts-title">👨‍👩‍👧 קרובים שיקבלו עדכונים</div>
      <div class="contacts-section" id="contactsList"></div>
      <button class="add-contact-btn" onclick="addContact()">+ הוסף קרוב משפחה</button>
    </div>

    <div class="toast" id="registerToast"></div>

    <button class="submit-btn" id="registerBtn" onclick="doRegister()">
      <span class="btn-rocket">🌟</span>צור חשבון!
    </button>
  </div>

</div><!-- /card -->


<!-- ── Firebase SDKs (v8 compat) ──────────────────────────── -->
<!-- Firebase v12 modular -->
<script type="module">
  import { registerUser, loginUser, auth } from "./auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

  // If already logged in → skip to app
  // Flag to prevent redirect loop during registration
  let isRegistering = false;
  window._setRegistering = (v) => { isRegistering = v; };

  onAuthStateChanged(auth, user => {
    if (user && !isRegistering) window.location.href = 'index.html';
  });
  // ── Stars background ───────────────────────────────────── //
  const starsEl = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = 2 + Math.random()*4;
    s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s`;
    starsEl.appendChild(s);
  }

  // ── State ──────────────────────────────────────────────── //
  let selectedGrade = null;

  // ── Tab switching ──────────────────────────────────────── //
  function switchTab(tab){
    document.querySelectorAll('.tab-btn').forEach((b,i)=>
      b.classList.toggle('active', (tab==='login'?i===0:i===1)));
    document.getElementById('loginPanel').classList.toggle('active', tab==='login');
    document.getElementById('registerPanel').classList.toggle('active', tab==='register');
    clearToast('loginToast'); clearToast('registerToast');
  }

  // ── Grade pill selection ───────────────────────────────── //
  function pickGrade(el){
    document.querySelectorAll('.grade-pill').forEach(p=>p.classList.remove('selected'));
    el.classList.add('selected');
    selectedGrade = el.dataset.g;
  }

  // ── Password strength ──────────────────────────────────── //
  function checkStrength(val){
    const fill = document.getElementById('strengthFill');
    let score = 0;
    if(val.length >= 6) score++;
    if(val.length >= 8) score++;
    if(/[0-9]/.test(val)) score++;
    if(/[^a-zA-Z0-9]/.test(val)) score++;
    const pcts = ['0%','30%','55%','80%','100%'];
    const colors = ['#eee','#FF6B9D','#FEC163','#67D5B5','#A78BFA'];
    fill.style.width  = pcts[score];
    fill.style.background = colors[score];
  }

  // ── Contacts ───────────────────────────────────────────── //
  function addContact(){
    const list = document.getElementById('contactsList');
    const row  = document.createElement('div');
    row.className = 'contact-row';
    row.innerHTML = `
      <input type="text"  placeholder="שם" />
      <input type="tel"   placeholder="טלפון" />
      <input type="email" placeholder="מייל (לא חובה)" />
      <button class="remove-contact" onclick="this.parentElement.remove()" title="הסר">✕</button>
    `;
    list.appendChild(row);
  }

  function getContacts(){
    return Array.from(document.querySelectorAll('#contactsList .contact-row')).map(row=>{
      const inputs = row.querySelectorAll('input');
      return { name:inputs[0].value.trim(), phone:inputs[1].value.trim(), email:inputs[2].value.trim() };
    }).filter(c=>c.name || c.phone);
  }

  // ── Toast ──────────────────────────────────────────────── //
  function showToast(id, msg, type='error'){
    const el=document.getElementById(id);
    el.textContent=msg; el.className=`toast ${type}`; el.style.display='block';
  }
  function clearToast(id){ document.getElementById(id).style.display='none'; }

  function setLoading(btnId, loading){
    const b=document.getElementById(btnId);
    if(loading){ b.disabled=true; b.innerHTML='<span class="spinner"></span>'; }
    else { b.disabled=false; }
  }

  // ── LOGIN ──────────────────────────────────────────────── //
  async function doLogin(){
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    clearToast('loginToast');

    if(!username || !password){ showToast('loginToast','🙈 מלא/י שם משתמש וסיסמה'); return; }

    setLoading('loginBtn', true);
    try {
      await loginUser(username, password);
      showToast('loginToast','✅ ברוך הבא! מעביר אותך...','success');
      setTimeout(()=>{ window.location.href='index.html'; }, 900);
    } catch(e) {
      const msgs = {
        'auth/user-not-found':     '🤔 לא מצאנו את המשתמש הזה',
        'auth/wrong-password':     '🔐 סיסמה שגויה, נסה שוב',
        'auth/invalid-credential': '🔐 שם משתמש או סיסמה שגויים',
        'auth/too-many-requests':  '⏳ יותר מדי ניסיונות, נסה בעוד רגע',
      };
      showToast('loginToast', msgs[e.code] || '😬 שגיאה, נסה שוב');
      setLoading('loginBtn', false);
      document.getElementById('loginBtn').innerHTML='<span class="btn-rocket">🚀</span>בואו נתחיל!';
    }
  }

  // ── REGISTER ──────────────────────────────────────────── //
  async function doRegister(){
    const username    = document.getElementById('regUsername').value.trim();
    const password    = document.getElementById('regPassword').value;
    const age         = document.getElementById('regAge').value;
    const parentPhone = document.getElementById('regParentPhone').value.trim();
    const contacts    = getContacts();
    clearToast('registerToast');

    if(!username)      { showToast('registerToast','🙈 צריך שם משתמש'); return; }
    if(username.length < 3){ showToast('registerToast','👤 שם המשתמש חייב להיות לפחות 3 תווים'); return; }
    if(password.length < 6){ showToast('registerToast','🔐 הסיסמה חייבת להיות לפחות 6 תווים'); return; }
    if(!selectedGrade) { showToast('registerToast','🎒 בחר/י כיתה/גן'); return; }

    setLoading('registerBtn', true);
    try {
      window._setRegistering(true);
      await registerUser({ username, password, grade:selectedGrade, age:age||null, parentPhone, contacts });
      showToast('registerToast','🎉 נרשמת בהצלחה! ברוך/ה הבא/ה!','success');
      setTimeout(()=>{ window.location.href='index.html'; }, 1200);
    } catch(e){
      window._setRegistering(false);
        'auth/email-already-in-use': '👯 שם המשתמש הזה תפוס, בחר/י אחר',
        'auth/weak-password':        '💪 בחר/י סיסמה חזקה יותר (לפחות 6 תווים)',
        'auth/invalid-email':        '🤔 שם משתמש לא תקין',
      };
      showToast('registerToast', msgs[e.code] || '😬 שגיאה, נסה שוב ('+e.code+')');
      setLoading('registerBtn', false);
      document.getElementById('registerBtn').innerHTML='<span class="btn-rocket">🌟</span>צור חשבון!';
    }
  }

  // Expose all onclick functions to global scope (required for module scripts)
  window.doLogin    = doLogin;
  window.doRegister = doRegister;
  window.switchTab  = switchTab;
  window.pickGrade  = pickGrade;
  window.addContact = addContact;
  window.checkStrength = checkStrength;

  // Keyboard enter support
  document.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    if(document.getElementById('loginPanel').classList.contains('active')) window.doLogin();
    else window.doRegister();
  });
</script>
</body>
</html>
