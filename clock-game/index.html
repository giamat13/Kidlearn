<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>השעון</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <button class="back-btn" onclick="window.location.href='../index.html'" data-gamepad-back>← חזור</button>
        <h1>🕐 השעון</h1>
        <p class="subtitle">איזו שעה מראה השעון?</p>
    </header>

    <!-- מסך הגדרות -->
    <section id="setup-screen" class="screen active">
        <h2>מה תרגלו?</h2>
        <div class="options">
            <button class="opt" data-level="hour">שעות עגולות<br><small>3:00</small></button>
            <button class="opt selected" data-level="half">גם חצי שעה<br><small>3:30</small></button>
            <button class="opt" data-level="quarter">גם רבעי שעה<br><small>3:15</small></button>
        </div>
        <button class="btn primary" id="startBtn">התחל משחק ✨</button>
    </section>

    <!-- מסך משחק -->
    <section id="game-screen" class="screen">
        <div class="stats">
            <div>ניקוד <strong id="score">0</strong></div>
            <div>שאלה <strong id="qNum">1/10</strong></div>
        </div>
        <div class="clock-wrap">
            <svg id="clock" viewBox="0 0 200 200" role="img" aria-label="שעון אנלוגי"></svg>
        </div>
        <p class="prompt">מה השעה?</p>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- מסך סיום -->
    <section id="end-screen" class="screen">
        <h2 id="endTitle">כל הכבוד! 🎉</h2>
        <div class="final"><span id="finalScore">0</span> <small>נקודות</small></div>
        <p id="endInfo"></p>
        <div class="row">
            <button class="btn primary" id="againBtn">שחק שוב 🔄</button>
            <button class="btn" id="setupBtn">הגדרות ⚙️</button>
        </div>
    </section>
</div>

<script src="../shared/kidlearn-wallet.js"></script>
<script src="game.js"></script>
<script src="../effects/gamepad-ui.js"></script>
</body>
</html>
