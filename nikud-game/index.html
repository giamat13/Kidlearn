<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הניקוד</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B9D;
            --success: #34D399;
            --danger: #FF6B6B;
            --bg: #FFF8F0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Varela Round', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,107,157,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(52,211,153,0.1) 0%, transparent 50%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 640px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; color: var(--primary); text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .header p { color: #666; margin-top: 6px; }

        .score-bar {
            display: flex;
            justify-content: space-around;
            background: white;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }
        .score-item { text-align: center; }
        .score-item .label { font-size: 0.8rem; color: #888; }
        .score-item .value { font-size: 1.6rem; font-weight: bold; color: var(--primary); }

        .progress-bar-wrap {
            background: #eee;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #A78BFA);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .question-label {
            font-size: 1rem;
            color: #888;
            margin-bottom: 10px;
        }

        .word-display {
            font-size: 4.5rem;
            font-weight: bold;
            color: #333;
            margin: 16px 0 8px;
            letter-spacing: 6px;
            line-height: 1.4;
        }

        .question-text {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 24px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            padding: 16px 10px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 3px solid #E5E7EB;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #333;
            line-height: 1.5;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #FFF0F6;
            transform: translateY(-2px);
        }
        .option-btn.correct {
            background: #D1FAE5;
            border-color: var(--success);
            color: #065F46;
        }
        .option-btn.wrong {
            background: #FEE2E2;
            border-color: var(--danger);
            color: #991B1B;
        }
        .option-btn:disabled { cursor: default; }

        .feedback {
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 36px;
            margin-top: 18px;
        }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--danger); }

        .next-btn {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), #A78BFA);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            display: none;
        }
        .next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,157,0.35); }

        /* הגדרות */
        #nikudCheckboxes .checkbox-item {
            display: flex; align-items: center; gap: 10px; padding: 8px; background: #f9f9f9; border-radius: 8px;
        }
        #nikudCheckboxes input[type="checkbox"] { transform: scale(1.2); }

        /* מסך סיום */
        .end-screen {
            display: none;
            text-align: center;
        }
        .end-screen .big-emoji { font-size: 5rem; margin-bottom: 10px; }
        .end-screen h2 { font-size: 2rem; color: var(--primary); margin-bottom: 8px; }
        .end-screen .final-score { font-size: 3rem; font-weight: bold; color: #333; margin: 16px 0; }
        .end-screen p { color: #666; margin-bottom: 20px; }
        .restart-btn {
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), #A78BFA);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
            margin: 6px;
        }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,157,0.35); }
        .back-btn {
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #E5E7EB;
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            margin: 6px;
        }
        .back-btn:hover { background: #D1D5DB; }

        /* קונפטי */
        .confetti-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; overflow: hidden;
        }
        .confetti-piece {
            position: absolute; top: -20px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* ניקוד גדול */
        .nikud-example {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 4px;
        }

        @media (max-width: 480px) {
            .word-display { font-size: 3.2rem; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="container">
        <div class="header">
            <h1>🔡 משחק הניקוד</h1>
            <p>זהה את הניקוד הנכון!</p>
        </div>

        <div class="score-bar">
            <div class="score-item">
                <div class="label">ניקוד</div>
                <div class="value" id="scoreVal">0</div>
            </div>
            <div class="score-item">
                <div class="label">שאלה</div>
                <div class="value" id="questionNum">1/10</div>
            </div>
            <div class="score-item">
                <div class="label">רצף</div>
                <div class="value" id="streakVal">0🔥</div>
            </div>
            <button id="settingsBtn" onclick="toggleSettings()" style="padding: 8px 12px; font-size: 0.9rem; background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer;">הגדרות ⚙️</button>
        </div>

        <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
        </div>

        <!-- הגדרות -->
        <div class="card" id="settingsCard" style="display: none;">
            <div class="question-label">בחר אילו ניקוד ללמוד:</div>
            <div id="nikudCheckboxes" style="display: grid; gap: 10px; margin: 20px 0;"></div>
            <button class="next-btn" onclick="startGameFromSettings()" style="width: auto; padding: 12px 24px;">התחל משחק ←</button>
        </div>

        <!-- שאלה -->
        <div class="card" id="questionCard">
            <div class="question-label">מה הניקוד של האות המסומנת?</div>
            <div class="word-display" id="wordDisplay"></div>
            <div class="question-text" id="questionText"></div>
            <div class="options-grid" id="optionsGrid"></div>
            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">הבא ←</button>
        </div>

        <!-- סיום -->
        <div class="card end-screen" id="endScreen">
            <div class="big-emoji" id="endEmoji">🎉</div>
            <h2 id="endTitle">כל הכבוד!</h2>
            <p id="endMsg"></p>
            <div class="final-score" id="finalScore"></div>
            <div>
                <button class="restart-btn" onclick="startGame()">שחק שוב 🔄</button>
                <button class="back-btn" onclick="goBack()">חזרה לתפריט</button>
            </div>
        </div>
    </div>

    <script>
        // --- נתוני הניקוד ---
const NIKUD = [
            { name: 'פַּתָּח', symbol: 'ַ', sound: 'אַ', description: 'קמץ קטן מתחת לאות', example: 'בַּיִת' },
            { name: 'קָמָץ', symbol: 'ָ', sound: 'אָה', description: 'קמץ גדול מתחת לאות', example: 'שָׁלוֹם' },
            { name: 'חִירִיק', symbol: 'ִ', sound: 'אִי', description: 'נקודה אחת מתחת לאות', example: 'בִּית' },
            { name: 'צֵירֵי', symbol: 'ֵ', sound: 'אֵי', description: 'שתי נקודות לצד האות', example: 'בֵּית' },
            { name: 'סֶגּוֹל', symbol: 'ֶ', sound: 'אֶ', description: 'שלוש נקודות מתחת לאות', example: 'בֶּן' },
            { name: 'שׁוּרוּק', symbol: 'וּ', sound: 'אוּ', description: 'ו עם נקודה', example: 'שׁוּלְחָן' },
            { name: 'חוֹלָם', symbol: 'וֹ', sound: 'אוֹ', description: 'ו עם נקודה מעל', example: 'שָׁלוֹם' },
            { name: 'שְׁוָא', symbol: 'ְ', sound: 'אֱ', description: 'שתי נקודות זו על זו', example: 'בְּרָכָה' },
            { name: 'קוּבּוּץ', symbol: 'ֻ', sound: 'אֻ', description: 'שלוש נקודות אלכסוניות', example: 'כֻּלָּם' },
            { name: 'דָּגֵשׁ', symbol: 'ּ', sound: 'דָּגֵשׁ', description: 'נקודה בתוך האות', example: 'שַׁבָּת' },
        ];

        // שאלות: מילה עם ניקוד + שאלה על ניקוד ספציפי
        const QUESTIONS = [
            { word: 'שָׁלוֹם', highlighted: 'שָׁ', question: 'מה הניקוד של האות שׁ?', correct: 'קָמָץ', wrong: ['פַּתָּח', 'חִירִיק', 'סֶגּוֹל'] },
            { word: 'בַּיִת', highlighted: 'בַּ', question: 'מה הניקוד של האות ב?', correct: 'פַּתָּח', wrong: ['קָמָץ', 'צֵירֵי', 'שְׁוָא'] },
            { word: 'יֶלֶד', highlighted: 'יֶ', question: 'מה הניקוד של האות י?', correct: 'סֶגּוֹל', wrong: ['פַּתָּח', 'חִירִיק', 'קָמָץ'] },
            { word: 'סֵפֶר', highlighted: 'סֵ', question: 'מה הניקוד של האות ס?', correct: 'צֵירֵי', wrong: ['סֶגּוֹל', 'קָמָץ', 'שְׁוָא'] },
            { word: 'בְּרָכָה', highlighted: 'בְּ', question: 'מה הניקוד של האות ב?', correct: 'שְׁוָא', wrong: ['פַּתָּח', 'חִירִיק', 'קָמָץ'] },
            { word: 'מִשְׁפָּחָה', highlighted: 'מִ', question: 'מה הניקוד של האות מ?', correct: 'חִירִיק', wrong: ['פַּתָּח', 'צֵירֵי', 'קָמָץ'] },
            { word: 'שַׁבָּת', highlighted: 'בָּ', question: 'מה הניקוד של האות ב (השנייה)?', correct: 'קָמָץ', wrong: ['פַּתָּח', 'שְׁוָא', 'סֶגּוֹל'] },
            { word: 'כֻּלָּם', highlighted: 'כֻּ', question: 'מה הניקוד של האות כ?', correct: 'קוּבּוּץ', wrong: ['שׁוּרוּק', 'חוֹלָם', 'חִירִיק'] },
            { word: 'שׁוּלְחָן', highlighted: 'שׁוּ', question: 'מה הניקוד של ו בתוך המילה?', correct: 'שׁוּרוּק', wrong: ['חוֹלָם', 'קוּבּוּץ', 'צֵירֵי'] },
            { word: 'תּוֹרָה', highlighted: 'תּ', question: 'מה יש בתוך האות ת?', correct: 'דָּגֵשׁ', wrong: ['שְׁוָא', 'פַּתָּח', 'חִירִיק'] },
            { word: 'אֶרֶץ', highlighted: 'אֶ', question: 'מה הניקוד של האות א?', correct: 'סֶגּוֹל', wrong: ['פַּתָּח', 'צֵירֵי', 'קָמָץ'] },
            { word: 'לֵב', highlighted: 'לֵ', question: 'מה הניקוד של האות ל?', correct: 'צֵירֵי', wrong: ['סֶגּוֹל', 'חִירִיק', 'שְׁוָא'] },
            { word: 'דָּבָר', highlighted: 'דָּ', question: 'מה הניקוד של האות ד?', correct: 'קָמָץ', wrong: ['פַּתָּח', 'סֶגּוֹל', 'חִירִיק'] },
            { word: 'עִיר', highlighted: 'עִ', question: 'מה הניקוד של האות ע?', correct: 'חִירִיק', wrong: ['פַּתָּח', 'קָמָץ', 'שְׁוָא'] },
            { word: 'כֹּחַ', highlighted: 'כֹּ', question: 'מה הניקוד של האות כ?', correct: 'חוֹלָם', wrong: ['שׁוּרוּק', 'קוּבּוּץ', 'צֵירֵי'] },
        ];

        const TOTAL_QUESTIONS = 10;
        let enabledNikud = []; // indices of enabled NIKUD

        function loadSettings() {
            const saved = localStorage.getItem('nikudEnabled');
            if (saved) {
                enabledNikud = JSON.parse(saved);
            } else {
                enabledNikud = Array.from({length: NIKUD.length}, (_, i) => i); // all enabled
                localStorage.setItem('nikudEnabled', JSON.stringify(enabledNikud));
            }
            return enabledNikud;
        }

        function saveSettings() {
            localStorage.setItem('nikudEnabled', JSON.stringify(enabledNikud));
        }

        function renderSettings() {
            const container = document.getElementById('nikudCheckboxes');
            container.innerHTML = '';
            NIKUD.forEach((nikud, i) => {
                const div = document.createElement('div');
                div.className = 'checkbox-item';
                div.innerHTML = `
                    <input type="checkbox" id="nikud${i}" ${enabledNikud.includes(i) ? 'checked' : ''}>
                    <label for="nikud${i}">${nikud.symbol} ${nikud.name}</label>
                `;
                div.querySelector('input').onchange = (e) => {
                    if (e.target.checked) {
                        if (!enabledNikud.includes(i)) enabledNikud.push(i);
                    } else {
                        enabledNikud = enabledNikud.filter(idx => idx !== i);
                    }
                    saveSettings();
                };
                container.appendChild(div);
            });
        }

        let questions = [];
        let current = 0;
        let score = 0;
        let streak = 0;
        let answered = false;

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function startGameFromSettings() {
            saveSettings();
            document.getElementById('settingsCard').style.display = 'none';
            document.getElementById('questionCard').style.display = 'block';
            renderQuestion();
        }

        function startGame() {
            loadSettings();
            renderSettings();
            
        // Filter questions
            const filteredQuestions = QUESTIONS.filter(q => {
                const correctNikud = NIKUD.find(n => n.name === q.correct);
                return correctNikud && enabledNikud.includes(NIKUD.indexOf(correctNikud));
            });
            if (filteredQuestions.length === 0) {
                enabledNikud = Array.from({length: NIKUD.length}, (_, i) => i);
                localStorage.setItem('nikudEnabled', JSON.stringify(enabledNikud));
                renderSettings();
                alert('בחר לפחות ניקוד אחד!');
                return;
            }
            questions = shuffle(filteredQuestions).slice(0, TOTAL_QUESTIONS);
            current = 0;
            score = 0;
            streak = 0;
            answered = false;
            document.getElementById('endScreen').style.display = 'none';
            document.getElementById('questionCard').style.display = 'block';
            document.getElementById('settingsCard').style.display = 'none';
            renderQuestion();
        }

        function toggleSettings() {
            const settingsCard = document.getElementById('settingsCard');
            const questionCard = document.getElementById('questionCard');
            const isSettingsVisible = settingsCard.style.display === 'block';
            settingsCard.style.display = isSettingsVisible ? 'none' : 'block';
            questionCard.style.display = isSettingsVisible ? 'block' : 'none';
            if (!isSettingsVisible) {
                loadSettings();
                renderSettings();
            }
            console.log('⚙️ Toggle settings, enabled:', enabledNikud);
        }

        function getSound(name) {
            const nikud = NIKUD.find(n => n.name === name);
            return nikud ? nikud.sound : name;
        }

        function getName(sound) {
            const nikud = NIKUD.find(n => n.sound === sound);
            return nikud ? nikud.name : sound;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utt = new SpeechSynthesisUtterance(text);
                utt.lang = 'he-IL';
                utt.rate = 0.7;
                utt.pitch = 1.1;
                speechSynthesis.speak(utt);
            }
        }

        function renderQuestion() {
            answered = false;
            clearTimeout(previewTimer);
            const q = questions[current];
            document.getElementById('questionNum').textContent = `${current + 1}/${TOTAL_QUESTIONS}`;
            document.getElementById('progressBar').style.width = `${(current / TOTAL_QUESTIONS) * 100}%`;
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').style.display = 'none';

            // הצגת המילה עם הדגשת החלק הרלוונטי
            const wordEl = document.getElementById('wordDisplay');
            const word = q.word;
            const highlighted = q.highlighted;
            const idx = word.indexOf(highlighted);
            if (idx !== -1) {
                wordEl.innerHTML =
                    escHtml(word.slice(0, idx)) +
                    `<span style="color:var(--primary);background:#FFF0F6;border-radius:6px;padding:0 4px;">${escHtml(highlighted)}</span>` +
                    escHtml(word.slice(idx + highlighted.length));
            } else {
                wordEl.textContent = word;
            }

            document.getElementById('questionText').textContent = q.question;

            // אפשרויות - הצלילים
            const correctSound = getSound(q.correct);
            const wrongSounds = shuffle(q.wrong.slice(0, 3)).map(w => getSound(w));
            const optionSounds = shuffle([correctSound, ...wrongSounds]);
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            optionSounds.forEach(optSound => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = optSound;
                btn.dataset.sound = optSound;
                btn.dataset.state = 'preview';
                btn.onclick = () => btnClick(btn, optSound, correctSound);
                grid.appendChild(btn);
            });
        }

        function escHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        let previewTimer = null;

        function resetAllPreviews() {
            console.log('🔄 Reset all previews');
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => {
                b.dataset.state = 'preview';
                b.style.borderColor = '';
                b.style.background = '';
            });
            clearTimeout(previewTimer);
        }

        function btnClick(btn, optSound, correctSound) {
            console.log(`🖱️ Click on ${optSound} (state: ${btn.dataset.state})`);
            const wasReady = btn.dataset.state === 'ready';
            resetOthers(btn);
            speak(optSound);
            if (wasReady) {
                console.log(`✅ Answer ${optSound} vs ${correctSound}`);
                clearTimeout(previewTimer);
                answer(optSound, correctSound);
            } else {
                console.log(`📢 Preview ${optSound} -> ready`);
                btn.dataset.state = 'ready';
                btn.style.borderColor = '#34D399';
                btn.style.background = '#F0FDF4';
                previewTimer = setTimeout(resetAllPreviews, 10000);
            }
        }

        function resetOthers(excludeBtn) {
            console.log('🔄 Reset others');
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => {
                if (b !== excludeBtn) {
                    b.dataset.state = 'preview';
                    b.style.borderColor = '';
                    b.style.background = '';
                }
            });
        }

        function answer(chosenSound, correctSound) {
            if (answered) return;
            answered = true;

            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(btn => {
                btn.disabled = true;
                if (btn.dataset.sound === correctSound) btn.classList.add('correct');
                else if (btn.dataset.sound === chosenSound) btn.classList.add('wrong');
            });

            const fb = document.getElementById('feedback');
            const correctName = getName(correctSound);
            if (chosenSound === correctSound) {
                const points = 10 + streak * 2;
                score += points;
                streak++;
                fb.textContent = streak >= 3 ? `🔥 נכון! +${points} (רצף ${streak}!)` : `✓ נכון! +${points}`;
                fb.className = 'feedback success';
                if (streak % 3 === 0) launchConfetti();
            } else {
                streak = 0;
                fb.textContent = `✗ לא נכון. התשובה הנכונה: ${correctSound} (${correctName})`;
                fb.className = 'feedback error';
            }

            document.getElementById('scoreVal').textContent = score;
            document.getElementById('streakVal').textContent = streak + (streak >= 3 ? '🔥' : '');
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            clearTimeout(previewTimer);
            current++;
            if (current >= TOTAL_QUESTIONS) {
                showEnd();
            } else {
                renderQuestion();
            }
        }

        function showEnd() {
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('questionCard').style.display = 'none';
            const end = document.getElementById('endScreen');
            end.style.display = 'block';

            const pct = score / (TOTAL_QUESTIONS * 10);
            let emoji = '😊', title = 'כל הכבוד!', msg = '';
            if (pct >= 0.9) { emoji = '🏆'; title = 'מושלם!'; msg = 'ידע ניקוד מעולה!'; launchConfetti(); }
            else if (pct >= 0.7) { emoji = '🌟'; title = 'יפה מאוד!'; msg = 'כמעט מושלם!'; }
            else if (pct >= 0.5) { emoji = '👍'; title = 'לא רע!'; msg = 'אפשר להשתפר עוד קצת.'; }
            else { emoji = '📚'; title = 'כדאי לתרגל!'; msg = 'נסה שוב ותשתפר!'; }

            document.getElementById('endEmoji').textContent = emoji;
            document.getElementById('endTitle').textContent = title;
            document.getElementById('endMsg').textContent = msg;
            document.getElementById('finalScore').textContent = `${score} נקודות`;
        }

        function goBack() {
            window.location.href = '../index.html';
        }

        function launchConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#FF6B9D','#34D399','#FCD34D','#60A5FA','#A78BFA','#F97316'];
            for (let i = 0; i < 80; i++) {
                const p = document.createElement('div');
                p.className = 'confetti-piece';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = 8 + Math.random() * 8;
                p.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${color};border-radius:${Math.random()>0.5?'50%':'0'};animation-duration:${2+Math.random()*1.5}s;animation-delay:${Math.random()*0.8}s;`;
                container.appendChild(p);
            }
            setTimeout(() => { container.innerHTML = ''; }, 4000);
        }

        startGame();
    </script>
</body>
</html>
