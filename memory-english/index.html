<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק זיכרון - מילים באנגלית ובעברית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0a0e27;
    --bg-mid: #141a3d;
    --panel: #1b2158;
    --gold: #f2b705;
    --magenta: #e63979;
    --cyan: #45e0d5;
    --text: #ece9f5;
    --text-dim: #9ba0c9;
    --motif: '✦';
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(230,57,121,0.18), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(69,224,213,0.15), transparent 45%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 60%, #0a0e27);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 14px 60px;
    overflow-x: hidden;
  }
  header { text-align: center; margin-bottom: 16px; }
  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5vw, 34px);
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--gold), var(--magenta) 60%, var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { color: var(--text-dim); font-size: 13px; font-weight: 300; }

  /* back button */
  .back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    background: rgba(69,224,213,0.15);
    border: 2px solid var(--cyan);
    color: var(--cyan);
    font-family: 'Fredoka', sans-serif;
    font-size: 1rem;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: background .2s;
    z-index: 100;
  }
  .back-btn:hover { background: rgba(69,224,213,0.3); }

  .setup-panel {
    background: rgba(27,33,88,0.6);
    border: 1px solid rgba(242,183,5,0.25);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    max-width: 480px;
    width: 100%;
  }
  .setup-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    background: transparent;
    border: 1px solid rgba(236,233,245,0.25);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 18px;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .chip:hover { border-color: var(--cyan); color: var(--text); }
  .chip.active {
    background: linear-gradient(90deg, var(--magenta), var(--gold));
    border-color: transparent;
    color: #0a0e27;
    font-weight: 700;
  }
  .setup-label { font-size: 12px; color: var(--text-dim); }

  .stats-bar {
    display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; justify-content: center;
  }
  .stat {
    background: rgba(27,33,88,0.7);
    border: 1px solid rgba(242,183,5,0.25);
    border-radius: 14px;
    padding: 8px 16px;
    min-width: 82px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  .stat .value { font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; color: var(--gold); display: block; }
  .stat .label { font-size: 10px; color: var(--text-dim); display: block; margin-top: 2px; }

  .board {
    display: grid;
    gap: 10px;
    perspective: 1000px;
    margin-bottom: 22px;
    width: 100%;
  }

  .card {
    width: 100%;
    aspect-ratio: 4 / 3;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }
  .card.flipped, .card.matched { transform: rotateY(180deg); }
  .card.matched { cursor: default; }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    backface-visibility: hidden;
    padding: 6px;
  }
  .face.back {
    background: linear-gradient(145deg, var(--panel), #262c6b);
    border: 1px solid rgba(69,224,213,0.3);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 0 20px rgba(69,224,213,0.06);
  }
  .face.back::after { content: var(--motif, '✦'); color: rgba(242,183,5,0.55); font-size: clamp(16px,3vw,22px); }

  .face.front {
    background: linear-gradient(145deg, #23295e, #1b2158);
    transform: rotateY(180deg);
    border: 1px solid rgba(242,183,5,0.4);
    flex-direction: column;
    gap: 3px;
  }
  .face.front .word {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(11px, 2.6vw, 16px);
    line-height: 1.2;
    word-break: break-word;
  }
  .face.front .tag {
    font-size: 8px;
    letter-spacing: 0.5px;
    color: var(--cyan);
    text-transform: uppercase;
    opacity: 0.7;
  }

  .card.matched .face.front {
    background: linear-gradient(145deg, rgba(69,224,213,0.25), rgba(230,57,121,0.2));
    border-color: var(--cyan);
    box-shadow: 0 0 18px rgba(69,224,213,0.4);
  }
  .card:not(.flipped):not(.matched):hover .face.back {
    box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(242,183,5,0.15);
    border-color: rgba(242,183,5,0.5);
  }
  .card.wrong .face.front { animation: shake 0.4s ease; border-color: var(--magenta); }
  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }

  .stat.coin .value { color: #ffd54a; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: linear-gradient(90deg, var(--magenta), #b8478f);
    color: #fff; border: none; padding: 11px 26px; border-radius: 22px;
    font-family: 'Heebo', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(230,57,121,0.35); transition: transform 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: linear-gradient(90deg, #2a3170, #384093); box-shadow: 0 4px 14px rgba(42,49,112,0.35); }

  .credit {
    margin-top: 26px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.5px;
  }
  .credit strong { color: var(--gold); font-family: 'Fredoka', sans-serif; font-weight: 600; }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,14,39,0.85); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  .overlay.show { display: flex; }
  .win-card {
    background: var(--panel); border: 1px solid var(--gold); border-radius: 20px;
    padding: 32px 34px; text-align: center; box-shadow: 0 0 40px rgba(242,183,5,0.3); max-width: 340px;
  }
  .win-card h2 { font-family: 'Fredoka', sans-serif; color: var(--gold); margin: 0 0 8px; font-size: 24px; }
  .win-card p { color: var(--text-dim); margin: 4px 0 18px; font-size: 13px; }
  .win-card .final-stats { display: flex; gap: 18px; justify-content: center; margin-bottom: 18px; }
  .win-card .final-stats div span { display: block; font-family: 'Fredoka', sans-serif; font-size: 20px; color: var(--cyan); }
  .win-card .coin-earn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: 'Fredoka', sans-serif; color: #ffd54a; font-size: 15px; margin-bottom: 16px;
  }

  .shop-card {
    background: var(--panel); border: 1px solid var(--gold); border-radius: 20px;
    padding: 24px 22px; text-align: center; box-shadow: 0 0 40px rgba(242,183,5,0.3);
    max-width: 480px; width: 100%; max-height: 82vh; overflow-y: auto;
  }
  .shop-card h2 { font-family: 'Fredoka', sans-serif; color: var(--gold); margin: 0 0 4px; font-size: 22px; }
  .shop-card .coin-balance {
    font-family: 'Fredoka', sans-serif; color: #ffd54a; font-size: 15px; margin-bottom: 16px;
  }
  .theme-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;
  }
  .theme-card {
    border-radius: 14px; padding: 12px 8px; border: 1px solid rgba(236,233,245,0.2);
    display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
    transition: transform 0.15s ease;
  }
  .theme-card:hover { transform: translateY(-2px); }
  .theme-card.selected { border-color: var(--cyan); box-shadow: 0 0 12px rgba(69,224,213,0.4); }
  .theme-swatch { width: 100%; height: 34px; border-radius: 8px; }
  .theme-name { font-size: 12px; font-weight: 600; }
  .theme-price { font-size: 11px; color: var(--text-dim); }
  .theme-price.owned { color: var(--cyan); }
  .theme-price.locked { color: #ff9d9d; }

  @media (max-width: 480px) {
    .stat { padding: 6px 10px; min-width: 68px; }
  }
</style>
</head>
<body>

<button class="back-btn" onclick="history.back()" data-gamepad-back>← חזור</button>

<header>
  <h1>משחק זיכרון - מילים באנגלית ובעברית</h1>
  <div class="subtitle">התאימו כל מילה באנגלית לתרגום שלה בעברית</div>
</header>

<div class="setup-panel">
  <div class="setup-label">מספר זוגות</div>
  <div class="setup-row" id="sizeRow">
    <button class="chip" data-size="6">6</button>
    <button class="chip active" data-size="8">8</button>
    <button class="chip" data-size="12">12</button>
    <button class="chip" data-size="16">16</button>
    <button class="chip" data-size="20">20</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><span class="value" id="moves">0</span><span class="label">מהלכים</span></div>
  <div class="stat"><span class="value" id="timer">00:00</span><span class="label">זמן</span></div>
  <div class="stat"><span class="value" id="pairsCount">0/0</span><span class="label">זוגות</span></div>
  <div class="stat"><span class="value" id="best">–</span><span class="label">שיא אישי</span></div>
  <div class="stat coin"><span class="value" id="coins">0</span><span class="label">💰 מטבעות</span></div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button class="btn" id="restart">משחק חדש</button>
  <button class="btn secondary" id="openShop">🛍️ חנות רקעים</button>
</div>

<div class="credit">נוצר על ידי <strong>TfromGTNK</strong></div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <h2>🌟 כל הכבוד!</h2>
    <p>מצאתם את כל הזוגות</p>
    <div class="final-stats">
      <div><span id="finalMoves">0</span>מהלכים</div>
      <div><span id="finalTime">00:00</span>זמן</div>
    </div>
    <div class="coin-earn">💰 +<span id="coinsEarned">0</span> מטבעות</div>
    <button class="btn" id="playAgain">שחקו שוב</button>
  </div>
</div>

<div class="overlay" id="shopOverlay">
  <div class="shop-card">
    <h2>🛍️ חנות רקעים</h2>
    <div class="coin-balance">💰 יש לך <span id="shopCoins">0</span> מטבעות</div>
    <div class="theme-grid" id="themeGrid"></div>
    <button class="btn secondary" id="closeShop">סגור</button>
  </div>
</div>

  function saveProgress() {
    try {

        coins: gameCoins, unlockedThemes, currentTheme, bestScores
      }));
    } catch (e) { /* storage unavailable, progress stays in-memory for this session */ }
  }

  function loadProgress() {
    try {

      if (typeof data.coins === 'number') gameCoins = data.coins;
      if (Array.isArray(data.unlockedThemes)) unlockedThemes = data.unlockedThemes;
      if (data.currentTheme) currentTheme = data.currentTheme;

  // ----- illustrated landscape backgrounds (vector, not photos) -----
  function pineTree(x, baseY, h, color) {
    const w = h * 0.55;
    return `<polygon points="${x},${baseY-h} ${x-w/2},${baseY} ${x+w/2},${baseY}" fill="${color}"/>
            <rect x="${x-3}" y="${baseY-4}" width="6" height="10" fill="#3b2a1e"/>`;
  }
  function acaciaTree(x, baseY, scale, color) {
    return `<g transform="translate(${x},${baseY}) scale(${scale})">
      <rect x="-4" y="-70" width="8" height="70" fill="#3b2416"/>
      <ellipse cx="0" cy="-85" rx="55" ry="16" fill="${color}"/>
      <ellipse cx="-30" cy="-78" rx="22" ry="10" fill="${color}"/>
      <ellipse cx="30" cy="-78" rx="22" ry="10" fill="${color}"/>
    </g>`;
  }
  function bird(x, y, s, color) {
    return `<path d="M ${x-8*s} ${y} Q ${x-4*s} ${y-6*s} ${x} ${y} Q ${x+4*s} ${y-6*s} ${x+8*s} ${y}" stroke="${color}" stroke-width="${2*s}" fill="none" stroke-linecap="round"/>`;
  }

  function buildSceneSVG(type) {
    if (type === 'nature') {
      let trees = '';
      const treeColors = ['#0f3a2a', '#155038', '#1b6446'];

        const x = 20 + i * 118 + (i % 2 ? 30 : 0);
        const h = 90 + (i % 3) * 30;
        trees += pineTree(x, 900, h, treeColors[i % treeColors.length]);
      }
      return `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0d3b52"/>
            <stop offset="55%" stop-color="#2d7a86"/>
            <stop offset="100%" stop-color="#8fd6c4"/>
          </linearGradient>
          <radialGradient id="sun" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6d0" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#fff6d0" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="1600" height="900" fill="url(#sky)"/>
        <circle cx="1180" cy="230" r="160" fill="url(#sun)"/>
        <circle cx="1180" cy="230" r="55" fill="#fff2c2"/>
        ${bird(300,150,2,'#123')}${bird(340,180,1.6,'#123')}${bird(900,120,1.8,'#123')}
        <polygon points="0,560 260,340 520,560" fill="#1f4d5c" opacity="0.55"/>

        <rect x="0" y="560" width="1600" height="340" fill="#0f3d33"/>
        ${trees}
        <rect x="0" y="860" width="1600" height="40" fill="#0a2b23"/>
      </svg>`;
    }
    if (type === 'savanna') {
      let trees = acaciaTree(220, 780, 1.1, '#3f5a1e') + acaciaTree(1350, 800, 0.9, '#4a6b22');
      return `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">

    if (type === 'ocean') {

        <defs>

  function applySceneBackground(theme) {
    const svg = theme.scene ? buildSceneSVG(theme.scene) : null;
    if (svg) {
      const uri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      document.body.style.backgroundImage = `url("${uri}")`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center bottom';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundAttachment = 'fixed';
    } else {
      document.body.style.backgroundImage = '';
      document.body.style.backgroundSize = '';
      document.body.style.backgroundPosition = '';
      document.body.style.backgroundAttachment = '';
    }
  }

  function applyTheme(id) {
    const theme = THEMES.find(t => t.id === id) || THEMES[0];
    Object.entries(theme.vars).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
    document.documentElement.style.setProperty('--motif', `"${theme.motif || '✦'}"`);
    applySceneBackground(theme);
    currentTheme = theme.id;
  }

  function renderShop() {
    themeGrid.innerHTML = '';
    THEMES.forEach(theme => {
      const owned = unlockedThemes.includes(theme.id);
      const selected = currentTheme === theme.id;
      const div = document.createElement('div');
      div.className = 'theme-card' + (selected ? ' selected' : '');
      const grad = `linear-gradient(90deg, ${theme.vars['--magenta']}, ${theme.vars['--gold']}, ${theme.vars['--cyan']})`;
      div.innerHTML = `
        <div class="theme-swatch" style="background:${grad}; display:flex; align-items:center; justify-content:center; font-size:18px;">${theme.motif || ''}</div>
        <div class="theme-name">${theme.name}</div>
        <div class="theme-price ${owned ? 'owned' : (gameCoins >= theme.price ? '' : 'locked')}">
          ${owned ? (selected ? 'נבחר ✓' : 'בבעלותך') : ('💰 ' + theme.price)}
        </div>
      `;
      div.addEventListener('click', () => {
        if (owned) {
          applyTheme(theme.id);
          saveProgress();
          renderShop();
        } else if (gameCoins >= theme.price) {
          gameCoins -= theme.price;
          unlockedThemes.push(theme.id);
          applyTheme(theme.id);
          updateCoinsDisplay();
          saveProgress();
          renderShop();
        }
      });
      themeGrid.appendChild(div);
    });
  }

  document.getElementById('openShop').addEventListener('click', () => {
    renderShop();
    shopOverlay.classList.add('show');
  });
  document.getElementById('closeShop').addEventListener('click', () => {
    shopOverlay.classList.remove('show');
  });

  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      numPairs = parseInt(btn.dataset.size, 10);
      init();
    });
  });

  document.getElementById('restart').addEventListener('click', init);
  document.getElementById('playAgain').addEventListener('click', () => {
    overlay.classList.remove('show');
    init();
  });

  function loadBest() {
    const val = bestScores['best_' + numPairs];
    bestEl.textContent = val ? val + ' מהלכים' : '–';
  }

  function saveBest() {
    const key = 'best_' + numPairs;
    if (!bestScores[key] || moves < bestScores[key]) bestScores[key] = moves;
    loadBest();
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function bestCols(n) {
    // choose column count for a pleasant grid
    if (n <= 6) return 4;
    if (n <= 8) return 4;
    if (n <= 12) return 6;
    if (n <= 16) return 6;
    return 8;
  }

  function init() {
    clearInterval(timerInterval);
    started = false;
    seconds = 0;
    moves = 0;
    matchedCount = 0;
    flipped = [];
    lock = false;
    timerEl.textContent = '00:00';
    movesEl.textContent = '0';
    overlay.classList.remove('show');

    const bankCopy = shuffle([...WORD_BANK]);
    const chosen = bankCopy.slice(0, numPairs);

    const cols = bestCols(numPairs * 2);
    board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    board.style.maxWidth = (cols * 110) + 'px';
    pairsEl.textContent = `0/${numPairs}`;

    let deck = [];
    chosen.forEach((pair, idx) => {
      deck.push({ pairId: idx, text: pair.en, tag: 'ENGLISH' });
      deck.push({ pairId: idx, text: pair.he, tag: 'עברית' });
    });
    deck = shuffle(deck);

    board.innerHTML = '';
    cards = deck.map((item) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.pairId = item.pairId;
      card.dataset.text = item.text;
      card.dataset.lang = item.tag === 'ENGLISH' ? 'en-US' : 'he-IL';
      card.innerHTML = `
        <div class="face back"></div>
        <div class="face front">
          <div class="word">${item.text}</div>
          <div class="tag">${item.tag}</div>
        </div>
      `;
      card.addEventListener('click', () => onCardClick(card));
      board.appendChild(card);
      return card;
    });

    loadBest();
  }

  function speak(text, lang) {
    try {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = 0.95;
      window.speechSynthesis.speak(utter);
    } catch (e) { /* speech not available, ignore */ }
  }

  function onCardClick(card) {
    if (card.classList.contains('matched')) {
      speak(card.dataset.text, card.dataset.lang);
      return;
    }
    if (lock) return;
    if (card.classList.contains('flipped')) {
      speak(card.dataset.text, card.dataset.lang);
      return;
    }
    if (flipped.length === 2) return;

    speak(card.dataset.text, card.dataset.lang);

    if (!started) {
      started = true;
      timerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }, 1000);
    }

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = moves;
      lock = true;
      const [a, b] = flipped;
      if (a.dataset.pairId === b.dataset.pairId) {
        setTimeout(() => {
          a.classList.add('matched');
          b.classList.add('matched');
          matchedCount++;
          pairsEl.textContent = `${matchedCount}/${numPairs}`;
          flipped = [];
          lock = false;
          if (matchedCount === numPairs) onWin();
        }, 400);
      } else {
        a.classList.add('wrong');
        b.classList.add('wrong');
        setTimeout(() => {
          a.classList.remove('flipped', 'wrong');
          b.classList.remove('flipped', 'wrong');
          flipped = [];
          lock = false;
        }, 800);
      }
    }
  }

  function onWin() {
    clearInterval(timerInterval);
    saveBest();

    // coin reward: base amount scaled by size, bonus for efficiency (fewer moves, less time)
    const base = 10 + numPairs * 2;
    const efficiency = Math.max(0, numPairs * 2 - (moves - numPairs));
    const speedBonus = Math.round(Math.max(0, 30 - seconds) / 3);
    const earned = Math.max(5, base + efficiency + speedBonus);
    gameCoins += earned;
    updateCoinsDisplay();
    saveProgress();

    document.getElementById('finalMoves').textContent = moves;
    document.getElementById('finalTime').textContent = timerEl.textContent;
    document.getElementById('coinsEarned').textContent = earned;
    setTimeout(() => overlay.classList.add('show'), 500);
  }

  loadProgress();
  applyTheme(currentTheme);
  updateCoinsDisplay();
  init();
</script>

<script src="../effects/gamepad-ui.js"></script>
</body>
</html>
