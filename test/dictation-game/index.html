<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הכתבה</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B9D;
            --success: #34D399;
            --danger: #FF6B6B;
            --bg: #FFF8F0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Varela Round', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); font-size: 2.2rem; margin-bottom: 8px; }
        .sub { text-align: center; color: #666; margin-bottom: 24px; }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
            margin-bottom: 20px;
        }
        .row { display: flex; gap: 10px; }
        input[type=text] {
            flex: 1;
            font: inherit;
            font-size: 1.4rem;
            padding: 12px 16px;
            border: 3px solid #eee;
            border-radius: 14px;
            outline: none;
            min-width: 0;
        }
        input[type=text]:focus { border-color: var(--primary); }
        button {
            font: inherit;
            font-size: 1.2rem;
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            cursor: pointer;
            color: #fff;
            background: var(--primary);
        }
        button:disabled { opacity: .5; cursor: default; }
        .add-btn { font-size: 1.8rem; line-height: 1; padding: 8px 20px; background: var(--success); }
        .big-btn { width: 100%; margin-top: 16px; font-size: 1.4rem; }
        .secondary { background: #94A3B8; }
        .small-btn {
            display: block; margin: 20px 0 0 auto;
            font-size: .9rem; padding: 6px 12px; background: #94A3B8;
        }
        ul { list-style: none; margin-top: 16px; }
        li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; margin-bottom: 8px;
            background: #F0F9FF; border-radius: 12px; font-size: 1.3rem;
        }
        li button { background: var(--danger); padding: 4px 12px; font-size: 1rem; }
        .empty { text-align: center; color: #999; margin-top: 16px; }
        .hidden { display: none; }
        .progress { text-align: center; color: #666; margin-bottom: 16px; }
        .speak {
            display: block; margin: 0 auto 20px;
            width: 120px; height: 120px; border-radius: 50%;
            font-size: 3.5rem; padding: 0;
        }
        .feedback { text-align: center; font-size: 1.5rem; min-height: 2.2rem; margin-top: 16px; }
        .feedback.ok { color: var(--success); }
        .feedback.bad { color: var(--danger); }
        .result { text-align: center; font-size: 1.6rem; }
        .note { text-align: center; color: var(--danger); margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>✍️ הכתבה</h1>
    <p class="sub">מכניסים מילים, והמחשב מקריא אותן – ואתם כותבים!</p>

    <!-- מסך הגדרת מילים -->
    <div id="setup" class="card">
        <div class="row">
            <input type="text" id="wordInput" placeholder="הקלידו מילה" autocomplete="off">
            <button class="add-btn" id="addBtn" aria-label="הוספת מילה">+</button>
        </div>
        <div class="row hidden" id="voiceRow" style="margin-top:14px; align-items:center">
            <span>🗣️ קול:</span>
            <select id="voiceSelect" style="flex:1; font:inherit; padding:8px; border-radius:10px; border:3px solid #eee; min-width:0"></select>
        </div>
        <ul id="wordList"></ul>
        <p class="empty" id="emptyMsg">עוד לא הוספתם מילים</p>
        <button class="big-btn" id="startBtn" disabled>🎧 מתחילים</button>
        <p class="note hidden" id="voiceNote">לא נמצא קול בעברית במכשיר הזה, ייתכן שההקראה לא תעבוד.</p>
    </div>

    <!-- מסך המשחק -->
    <div id="game" class="card hidden">
        <p class="progress" id="progress"></p>
        <button class="speak" id="speakBtn" aria-label="הקראה">🔊</button>
        <div class="row">
            <input type="text" id="answer" placeholder="כתבו כאן" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button id="checkBtn">בדיקה</button>
        </div>
        <p class="feedback" id="feedback"></p>
        <button class="small-btn" id="quitBtn">↩ חזרה לרשימה</button>
    </div>

    <!-- מסך סיום -->
    <div id="end" class="card hidden">
        <p class="result" id="result"></p>
        <button class="big-btn" id="againBtn">🔁 עוד פעם</button>
        <button class="big-btn secondary" id="editBtn">עריכת המילים</button>
    </div>
</div>

<script>
(function () {
    var STORE = 'kidlearn-dictation-words';
    var words = [];
    try { words = JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { words = []; }
    if (!Array.isArray(words)) words = [];

    var $ = function (id) { return document.getElementById(id); };
    var queue = [], current = '', total = 0, correct = 0, triedWrong = false;

    function save() { try { localStorage.setItem(STORE, JSON.stringify(words)); } catch (e) {} }
    function show(id) {
        ['setup', 'game', 'end'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); });
    }

    function renderList() {
        var ul = $('wordList');
        ul.innerHTML = '';
        words.forEach(function (w, i) {
            var li = document.createElement('li');
            var span = document.createElement('span');
            span.textContent = w;
            var b = document.createElement('button');
            b.textContent = '✕';
            b.setAttribute('aria-label', 'מחיקה');
            b.onclick = function () { words.splice(i, 1); save(); renderList(); };
            li.appendChild(span);
            li.appendChild(b);
            ul.appendChild(li);
        });
        $('emptyMsg').classList.toggle('hidden', words.length > 0);
        $('startBtn').disabled = words.length === 0;
    }

    function addWord() {
        var v = $('wordInput').value.trim();
        if (v && words.indexOf(v) === -1) { words.push(v); save(); renderList(); }
        $('wordInput').value = '';
        $('wordInput').focus();
    }

    // ש בלי נקודה מוקראת לפעמים כ"ס"; מוסיף נקודה ימנית (שׁ) כברירת מחדל, ושׂ מפורשת נשארת
    function defaultShin(s) {
        return s.replace(/ש([֑-ׇ]*)/g, function (m, marks) {
            return /[ׁׂ]/.test(marks) ? m : 'שׁ' + marks;
        });
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(defaultShin(text));
        u.lang = 'he-IL';
        u.rate = 0.8;
        var v = pickVoice();
        if (v) u.voice = v;
        speechSynthesis.speak(u);
    }

    var VOICE_KEY = 'kidlearn-dictation-voice';

    // קולות עבריים, הטובים (טבעיים / ענן) קודם
    function hebrewVoices() {
        var score = function (x) { return /natural|online|google/i.test(x.name) ? 0 : 1; };
        return speechSynthesis.getVoices().filter(function (x) { return /^he/i.test(x.lang); })
            .sort(function (a, b) { return score(a) - score(b); });
    }

    function pickVoice() {
        var list = hebrewVoices(), saved = '';
        try { saved = localStorage.getItem(VOICE_KEY) || ''; } catch (e) {}
        return list.filter(function (x) { return x.name === saved; })[0] || list[0];
    }

    function fillVoices() {
        var list = hebrewVoices(), sel = $('voiceSelect'), cur = pickVoice();
        sel.innerHTML = '';
        list.forEach(function (x) {
            var o = document.createElement('option');
            o.value = x.name;
            o.textContent = x.name;
            o.selected = cur && x.name === cur.name;
            sel.appendChild(o);
        });
        $('voiceRow').classList.toggle('hidden', list.length < 2);
    }

    // מסיר ניקוד וטעמי מקרא כדי שהשוואה תתעלם מהם
    function stripNikud(s) { return s.replace(/[֑-ׇ]/g, ''); }

    function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }

    function start() {
        queue = shuffle(words.slice());
        total = queue.length;
        correct = 0;
        show('game');
        next();
    }

    function next() {
        if (!queue.length) { finish(); return; }
        current = queue.shift();
        triedWrong = false;
        $('progress').textContent = 'מילה ' + (total - queue.length) + ' מתוך ' + total;
        $('answer').value = '';
        $('feedback').textContent = '';
        $('feedback').className = 'feedback';
        $('checkBtn').disabled = false;
        $('answer').focus();
        speak(current);
    }

    function check() {
        var a = $('answer').value.trim();
        if (!a) return;
        var fb = $('feedback');
        if (stripNikud(a) === stripNikud(current)) {
            if (!triedWrong) correct++;
            fb.textContent = '🎉 נכון!';
            fb.className = 'feedback ok';
            $('checkBtn').disabled = true;
            setTimeout(next, 1200);
        } else {
            triedWrong = true;
            fb.textContent = 'לא בדיוק, נסו שוב 💪';
            fb.className = 'feedback bad';
            speak(current);
        }
    }

    function finish() {
        show('end');
        try { new Audio('../effects/newlevel.mp3').play().catch(function () {}); } catch (e) {}
        $('result').textContent = 'סיימתם! 🏆 כתבתם נכון בניסיון ראשון ' + correct + ' מתוך ' + total;
    }

    $('addBtn').onclick = addWord;
    $('wordInput').onkeydown = function (e) { if (e.key === 'Enter') addWord(); };
    $('startBtn').onclick = start;
    $('speakBtn').onclick = function () { speak(current); };
    $('checkBtn').onclick = check;
    $('answer').onkeydown = function (e) { if (e.key === 'Enter') check(); };
    $('quitBtn').onclick = function () { if ('speechSynthesis' in window) speechSynthesis.cancel(); show('setup'); };
    $('againBtn').onclick = start;
    $('editBtn').onclick = function () { show('setup'); };
    $('voiceSelect').onchange = function () {
        try { localStorage.setItem(VOICE_KEY, this.value); } catch (e) {}
        speak('שלום, ככה אני נשמע');
    };

    if ('speechSynthesis' in window) {
        var checkVoice = function () {
            var vs = speechSynthesis.getVoices();
            fillVoices();
            if (vs.length) $('voiceNote').classList.toggle('hidden', vs.some(function (x) { return /^he/i.test(x.lang); }));
        };
        speechSynthesis.onvoiceschanged = checkVoice;
        checkVoice();
    } else {
        $('voiceNote').classList.remove('hidden');
    }

    renderList();
})();
</script>
</body>
</html>
