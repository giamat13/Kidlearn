<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="roomGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d8cce0"/>
      <stop offset="100%" stop-color="#a090b0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background room - dark gothic -->
  <rect width="500" height="600" fill="url(#roomGrad)"/>

  <!-- ═══ WALL DETAILS (cx≈0.20, cy≈0.40 → x≈100, y≈240) ═══ -->
  <!-- Stone wall texture -->
  <rect x="0" y="0" width="500" height="600" fill="none" stroke="#2a1a2a" stroke-width="0.5" opacity="0.3"/>
  <!-- LEFT: Wall has crack lines -->
  <line x1="60" y1="180" x2="80" y2="240" stroke="#3a2040" stroke-width="2" opacity="0.8"/>
  <line x1="80" y1="240" x2="95" y2="290" stroke="#3a2040" stroke-width="1.5" opacity="0.8"/>
  <line x1="70" y1="200" x2="55" y2="260" stroke="#3a2040" stroke-width="1.5" opacity="0.6"/>
  <line x1="85" y1="220" x2="105" y2="250" stroke="#3a2040" stroke-width="1" opacity="0.6"/>
  <!-- Stone blocks -->
  <line x1="0" y1="100" x2="500" y2="100" stroke="#2a1530" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="200" x2="500" y2="200" stroke="#2a1530" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="300" x2="500" y2="300" stroke="#2a1530" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="400" x2="500" y2="400" stroke="#2a1530" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="500" x2="500" y2="500" stroke="#2a1530" stroke-width="1" opacity="0.4"/>

  <!-- Window with moonlight -->
  <rect x="380" y="30" width="90" height="130" rx="8" fill="#0a0818"/>
  <rect x="385" y="35" width="80" height="120" rx="5" fill="#1a1840"/>
  <!-- Moon in window -->
  <circle cx="425" cy="90" r="28" fill="#f5e88a" filter="url(#glow)"/>
  <circle cx="418" cy="85" r="6" fill="#d4c060" opacity="0.4"/>
  <circle cx="432" cy="98" r="4" fill="#d4c060" opacity="0.3"/>
  <!-- Window frame -->
  <line x1="425" y1="35" x2="425" y2="155" stroke="#2a1a10" stroke-width="3"/>
  <line x1="385" y1="90" x2="465" y2="90" stroke="#2a1a10" stroke-width="3"/>
  <rect x="380" y="30" width="90" height="130" rx="8" fill="none" stroke="#3a2a20" stroke-width="4"/>

  <!-- Candelabra left wall -->
  <rect x="30" y="120" width="8" height="40" fill="#8b7040"/>
  <line x1="20" y1="120" x2="48" y2="120" stroke="#8b7040" stroke-width="3"/>
  <circle cx="20" cy="120" r="4" fill="#c09030"/>
  <circle cx="34" cy="120" r="4" fill="#c09030"/>
  <circle cx="48" cy="120" r="4" fill="#c09030"/>
  <!-- Candle flames -->
  <ellipse cx="20" cy="113" rx="3" ry="5" fill="#ff8c00" opacity="0.9"/>
  <ellipse cx="34" cy="113" rx="3" ry="5" fill="#ff8c00" opacity="0.9"/>
  <ellipse cx="48" cy="113" rx="3" ry="5" fill="#ff8c00" opacity="0.9"/>

  <!-- ═══ BED ═══ -->
  <!-- Bed frame - ornate dark wood -->
  <rect x="80" y="380" width="340" height="160" rx="5" fill="#1a0808"/>
  <rect x="85" y="385" width="330" height="150" rx="3" fill="#2a0f0f"/>
  <!-- Mattress -->
  <rect x="90" y="390" width="320" height="130" rx="4" fill="#3a1a2a"/>
  <!-- Bedsheet / blanket -->
  <path d="M 90 430 Q 250 420 410 430 L 410 520 Q 250 530 90 520 Z" fill="#4a0a0a"/>
  <path d="M 90 430 Q 250 418 410 430" stroke="#6a1a1a" stroke-width="2" fill="none"/>
  <!-- Pillow -->
  <rect x="100" y="392" width="140" height="50" rx="15" fill="#5a3a4a"/>
  <rect x="105" y="397" width="130" height="40" rx="12" fill="#6a4a5a"/>

  <!-- Headboard -->
  <rect x="75" y="300" width="350" height="90" rx="10" fill="#1a0808"/>
  <rect x="85" y="310" width="330" height="70" rx="8" fill="#250f0f"/>
  <!-- Headboard arch decoration -->
  <path d="M 140 310 Q 250 285 360 310" fill="none" stroke="#5a1a1a" stroke-width="3"/>
  <path d="M 155 310 Q 250 290 345 310" fill="none" stroke="#8b2020" stroke-width="2" opacity="0.6"/>
  <!-- Gothic arch ornament -->
  <path d="M 220 295 Q 250 275 280 295 L 275 315 Q 250 300 225 315 Z" fill="#5a1a1a"/>
  <circle cx="250" cy="285" r="8" fill="#8b0000"/>
  <circle cx="250" cy="285" r="4" fill="#cc0000"/>

  <!-- ═══ CANOPY TOP OF BED (cx≈0.50, cy≈0.70 → x≈250, y≈420) ═══ -->
  <!-- LEFT: Canopy has decorative finial/ornament on top bar -->
  <rect x="78" y="295" width="8" height="15" fill="#3a1010"/>
  <rect x="414" y="295" width="8" height="15" fill="#3a1010"/>
  <rect x="75" y="280" width="350" height="18" rx="4" fill="#1a0808"/>
  <!-- Finial ornaments on canopy bar - LEFT has them -->
  <circle cx="130" cy="275" r="7" fill="#8b0000"/>
  <rect x="127" y="265" width="6" height="12" fill="#5a1010"/>
  <circle cx="250" cy="272" r="9" fill="#8b0000"/>
  <rect x="247" y="260" width="6" height="14" fill="#5a1010"/>
  <circle cx="370" cy="275" r="7" fill="#8b0000"/>
  <rect x="367" y="265" width="6" height="12" fill="#5a1010"/>
  <!-- Canopy drapes -->
  <path d="M 75 298 Q 100 350 90 430" stroke="#3a0a1a" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 425 298 Q 400 350 410 430" stroke="#3a0a1a" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- ═══ SHOES UNDER BED (cx≈0.50, cy≈0.30 → x≈250, y≈180 … but in scene it's the bed) ═══ -->
  <!-- Actually cy≈0.30*600=180 is high up — recheck: the bed bottom is ~540, shoes under bed at y≈180 seems wrong -->
  <!-- The scene shows vampire sleeping, shoes under bed would be at bottom of bed -->
  <!-- LEFT: shoes ARE visible under bed -->
  <ellipse cx="195" cy="535" rx="28" ry="10" fill="#1a0808"/>
  <ellipse cx="195" cy="532" rx="25" ry="8" fill="#250d0d"/>
  <path d="M 170 530 Q 172 540 198 540 Q 210 538 220 533 L 218 528 Q 205 532 195 532 Q 178 533 172 530 Z" fill="#300e0e"/>
  <ellipse cx="310" cy="535" rx="28" ry="10" fill="#1a0808"/>
  <ellipse cx="310" cy="532" rx="25" ry="8" fill="#250d0d"/>
  <path d="M 285 530 Q 287 540 313 540 Q 325 538 335 533 L 333 528 Q 320 532 310 532 Q 293 533 287 530 Z" fill="#300e0e"/>

  <!-- ═══ VAMPIRE CHARACTER ═══ -->
  <!-- Cape spread on bed -->
  <path d="M 150 390 Q 250 375 350 390 Q 340 450 250 460 Q 160 450 150 390 Z" fill="#0a0010"/>
  <path d="M 155 392 Q 250 378 345 392 Q 336 448 250 458 Q 164 448 155 392 Z" fill="#150020" opacity="0.8"/>

  <!-- Body in bed -->
  <rect x="160" y="405" width="180" height="100" rx="10" fill="#2a0a18"/>

  <!-- Cape collar around neck/shoulders -->
  <path d="M 190 408 Q 250 398 310 408 L 305 430 Q 250 422 195 430 Z" fill="#1a0028"/>
  <!-- Collar points -->
  <path d="M 195 408 L 188 395 L 205 405 Z" fill="#1a0028"/>
  <path d="M 305 408 L 312 395 L 295 405 Z" fill="#1a0028"/>

  <!-- Shirt / formal wear - white shirt front -->
  <rect x="210" y="418" width="80" height="85" rx="5" fill="#e8e0f0"/>
  <!-- Shirt ruffles -->
  <line x1="250" y1="420" x2="250" y2="500" stroke="#d0c8e0" stroke-width="1.5"/>
  <path d="M 225 428 Q 235 424 245 428 Q 235 432 225 428" fill="#d0c8e0"/>
  <path d="M 255 428 Q 265 424 275 428 Q 265 432 255 428" fill="#d0c8e0"/>
  <path d="M 225 442 Q 235 438 245 442 Q 235 446 225 442" fill="#d0c8e0"/>
  <path d="M 255 442 Q 265 438 275 442 Q 265 446 255 442" fill="#d0c8e0"/>

  <!-- ═══ TUXEDO COLLAR BUTTONS (cx≈0.35, cy≈0.55 → x≈175, y≈330) ═══ -->
  <!-- LEFT: has 3 round buttons on collar/tuxedo -->
  <circle cx="235" cy="422" r="4" fill="#2a0a18"/>
  <circle cx="250" cy="422" r="4" fill="#2a0a18"/>
  <circle cx="265" cy="422" r="4" fill="#2a0a18"/>

  <!-- Arms crossed on chest -->
  <path d="M 165 435 Q 185 428 200 438 Q 210 455 200 465 Q 185 470 165 460 Z" fill="#2a0a18"/>
  <path d="M 335 435 Q 315 428 300 438 Q 290 455 300 465 Q 315 470 335 460 Z" fill="#2a0a18"/>

  <!-- Hands -->
  <ellipse cx="218" cy="462" rx="18" ry="12" fill="url(#skinGrad)"/>
  <ellipse cx="282" cy="462" rx="18" ry="12" fill="url(#skinGrad)"/>

  <!-- ═══ RINGS ON FINGERS (cx≈0.65, cy≈0.50 → x≈325, y≈300) ═══ -->
  <!-- LEFT: has rings on right hand fingers -->
  <rect x="272" y="457" width="8" height="4" rx="2" fill="#d4af37" stroke="#a07820" stroke-width="1"/>
  <rect x="283" y="457" width="8" height="4" rx="2" fill="#d4af37" stroke="#a07820" stroke-width="1"/>
  <rect x="294" y="457" width="8" height="4" rx="2" fill="#8b0000" stroke="#600000" stroke-width="1"/>
  <!-- Gemstone on ring -->
  <circle cx="276" cy="459" r="2" fill="#cc0000"/>
  <circle cx="287" cy="459" r="2" fill="#cc0000"/>

  <!-- Neck -->
  <rect x="232" y="380" width="36" height="30" rx="8" fill="url(#skinGrad)"/>
  <!-- Bite mark on neck -->
  <circle cx="242" cy="392" r="3" fill="#8b0000" opacity="0.8"/>
  <circle cx="252" cy="390" r="3" fill="#8b0000" opacity="0.8"/>

  <!-- Head -->
  <ellipse cx="250" cy="340" rx="58" ry="50" fill="url(#skinGrad)"/>

  <!-- Hair - slicked back black -->
  <path d="M 195 325 Q 200 295 250 288 Q 300 295 305 325 L 300 330 Q 270 310 250 312 Q 230 310 200 330 Z" fill="#0a0a0a"/>
  <path d="M 200 330 Q 220 315 250 312 Q 280 315 300 330" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <!-- Widow's peak -->
  <path d="M 238 315 Q 250 305 262 315 L 258 325 Q 250 318 242 325 Z" fill="#0a0a0a"/>
  <!-- Sideburns -->
  <rect x="193" y="330" width="12" height="25" rx="4" fill="#0a0a0a"/>
  <rect x="295" y="330" width="12" height="25" rx="4" fill="#0a0a0a"/>

  <!-- Eyebrows - thick arched -->
  <path d="M 210 318 Q 222 312 234 316" stroke="#0a0a0a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 266 316 Q 278 312 290 318" stroke="#0a0a0a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Eyes - red vampire eyes (closed/sleeping) -->
  <path d="M 212 332 Q 222 326 232 332" stroke="#0a0a0a" stroke-width="3" fill="none"/>
  <path d="M 268 332 Q 278 326 288 332" stroke="#0a0a0a" stroke-width="3" fill="none"/>
  <!-- Eyelashes -->
  <line x1="215" y1="331" x2="213" y2="336" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="222" y1="328" x2="221" y2="333" stroke="#0a0a0a" stroke-width="1.5"/>
  <line x1="228" y1="330" x2="228" y2="335" stroke="#0a0a0a" stroke-width="1.5"/>

  <!-- Nose -->
  <path d="M 247 338 Q 242 348 238 352 Q 242 356 250 354 Q 258 356 262 352 Q 258 348 253 338" fill="#b0a0c0"/>

  <!-- Mouth - slight smile showing fang -->
  <path d="M 234 363 Q 242 370 250 370 Q 258 370 266 363" stroke="#6a1a1a" stroke-width="2" fill="none"/>
  <!-- Fangs -->
  <path d="M 240 368 L 238 378 L 244 374 Z" fill="white"/>
  <path d="M 260 368 L 262 378 L 256 374 Z" fill="white"/>

  <!-- Bat decorations on wall -->
  <g transform="translate(30,60)" opacity="0.6">
    <path d="M 0 5 Q -12 -2 -20 5 Q -12 8 0 5 Z" fill="#1a0a20"/>
    <path d="M 0 5 Q 12 -2 20 5 Q 12 8 0 5 Z" fill="#1a0a20"/>
    <circle cx="0" cy="5" r="4" fill="#2a1030"/>
    <circle cx="-1" cy="4" r="1.5" fill="#3a2040"/>
    <circle cx="2" cy="4" r="1.5" fill="#3a2040"/>
  </g>
  <g transform="translate(460,150)" opacity="0.5">
    <path d="M 0 5 Q -10 -1 -18 5 Q -10 7 0 5 Z" fill="#1a0a20"/>
    <path d="M 0 5 Q 10 -1 18 5 Q 10 7 0 5 Z" fill="#1a0a20"/>
    <circle cx="0" cy="5" r="3" fill="#2a1030"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="545" width="500" height="55" fill="#0f0818"/>
  <line x1="0" y1="545" x2="500" y2="545" stroke="#2a1530" stroke-width="2"/>
  <!-- Floor boards -->
  <line x1="0" y1="560" x2="500" y2="560" stroke="#1a0f25" stroke-width="1"/>
  <line x1="100" y1="545" x2="100" y2="600" stroke="#1a0f25" stroke-width="1"/>
  <line x1="200" y1="545" x2="200" y2="600" stroke="#1a0f25" stroke-width="1"/>
  <line x1="300" y1="545" x2="300" y2="600" stroke="#1a0f25" stroke-width="1"/>
  <line x1="400" y1="545" x2="400" y2="600" stroke="#1a0f25" stroke-width="1"/>
</svg>
