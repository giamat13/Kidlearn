  <line x1="0" y1="520" x2="500" y2="520" stroke="#5a5a5a" stroke-width="6"/>
  <!-- Fewer ties -->
  <rect x="15" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="95" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="175" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="255" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="335" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="415" y="494" width="25" height="32" rx="2" fill="#3a2010"/>
  <rect x="0" y="490" width="500" height="40" fill="#8a7a60" opacity="0.4"/>

  <!-- Tender (identical) -->
  <rect x="340" y="398" width="115" height="80" rx="6" fill="#2a1a0a"/>
  <rect x="344" y="402" width="107" height="68" rx="4" fill="#3a2a15"/>
