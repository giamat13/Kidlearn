  <path d="M 90 450 L 68 470 L 68 478 L 90 478 Z" fill="#8a1a08"/>
  <line x1="68" y1="462" x2="90" y2="452" stroke="#6a1008" stroke-width="2"/>
  <line x1="68" y1="470" x2="90" y2="460" stroke="#6a1008" stroke-width="2"/>

  <!-- Headlight (identical) -->
  <circle cx="92" cy="415" r="12" fill="#e8e0c0"/>
  <circle cx="92" cy="415" r="9" fill="#ffe080"/>
  <circle cx="92" cy="415" r="5" fill="white"/>

  <!-- ═══ WHEELS — DIFFERENCE 3: Wheels have no spokes, solid discs ═══ -->
