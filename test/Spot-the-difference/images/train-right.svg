  <rect x="304" y="313" width="72" height="70" rx="4" fill="#ba3018"/>
  <rect x="295" y="303" width="90" height="12" rx="4" fill="#8a1a08"/>
  <rect x="310" y="320" width="28" height="30" rx="4" fill="#2a3050"/>
  <rect x="312" y="322" width="24" height="26" rx="3" fill="#3a4060"/>
  <rect x="348" y="320" width="28" height="30" rx="4" fill="#2a3050"/>
  <rect x="350" y="322" width="24" height="26" rx="3" fill="#3a4060"/>

  <!-- Chimney (identical) -->
  <rect x="148" y="308" width="24" height="35" rx="4" fill="#2a1a0a"/>
  <rect x="144" y="304" width="32" height="10" rx="4" fill="#1a0a00"/>
  <rect x="146" y="306" width="28" height="8" rx="3" fill="#2a1a0a"/>

  <!-- ═══ SMOKE — DIFFERENCE 1: Thin wispy smoke (left had big puffy clouds) ═══ -->
  <path d="M 160 304 Q 162 285 158 265 Q 162 248 158 230 Q 162 215 158 198" stroke="#c0c0c0" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 160 304 Q 166 288 163 270" stroke="#c0c0c0" stroke-width="3" fill="none" opacity="0.4"/>
  <ellipse cx="158" cy="200" rx="10" ry="8" fill="#d0d0d0" opacity="0.5"/>

