  <circle cx="365" cy="478" r="8" fill="#2a2a2a"/>
  <circle cx="430" cy="478" r="16" fill="#1a1a1a" stroke="#4a4a4a" stroke-width="3"/>
  <circle cx="430" cy="478" r="8" fill="#2a2a2a"/>
  <line x1="365" y1="462" x2="365" y2="494" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="349" y1="478" x2="381" y2="478" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="354" y1="467" x2="376" y2="489" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="376" y1="467" x2="354" y2="489" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="430" y1="462" x2="430" y2="494" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="414" y1="478" x2="446" y2="478" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="419" y1="467" x2="441" y2="489" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="441" y1="467" x2="419" y2="489" stroke="#4a4a4a" stroke-width="2"/>

