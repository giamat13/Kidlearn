  <rect x="90" y="375" width="260" height="103" rx="8" fill="url(#trainGrad)"/>
  <rect x="94" y="378" width="252" height="95" rx="6" fill="#cc3a18"/>
  <rect x="110" y="340" width="220" height="48" rx="20" fill="#c03010"/>
  <rect x="115" y="343" width="210" height="40" rx="18" fill="#d03818"/>
  <line x1="165" y1="340" x2="165" y2="388" stroke="#a02808" stroke-width="3" opacity="0.6"/>
