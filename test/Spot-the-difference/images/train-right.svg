<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90c8"/>
      <stop offset="100%" stop-color="#90c8f0"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c84020"/>
      <stop offset="100%" stop-color="#8b2010"/>
    </linearGradient>
  </defs>

  <!-- Sky, clouds, hills (identical) -->
  <rect width="500" height="600" fill="url(#skyGrad)"/>
  <ellipse cx="120" cy="70" rx="55" ry="22" fill="white" opacity="0.85"/>
  <ellipse cx="150" cy="58" rx="40" ry="18" fill="white" opacity="0.85"/>
  <ellipse cx="90" cy="64" rx="30" ry="16" fill="white" opacity="0.85"/>
  <ellipse cx="380" cy="55" rx="50" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="408" cy="46" rx="38" ry="16" fill="white" opacity="0.7"/>
  <path d="M 0 350 Q 80 290 160 330 Q 240 370 320 310 Q 400 250 500 310 L 500 600 L 0 600 Z" fill="#5a8a3a"/>
  <path d="M 0 380 Q 100 340 200 370 Q 300 400 400 360 Q 460 340 500 360 L 500 600 L 0 600 Z" fill="#6a9a45"/>
  <rect x="0" y="480" width="500" height="120" fill="#7aaa50"/>

