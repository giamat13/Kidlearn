  <circle cx="160" cy="478" r="8" fill="#3a3a3a"/>

  <circle cx="232" cy="478" r="28" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="4"/>
  <circle cx="232" cy="478" r="10" fill="#3a3a3a"/>

  <!-- Connecting rod (identical) -->
  <rect x="148" y="468" width="95" height="8" rx="3" fill="#3a3a3a"/>

  <circle cx="108" cy="478" r="16" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="3"/>
  <circle cx="108" cy="478" r="6" fill="#3a3a3a"/>

  <!-- ═══ TICKETS — DIFFERENCE 2: Window has NO tickets ═══ -->
  <rect x="200" y="388" width="45" height="38" rx="4" fill="#2a3050"/>
  <rect x="202" y="390" width="41" height="34" rx="3" fill="#3a4060"/>
  <!-- No tickets sticking up -->

  <!-- ═══ WINDOW SCENE — DIFFERENCE 5: Cab window shows different view ═══ -->
  <!-- Left cab window: shows night/dark view instead of blue -->
  <rect x="310" y="320" width="28" height="30" rx="4" fill="#1a1a2a"/>
  <rect x="312" y="322" width="24" height="26" rx="3" fill="#0a0a18"/>
  <!-- Stars visible through window -->
  <circle cx="318" cy="328" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="326" cy="332" r="1" fill="white" opacity="0.7"/>
  <circle cx="332" cy="326" r="1.5" fill="white" opacity="0.8"/>

  <!-- Platform (identical) -->
  <rect x="0" y="450" width="80" height="40" rx="3" fill="#c0a870"/>
  <rect x="0" y="445" width="85" height="10" rx="3" fill="#d0b880"/>
  <rect x="5" y="420" width="70" height="24" rx="3" fill="#f0e8d0"/>
  <rect x="5" y="420" width="70" height="24" rx="3" fill="none" stroke="#8b6030" stroke-width="2"/>
  <text x="12" y="436" font-family="sans-serif" font-size="9" fill="#4a2a08">STATION</text>

  <!-- Signal post (identical) -->
  <rect x="460" y="380" width="6" height="120" rx="2" fill="#4a4a3a"/>
  <rect x="456" y="380" width="14" height="20" rx="3" fill="#1a1a1a"/>
  <circle cx="463" cy="388" r="5" fill="#cc0000"/>
  <circle cx="463" cy="398" r="5" fill="#00aa00"/>
</svg>
