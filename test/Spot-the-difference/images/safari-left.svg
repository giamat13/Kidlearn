<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- African savanna sky -->
  <defs>
    <linearGradient id="savskyL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="40%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#8B0000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#savskyL)"/>

  <!-- Sun setting -->
  <circle cx="200" cy="180" r="55" fill="#FFDD00" opacity="0.9"/>
  <circle cx="200" cy="180" r="45" fill="#FFEE44"/>

  <!-- Sun rays - DIFF 1: 8 sun rays (right has 5) -->
  <line x1="200" y1="118" x2="200" y2="105" stroke="#FFDD00" stroke-width="4"/>
  <line x1="200" y1="242" x2="200" y2="255" stroke="#FFDD00" stroke-width="4"/>
  <line x1="138" y1="180" x2="125" y2="180" stroke="#FFDD00" stroke-width="4"/>
  <line x1="262" y1="180" x2="275" y2="180" stroke="#FFDD00" stroke-width="4"/>
  <line x1="157" y1="137" x2="148" y2="128" stroke="#FFDD00" stroke-width="4"/>
  <line x1="243" y1="137" x2="252" y2="128" stroke="#FFDD00" stroke-width="4"/>
  <line x1="157" y1="223" x2="148" y2="232" stroke="#FFDD00" stroke-width="4"/>
  <line x1="243" y1="223" x2="252" y2="232" stroke="#FFDD00" stroke-width="4"/>

  <!-- Ground -->
  <rect x="0" y="330" width="400" height="170" fill="#8B6914"/>
  <rect x="0" y="320" width="400" height="20" fill="#A0782A"/>
  <!-- Grass tufts -->
  <path d="M20 320 Q22 305 24 320" stroke="#5a8a2a" stroke-width="3" fill="none"/>
  <path d="M30 320 Q32 308 34 320" stroke="#5a8a2a" stroke-width="3" fill="none"/>
  <path d="M100 320 Q102 306 104 320" stroke="#5a8a2a" stroke-width="3" fill="none"/>
  <path d="M280 320 Q282 308 284 320" stroke="#5a8a2a" stroke-width="3" fill="none"/>
  <path d="M360 320 Q362 305 364 320" stroke="#5a8a2a" stroke-width="3" fill="none"/>
  <path d="M370 320 Q372 310 374 320" stroke="#5a8a2a" stroke-width="3" fill="none"/>

  <!-- Acacia trees -->
  <!-- Left tree -->
  <rect x="38" y="200" width="10" height="130" fill="#5a3a10"/>
  <ellipse cx="43" cy="195" rx="40" ry="18" fill="#228B22"/>
  <ellipse cx="20" cy="205" rx="22" ry="14" fill="#1a7a1a"/>
  <ellipse cx="65" cy="205" rx="22" ry="14" fill="#1a7a1a"/>
  <!-- Right tree -->
  <rect x="348" y="210" width="10" height="120" fill="#5a3a10"/>
  <ellipse cx="353" cy="205" rx="38" ry="16" fill="#228B22"/>
  <ellipse cx="333" cy="213" rx="20" ry="13" fill="#1a7a1a"/>
  <ellipse cx="373" cy="213" rx="20" ry="13" fill="#1a7a1a"/>

  <!-- Giraffe -->
  <!-- Giraffe legs -->
  <rect x="280" y="380" width="12" height="90" fill="#DAA520"/>
  <rect x="296" y="380" width="12" height="90" fill="#DAA520"/>
  <rect x="315" y="380" width="12" height="90" fill="#DAA520"/>
  <rect x="331" y="380" width="12" height="90" fill="#DAA520"/>
  <!-- Giraffe hooves -->
  <rect x="278" y="462" width="16" height="12" rx="4" fill="#5a3a10"/>
  <rect x="294" y="462" width="16" height="12" rx="4" fill="#5a3a10"/>
  <rect x="313" y="462" width="16" height="12" rx="4" fill="#5a3a10"/>
  <rect x="329" y="462" width="16" height="12" rx="4" fill="#5a3a10"/>
  <!-- Giraffe body -->
  <ellipse cx="308" cy="368" rx="45" ry="30" fill="#DAA520"/>
  <!-- Giraffe spots -->
  <ellipse cx="295" cy="355" rx="9" ry="7" fill="#8B6914" opacity="0.6"/>
  <ellipse cx="320" cy="360" rx="8" ry="6" fill="#8B6914" opacity="0.6"/>
  <ellipse cx="305" cy="375" rx="7" ry="5" fill="#8B6914" opacity="0.6"/>
  <ellipse cx="328" cy="375" rx="6" ry="5" fill="#8B6914" opacity="0.6"/>
  <!-- Giraffe neck -->
  <rect x="295" y="270" width="25" height="105" rx="8" fill="#DAA520"/>
  <!-- Neck spots -->
  <ellipse cx="305" cy="285" rx="5" ry="8" fill="#8B6914" opacity="0.5"/>
  <ellipse cx="302" cy="310" rx="5" ry="7" fill="#8B6914" opacity="0.5"/>
  <ellipse cx="308" cy="335" rx="4" ry="6" fill="#8B6914" opacity="0.5"/>
  <!-- Giraffe head -->
  <ellipse cx="308" cy="258" rx="22" ry="16" fill="#DAA520"/>
  <!-- Ossicones (horns) - DIFF 2: 3 ossicones (right has 1) -->
  <rect x="296" y="242" width="5" height="15" rx="2" fill="#DAA520"/>
  <circle cx="298" cy="241" r="4" fill="#5a3a10"/>
  <rect x="306" y="238" width="5" height="18" rx="2" fill="#DAA520"/>
  <circle cx="308" cy="237" r="4" fill="#5a3a10"/>
  <rect x="316" y="242" width="5" height="15" rx="2" fill="#DAA520"/>
  <circle cx="318" cy="241" r="4" fill="#5a3a10"/>
  <!-- Giraffe eye -->
  <circle cx="320" cy="258" r="5" fill="#5a3a10"/>
  <circle cx="321" cy="256" r="2" fill="white"/>
  <!-- Giraffe mouth/nose -->
  <ellipse cx="328" cy="264" rx="6" ry="4" fill="#C8941C"/>
  <circle cx="326" cy="263" r="1.5" fill="#5a3a10"/>
  <circle cx="330" cy="263" r="1.5" fill="#5a3a10"/>

  <!-- Jeep / safari car -->
  <!-- Wheels -->
  <circle cx="115" cy="430" r="28" fill="#333"/>
  <circle cx="115" cy="430" r="20" fill="#555"/>
  <circle cx="115" cy="430" r="8" fill="#888"/>
  <circle cx="245" cy="430" r="28" fill="#333"/>
  <circle cx="245" cy="430" r="20" fill="#555"/>
  <circle cx="245" cy="430" r="8" fill="#888"/>
  <!-- Car body -->
  <rect x="75" y="370" width="195" height="65" rx="8" fill="#8B6914"/>
  <!-- Car cabin -->
  <rect x="100" y="320" width="120" height="55" rx="8" fill="#A0782A"/>
  <!-- Windows -->
  <rect x="108" y="328" width="45" height="35" rx="4" fill="#88CCFF" opacity="0.7"/>
  <rect x="162" y="328" width="45" height="35" rx="4" fill="#88CCFF" opacity="0.7"/>
  <!-- DIFF 3: Car has 4 roof lights (right has 2) -->
  <circle cx="115" cy="320" r="6" fill="#FFDD00"/>
  <circle cx="140" cy="318" r="6" fill="#FFDD00"/>
  <circle cx="165" cy="318" r="6" fill="#FFDD00"/>
  <circle cx="190" cy="320" r="6" fill="#FFDD00"/>
  <!-- Light glow -->
  <circle cx="115" cy="320" r="10" fill="#FFDD00" opacity="0.3"/>
  <circle cx="140" cy="318" r="10" fill="#FFDD00" opacity="0.3"/>
  <circle cx="165" cy="318" r="10" fill="#FFDD00" opacity="0.3"/>
  <circle cx="190" cy="320" r="10" fill="#FFDD00" opacity="0.3"/>
  <!-- Bumper -->
  <rect x="70" y="405" width="20" height="30" rx="5" fill="#555"/>

  <!-- Explorer in car -->
  <circle cx="135" cy="318" r="18" fill="#FDBCB4"/>
  <!-- Explorer hat -->
  <ellipse cx="135" cy="303" rx="24" ry="8" fill="#8B6914"/>
  <rect x="122" y="292" width="26" height="14" rx="4" fill="#8B6914"/>
  <!-- DIFF 4: Hat has 4 dots (right has 1) -->
  <circle cx="126" cy="299" r="2" fill="#5a3a10"/>
  <circle cx="132" cy="297" r="2" fill="#5a3a10"/>
  <circle cx="138" cy="297" r="2" fill="#5a3a10"/>
  <circle cx="144" cy="299" r="2" fill="#5a3a10"/>

  <!-- Binoculars -->
  <rect x="140" y="322" width="28" height="16" rx="4" fill="#333"/>
  <circle cx="147" cy="330" r="5" fill="#555"/>
  <circle cx="161" cy="330" r="5" fill="#555"/>

  <!-- Birds flying - DIFF 5: 5 birds (right has 2) -->
  <path d="M50 120 Q58 113 66 120" stroke="#1a0a00" stroke-width="2.5" fill="none"/>
  <path d="M80 100 Q88 93 96 100" stroke="#1a0a00" stroke-width="2.5" fill="none"/>
  <path d="M130 90 Q138 83 146 90" stroke="#1a0a00" stroke-width="2.5" fill="none"/>
  <path d="M60 140 Q68 133 76 140" stroke="#1a0a00" stroke-width="2" fill="none"/>
  <path d="M105 110 Q113 103 121 110" stroke="#1a0a00" stroke-width="2" fill="none"/>
</svg>
