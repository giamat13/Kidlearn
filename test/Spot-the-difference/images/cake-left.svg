<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="100%" stop-color="#e8d0b8"/>
    </linearGradient>
    <radialGradient id="cakeGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f8d0a0"/>
      <stop offset="100%" stop-color="#e0a860"/>
    </radialGradient>
  </defs>

  <!-- Background - party room -->
  <rect width="500" height="600" fill="url(#bgGrad)"/>

  <!-- Wall -->
  <rect width="500" height="450" fill="#f0dcc8"/>
  <!-- Wallpaper pattern -->
  <line x1="0" y1="150" x2="500" y2="150" stroke="#e0c8b0" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="300" x2="500" y2="300" stroke="#e0c8b0" stroke-width="1" opacity="0.5"/>
  <line x1="125" y1="0" x2="125" y2="450" stroke="#e0c8b0" stroke-width="1" opacity="0.5"/>
  <line x1="250" y1="0" x2="250" y2="450" stroke="#e0c8b0" stroke-width="1" opacity="0.5"/>
  <line x1="375" y1="0" x2="375" y2="450" stroke="#e0c8b0" stroke-width="1" opacity="0.5"/>

  <!-- Bunting / banners -->
  <path d="M 50 50 Q 150 80 250 50 Q 350 20 450 50" stroke="#cc4488" stroke-width="2" fill="none"/>
  <!-- Triangle flags -->
  <polygon points="90,52 110,52 100,75" fill="#cc4488" opacity="0.8"/>
  <polygon points="140,66 160,66 150,90" fill="#4488cc" opacity="0.8"/>
  <polygon points="190,58 210,58 200,82" fill="#44cc88" opacity="0.8"/>
  <polygon points="290,46 310,46 300,70" fill="#cc8844" opacity="0.8"/>
  <polygon points="340,34 360,34 350,58" fill="#cc4488" opacity="0.8"/>
  <polygon points="390,46 410,46 400,70" fill="#8844cc" opacity="0.8"/>

  <!-- Balloons -->
  <ellipse cx="60" cy="200" rx="28" ry="36" fill="#cc4040" opacity="0.85"/>
  <path d="M 60 236 Q 58 250 55 265" stroke="#cc4040" stroke-width="2" fill="none"/>
  <circle cx="56" cy="268" r="3" fill="#cc4040"/>
  <ellipse cx="440" cy="190" rx="28" ry="36" fill="#4040cc" opacity="0.85"/>
  <path d="M 440 226 Q 442 240 445 255" stroke="#4040cc" stroke-width="2" fill="none"/>
  <circle cx="446" cy="258" r="3" fill="#4040cc"/>
  <ellipse cx="95" cy="170" rx="22" ry="28" fill="#40cc40" opacity="0.85"/>
  <ellipse cx="410" cy="210" rx="22" ry="28" fill="#cc8800" opacity="0.85"/>

  <!-- Floor -->
  <rect x="0" y="450" width="500" height="150" fill="#c4a870"/>
  <line x1="0" y1="450" x2="500" y2="450" stroke="#a08850" stroke-width="3"/>
  <!-- Floorboards -->
  <line x1="0" y1="475" x2="500" y2="475" stroke="#b09060" stroke-width="1.5"/>
  <line x1="0" y1="500" x2="500" y2="500" stroke="#b09060" stroke-width="1.5"/>
  <line x1="0" y1="525" x2="500" y2="525" stroke="#b09060" stroke-width="1.5"/>
  <line x1="0" y1="550" x2="500" y2="550" stroke="#b09060" stroke-width="1.5"/>
  <line x1="100" y1="450" x2="100" y2="600" stroke="#b09060" stroke-width="1"/>
  <line x1="200" y1="450" x2="200" y2="600" stroke="#b09060" stroke-width="1"/>
  <line x1="300" y1="450" x2="300" y2="600" stroke="#b09060" stroke-width="1"/>
  <line x1="400" y1="450" x2="400" y2="600" stroke="#b09060" stroke-width="1"/>

  <!-- ═══ TABLE ═══ -->
  <rect x="100" y="410" width="300" height="15" rx="5" fill="#6a3a18"/>
  <rect x="103" y="410" width="294" height="10" rx="4" fill="#8a5028"/>
  <!-- Table cloth -->
  <path d="M 95 412 Q 250 400 405 412 L 408 425 Q 250 415 92 425 Z" fill="#f0e8ff"/>
  <!-- Table legs -->
  <rect x="115" y="422" width="15" height="80" rx="4" fill="#6a3a18"/>
  <rect x="370" y="422" width="15" height="80" rx="4" fill="#6a3a18"/>

  <!-- ═══ TABLE SETTINGS (cx≈0.75, cy≈0.60 → x≈375, y≈360) ═══ -->
  <!-- LEFT: has knife, fork, spoon on right side of table -->
  <!-- Fork -->
  <rect x="370" y="380" width="4" height="30" rx="1" fill="#c0c0c0"/>
  <line x1="369" y1="380" x2="369" y2="370" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="371" y1="380" x2="371" y2="370" stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="373" y1="380" x2="373" y2="370" stroke="#c0c0c0" stroke-width="1.5"/>
  <!-- Knife -->
  <rect x="385" y="370" width="4" height="40" rx="1" fill="#c0c0c0"/>
  <path d="M 385 370 L 389 370 L 388 380 L 385 380 Z" fill="#d0d0d0"/>
  <!-- Spoon -->
  <rect x="400" y="378" width="4" height="32" rx="1" fill="#c0c0c0"/>
  <ellipse cx="402" cy="374" rx="5" ry="7" fill="#c0c0c0"/>

  <!-- ═══ PLATES (cx≈0.35, cy≈0.75 → x≈175, y≈450) ═══ -->
  <!-- LEFT: stacked plates being held / ready to serve -->
  <!-- Stack of plates on left side of table -->
  <ellipse cx="148" cy="408" rx="30" ry="8" fill="#f5f0e8"/>
  <ellipse cx="148" cy="404" rx="28" ry="7" fill="#f8f4ec"/>
  <ellipse cx="148" cy="400" rx="26" ry="6" fill="#f5f0e8"/>
  <ellipse cx="148" cy="396" rx="24" ry="6" fill="#f8f4ec"/>
  <!-- Plate stack side -->
  <path d="M 122 408 Q 122 396 124 393 Q 136 388 148 390 Q 160 388 172 393 Q 174 396 174 408" fill="none" stroke="#e0d8d0" stroke-width="1.5"/>

  <!-- ═══ MAIN CAKE ═══ -->
  <!-- Cake stand -->
  <ellipse cx="250" cy="418" rx="62" ry="12" fill="#d0c8b8"/>
  <rect x="240" y="418" width="20" height="20" rx="3" fill="#c0b8a8"/>
  <ellipse cx="250" cy="438" rx="35" ry="8" fill="#c8c0b0"/>

  <!-- Cake base layer -->
  <ellipse cx="250" cy="390" rx="72" ry="15" fill="#f8d8a0"/>
  <rect x="178" y="370" width="144" height="22" rx="3" fill="#f8d0a0"/>
  <ellipse cx="250" cy="370" rx="72" ry="15" fill="#f0c880"/>

  <!-- Cake middle layer -->
  <ellipse cx="250" cy="368" rx="60" ry="12" fill="#f8d8a0"/>
  <rect x="190" y="345" width="120" height="25" rx="3" fill="#f8d0a0"/>
  <ellipse cx="250" cy="345" rx="60" ry="12" fill="#f0c880"/>

  <!-- Cake top layer -->
  <ellipse cx="250" cy="343" rx="48" ry="10" fill="#f8d8a0"/>
  <rect x="202" y="320" width="96" height="25" rx="3" fill="#f8d0a0"/>
  <ellipse cx="250" cy="320" rx="48" ry="10" fill="#f0c880"/>

  <!-- ═══ FROSTING / CREAM (cx≈0.40, cy≈0.50 → x≈200, y≈300) ═══ -->
  <!-- LEFT: Pink frosting drips on sides -->
  <path d="M 195 370 Q 190 380 185 390 Q 188 395 193 390 Q 196 382 198 370 Z" fill="#f880b0"/>
  <path d="M 220 370 Q 216 382 212 393 Q 215 398 220 393 Q 222 384 224 370 Z" fill="#f880b0"/>
  <path d="M 270 370 Q 274 382 276 393 Q 279 398 283 393 Q 282 382 278 370 Z" fill="#f880b0"/>
  <path d="M 295 368 Q 302 380 305 392 Q 308 396 312 392 Q 310 380 305 368 Z" fill="#f880b0"/>
  <!-- Top frosting -->
  <ellipse cx="250" cy="319" rx="46" ry="10" fill="#ff88bb"/>
  <ellipse cx="250" cy="318" rx="42" ry="8" fill="#ffaacc"/>
  <!-- Frosting swirls on top -->
  <path d="M 225 316 Q 230 310 238 314 Q 232 318 228 316" fill="#ff88bb"/>
  <path d="M 262 316 Q 268 310 274 314 Q 268 318 264 316" fill="#ff88bb"/>

  <!-- Middle layer frosting -->
  <ellipse cx="250" cy="344" rx="58" ry="12" fill="#ff88bb" opacity="0.7"/>
  <!-- Base layer frosting -->
  <ellipse cx="250" cy="369" rx="70" ry="14" fill="#ff88bb" opacity="0.6"/>

  <!-- ═══ FLOWERS ON BASE (cx≈0.65, cy≈0.55 → x≈325, y≈330) ═══ -->
  <!-- LEFT: has sugar flowers around cake base -->
  <circle cx="310" cy="368" r="7" fill="#f060a0"/>
  <circle cx="310" cy="368" r="4" fill="#f8d0e8"/>
  <circle cx="295" cy="375" r="6" fill="#40a0f0"/>
  <circle cx="295" cy="375" r="3" fill="#c0d8f8"/>
  <circle cx="320" cy="378" r="6" fill="#f0d020"/>
  <circle cx="320" cy="378" r="3" fill="#f8f0b0"/>
  <circle cx="190" cy="370" r="7" fill="#f060a0"/>
  <circle cx="190" cy="370" r="4" fill="#f8d0e8"/>
  <circle cx="202" cy="378" r="6" fill="#f0d020"/>
  <circle cx="202" cy="378" r="3" fill="#f8f0b0"/>
  <!-- Flower petals -->
  <ellipse cx="304" cy="362" rx="4" ry="3" fill="#f060a0" transform="rotate(-30,304,362)"/>
  <ellipse cx="316" cy="362" rx="4" ry="3" fill="#f060a0" transform="rotate(30,316,362)"/>
  <ellipse cx="304" cy="374" rx="4" ry="3" fill="#f060a0" transform="rotate(150,304,374)"/>
  <ellipse cx="316" cy="374" rx="4" ry="3" fill="#f060a0" transform="rotate(-150,316,374)"/>

  <!-- ═══ CANDLES (cx≈0.50, cy≈0.25 → x≈250, y≈150) ═══ -->
  <!-- LEFT: 5 candles with flames -->
  <rect x="220" y="292" width="7" height="26" rx="2" fill="#f06060"/>
  <rect x="233" y="290" width="7" height="28" rx="2" fill="#4088cc"/>
  <rect x="246" y="288" width="7" height="30" rx="2" fill="#f0d020"/>
  <rect x="259" y="290" width="7" height="28" rx="2" fill="#40c060"/>
  <rect x="272" y="292" width="7" height="26" rx="2" fill="#f06060"/>
  <!-- Candle flames -->
  <ellipse cx="223" cy="290" rx="4" ry="6" fill="#ff8c00"/>
  <ellipse cx="223" cy="289" rx="2.5" ry="4" fill="#ffe040"/>
  <ellipse cx="236" cy="288" rx="4" ry="6" fill="#ff8c00"/>
  <ellipse cx="236" cy="287" rx="2.5" ry="4" fill="#ffe040"/>
  <ellipse cx="249" cy="286" rx="4" ry="6" fill="#ff8c00"/>
  <ellipse cx="249" cy="285" rx="2.5" ry="4" fill="#ffe040"/>
  <ellipse cx="262" cy="288" rx="4" ry="6" fill="#ff8c00"/>
  <ellipse cx="262" cy="287" rx="2.5" ry="4" fill="#ffe040"/>
  <ellipse cx="275" cy="290" rx="4" ry="6" fill="#ff8c00"/>
  <ellipse cx="275" cy="289" rx="2.5" ry="4" fill="#ffe040"/>
  <!-- Candle wax drips -->
  <path d="M 222 296 Q 220 302 221 308 Q 224 308 225 302 Q 224 296 222 296 Z" fill="#e84040" opacity="0.6"/>
  <path d="M 249 294 Q 247 300 248 306 Q 251 306 252 300 Q 251 294 249 294 Z" fill="#d0b010" opacity="0.6"/>

  <!-- "Happy Birthday" text on cake -->
  <path d="M 210 340 Q 250 332 290 340" stroke="#c04080" stroke-width="1.5" fill="none" opacity="0.7"/>
  <text x="218" y="338" font-family="cursive" font-size="9" fill="#c04080">Happy Birthday!</text>

  <!-- Gifts on floor -->
  <rect x="50" y="420" width="60" height="50" rx="4" fill="#4488cc"/>
  <rect x="52" y="422" width="56" height="46" rx="3" fill="#5598dd"/>
  <line x1="80" y1="420" x2="80" y2="470" stroke="#cc4488" stroke-width="3"/>
  <line x1="50" y1="445" x2="110" y2="445" stroke="#cc4488" stroke-width="3"/>
  <!-- Gift bow -->
  <path d="M 75 420 Q 70 412 65 416 Q 68 420 75 420" fill="#cc4488"/>
  <path d="M 85 420 Q 90 412 95 416 Q 92 420 85 420" fill="#cc4488"/>
  <circle cx="80" cy="420" r="3" fill="#ee66aa"/>

  <rect x="370" y="430" width="80" height="40" rx="4" fill="#cc8800"/>
  <rect x="372" y="432" width="76" height="36" rx="3" fill="#ddaa10"/>
  <line x1="410" y1="430" x2="410" y2="470" stroke="#cc4400" stroke-width="3"/>
  <line x1="370" y1="450" x2="450" y2="450" stroke="#cc4400" stroke-width="3"/>
</svg>
