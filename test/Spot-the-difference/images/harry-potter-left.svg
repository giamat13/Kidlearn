    <line x1="359" y1="322" x2="354" y2="305" stroke="#FFD700" stroke-width="1.5" opacity="0.7"/>
    <line x1="359" y1="322" x2="367" y2="304" stroke="#FFD700" stroke-width="1.5" opacity="0.7"/>
