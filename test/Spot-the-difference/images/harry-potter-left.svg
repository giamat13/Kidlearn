  <path d="M 145 310 Q 130 340 120 420 Q 115 470 118 540 L 185 540 L 180 420 L 195 380 L 250 370 L 305 380 L 320 420 L 315 540 L 382 540 Q 385 470 380 420 Q 370 340 355 310 Q 310 295 250 292 Q 190 295 145 310 Z" fill="#2a1a0a"/>
