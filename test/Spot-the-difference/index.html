<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>מצא את ההבדלים</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 18px 20px 12px;
      background: rgba(255,255,255,0.05);
      border-bottom: 2px solid rgba(255,215,0,0.3);
    }

    header h1 {
      font-size: 2rem;
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
      letter-spacing: 2px;
    }

    #scene-name {
      font-size: 1rem;
      color: #aaa;
      margin-top: 4px;
    }

    .hud {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      padding: 10px 20px;
      font-size: 1.1rem;
    }

    .hud-item { text-align: center; }

    .hud-label {
      font-size: 0.72rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 1.6rem;
      font-weight: bold;
      color: #FFD700;
    }

    .time-bar-container {
      width: 200px;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,215,0,0.3);
    }

    .time-bar {
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      width: 100%;
      transition: width 0.3s linear;
    }

    .time-bar.warn { background: linear-gradient(90deg, #FF4444, #FF0000); }

    @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

    .progress-bar-wrap { text-align: center; padding: 0 20px 8px; }

    .progress-bar { display: inline-flex; gap: 8px; }

    .diff-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #FFD700;
      background: transparent;
      transition: all 0.4s;
    }

    .diff-dot.found {
      background: #FFD700;
      box-shadow: 0 0 10px rgba(255,215,0,0.8);
    }

    .game-area {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 8px 20px 20px;
      flex-wrap: wrap;
    }

    .image-container {
      position: relative;
      cursor: crosshair;
      border: 3px solid rgba(255,215,0,0.4);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: border-color 0.3s;
      flex-shrink: 0;
    }

    .image-container:hover { border-color: rgba(255,215,0,0.8); }

    .image-container img {
      display: block;
      width: 380px;
      height: auto;
      max-width: 100%;
    }

    .image-label {
      text-align: center;
      padding: 7px;
      background: rgba(0,0,0,0.4);
      font-size: 0.88rem;
      letter-spacing: 1px;
      color: #FFD700;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      width: 40px; height: 40px;
      border: 3px solid;
      transform: translate(-50%, -50%) scale(0);
      animation: rippleAnim 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 10;
    }
    .ripple.hit { border-color: #00FF88; }
    .ripple.miss { border-color: #FF4444; }
    @keyframes rippleAnim { to { transform: translate(-50%, -50%) scale(2); opacity: 0; } }

    .marker {
      position: absolute;
      border-radius: 50%;
      border: 3px solid #00FF88;
      background: rgba(0,255,136,0.15);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: markerAppear 0.4s ease-out;
      z-index: 5;
    }
    @keyframes markerAppear {
      from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .overlay.show { display: flex; }

    .overlay-box {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 2px solid #FFD700;
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 0 50px rgba(255,215,0,0.3);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .overlay-box h2 { font-size: 2rem; color: #FFD700; margin-bottom: 15px; }
    .overlay-box p { color: #ccc; margin-bottom: 25px; font-size: 1.05rem; line-height: 1.6; }

    .overlay-btn {
      padding: 13px 32px;
      background: #FFD700;
      color: #1a1a2e;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .overlay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255,215,0,0.5);
    }
    .overlay-btn.secondary {
      background: transparent;
      border: 2px solid #FFD700;
      color: #FFD700;
    }
    .overlay-btn.secondary:hover { background: rgba(255,215,0,0.1); }

    .hint-btn {
      display: block;
      margin: 0 auto 8px;
      padding: 7px 18px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      transition: all 0.3s;
    }
    .hint-btn:hover { background: rgba(255,255,255,0.2); }
    .hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #hint-remaining {
      display: inline-block;
      background: #FFD700;
      color: #1a1a2e;
      border-radius: 10px;
      padding: 0 6px;
      font-size: 0.78rem;
      font-weight: bold;
      margin-right: 5px;
    }

    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      top: -20px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
      z-index: 200;
      pointer-events: none;
    }
    @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

    .star-burst {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      font-size: 1.4rem;
      animation: starBurst 0.8s ease-out forwards;
      transform: translate(-50%, -50%);
    }
    @keyframes starBurst {
      0%   { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      50%  { transform: translate(-50%, -80%) scale(1.3); opacity: 1; }
      100% { transform: translate(-50%, -120%) scale(1); opacity: 0; }
    }

    @media (max-width: 820px) {
      .image-container img { width: 320px; }
      header h1 { font-size: 1.5rem; }
      .hud { gap: 20px; }
    }
    @media (max-width: 680px) {
      .game-area { gap: 10px; }
      .image-container img { width: 90vw; }
    }

<body>

<header>
  <h1>🔍 מצא את ההבדלים</h1>
  <div id="scene-name">לחץ על ההבדלים שמצאת בשתי התמונות</div>
</header>

<div class="hud">
  <div class="hud-item">
    <div class="hud-label">הבדלים</div>
    <div class="hud-value"><span id="found-count">0</span> / <span id="total-count">5</span></div>
  </div>
  <div class="hud-item">
    <div class="hud-label">זמן נותר</div>
    <div class="time-bar-container">
      <div class="time-bar" id="time-bar"></div>
    </div>
  </div>
  <div class="hud-item">
    <div class="hud-label">ניקוד</div>
    <div class="hud-value" id="score">0</div>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-bar" id="progress-bar"></div>
</div>

<div style="text-align:center; margin-bottom:6px;">
  <button class="hint-btn" id="hint-btn" onclick="showHint()">
    <span id="hint-remaining">3</span> רמזים נותרו — לחץ לרמז
  </button>
</div>

<div class="game-area">
  <div>
    <div class="image-label">תמונה א׳</div>
    <div class="image-container" id="left-container" onclick="handleClick(event,'left')">
      <img id="left-img" src="" alt="תמונה שמאל"/>
    </div>
  </div>
  <div>
    <div class="image-label">תמונה ב׳</div>
    <div class="image-container" id="right-container" onclick="handleClick(event,'right')">
      <img id="right-img" src="" alt="תמונה ימין"/>
    </div>
  </div>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div class="overlay-box">
    <h2>🎉 כל הכבוד!</h2>
    <p id="win-msg"></p>
    <button class="overlay-btn" onclick="restartGame()">שחק שוב</button>
    <button class="overlay-btn secondary" onclick="nextScene()">סצנה הבאה 🎲</button>
  </div>
</div>

<!-- Lose overlay -->
<div class="overlay" id="lose-overlay">
  <div class="overlay-box">
    <h2>⏰ הזמן נגמר!</h2>
    <p id="lose-msg"></p>
    <button class="overlay-btn" onclick="restartGame()">נסה שוב</button>
    <button class="overlay-btn secondary" onclick="nextScene()">סצנה אחרת 🎲</button>
  </div>
</div>

        { cx: 0.50, cy: 0.20, r: 30, label: "ציפור בשמיים" },
        { cx: 0.35, cy: 0.60, r: 28, label: "עצריך בחול" },
        { cx: 0.65, cy: 0.55, r: 32, label: "סט ים בים" },
        { cx: 0.50, cy: 0.75, r: 28, label: "רגליים בחול" },
        { cx: 0.25, cy: 0.40, r: 26, label: "ערימה בים" },
      ]
    },
    {
      name: "🎨 אמן",
      left:  "images/artist-left.svg",
      right: "images/artist-right.svg",
      differences: [
        { cx: 0.50, cy: 0.30, r: 32, label: "מברשות בכד" },
        { cx: 0.40, cy: 0.55, r: 28, label: "צבע על הדשא" },
        { cx: 0.65, cy: 0.50, r: 30, label: "ציור על קנבס" },
        { cx: 0.35, cy: 0.70, r: 28, label: "צבע על הבגד" },
        { cx: 0.75, cy: 0.45, r: 26, label: "משקפיים על הראש" },
      ]
    },
    {
      name: "🚂 רכבת",
      left:  "images/train-left.svg",
      right: "images/train-right.svg",
      differences: [
        { cx: 0.50, cy: 0.25, r: 34, label: "עשן מהקיטור" },
        { cx: 0.35, cy: 0.55, r: 28, label: "כרטיסים בחלון" },
        { cx: 0.65, cy: 0.50, r: 30, label: "גלגלים של הרכבת" },
        { cx: 0.50, cy: 0.75, r: 28, label: "מסילות ברזל" },
        { cx: 0.25, cy: 0.40, r: 26, label: "תמונה בחלון" },
      ]
    },
    {
      name: "🍰 בדיקה",
      left:  "images/cake-left.svg",
      right: "images/cake-right.svg",
      differences: [
        { cx: 0.50, cy: 0.25, r: 30, label: "נרות על העוגה" },
        { cx: 0.40, cy: 0.50, r: 28, label: "קרם על העוגה" },
        { cx: 0.65, cy: 0.55, r: 32, label: "פרחים על הבסיס" },
        { cx: 0.35, cy: 0.75, r: 28, label: "צלחות אחוזות" },
        { cx: 0.75, cy: 0.60, r: 26, label: "כלים על השולחן" },
      ]
    },
  ];

  // ─── State ───────────────────────────────────────────────────────────────────
  let currentSceneIdx = 0;
  let scene = null;
  let timeLeft = 180;
  let timerInterval = null;
  let score = 0;
  let foundCount = 0;
  let hintsLeft = 3;
  let gameOver = false;

  // ─── Random next scene (never same as current) ───────────────────────────────
  function randomOtherIdx() {
    if (ALL_SCENES.length === 1) return 0;
    let idx;
    do { idx = Math.floor(Math.random() * ALL_SCENES.length); }
    while (idx === currentSceneIdx);
    return idx;
  }

  // ─── Load scene ──────────────────────────────────────────────────────────────
  function loadScene(idx) {
    currentSceneIdx = idx;
    scene = JSON.parse(JSON.stringify(ALL_SCENES[idx]));
    scene.differences.forEach(d => d.found = false);

    document.getElementById('left-img').src  = scene.left;
    document.getElementById('right-img').src = scene.right;
    document.getElementById('total-count').textContent = scene.differences.length;
    document.getElementById('scene-name').textContent = scene.name;

    score = 0; foundCount = 0; hintsLeft = 3; timeLeft = 180; gameOver = false;

    document.getElementById('score').textContent = 0;
    document.getElementById('found-count').textContent = 0;
    document.getElementById('hint-remaining').textContent = hintsLeft;
    document.getElementById('hint-btn').disabled = false;

    clearMarkers();
    buildProgressDots();
    updateTimer();

    clearInterval(timerInterval);
    timerInterval = setInterval(tick, 1000);

    document.getElementById('win-overlay').classList.remove('show');
    document.getElementById('lose-overlay').classList.remove('show');
  }

  function restartGame() { loadScene(currentSceneIdx); }
  function nextScene()   { loadScene(randomOtherIdx()); }

  // ─── Timer ───────────────────────────────────────────────────────────────────
  function tick() {
    if (gameOver) return;
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) { clearInterval(timerInterval); endGame(false); }
  }

  function updateTimer() {
    const totalTime = 180;
    const percent = Math.max(0, (timeLeft / totalTime) * 100);
    const bar = document.getElementById('time-bar');
    bar.style.width = percent + '%';
    bar.classList.toggle('warn', timeLeft <= 30);
  }

  // ─── Progress dots ───────────────────────────────────────────────────────────
  function buildProgressDots() {
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    scene.differences.forEach(() => {
      const d = document.createElement('div');
      d.className = 'diff-dot';
      bar.appendChild(d);
    });
  }

  function updateProgressDots() {
    document.querySelectorAll('.diff-dot').forEach((dot, i) => {
      dot.classList.toggle('found', scene.differences[i].found);
    });
  }

  // ─── Click handling ──────────────────────────────────────────────────────────
  function handleClick(e, side) {
    if (gameOver) return;
    const container = e.currentTarget;
    const rect  = container.getBoundingClientRect();
    const imgEl = container.querySelector('img');
    const imgRect = imgEl.getBoundingClientRect();

    const rx = (e.clientX - imgRect.left) / imgRect.width;
    const ry = (e.clientY - imgRect.top)  / imgRect.height;

    const hitIdx = findHit(rx, ry, imgRect.width, imgRect.height);

    if (hitIdx >= 0 && !scene.differences[hitIdx].found) {
      scene.differences[hitIdx].found = true;
      foundCount++;
      score += Math.max(10, Math.floor(timeLeft / 3));

      document.getElementById('found-count').textContent = foundCount;
      document.getElementById('score').textContent = score;
      updateProgressDots();

      placeMarker('left-container',  hitIdx);
      placeMarker('right-container', hitIdx);
      spawnStarBurst(container, e.clientX - imgRect.left, e.clientY - imgRect.top);
      spawnRipple(container, e.clientX - rect.left, e.clientY - rect.top, 'hit');

      if (foundCount === scene.differences.length) setTimeout(() => endGame(true), 400);
    } else {
      spawnRipple(container, e.clientX - rect.left, e.clientY - rect.top, 'miss');
      score = Math.max(0, score - 3);
      document.getElementById('score').textContent = score;
    }
  }

  function findHit(rx, ry, imgW, imgH) {
    for (let i = 0; i < scene.differences.length; i++) {
      const d = scene.differences[i];
      const dx = (rx - d.cx) * imgW;
      const dy = (ry - d.cy) * imgH;
      if (Math.sqrt(dx*dx + dy*dy) <= d.r) return i;
    }
    return -1;
  }

  function placeMarker(containerId, diffIdx) {
    const container = document.getElementById(containerId);
    const imgEl = container.querySelector('img');
    const d = scene.differences[diffIdx];
    const w = imgEl.clientWidth  || imgEl.offsetWidth;
    const h = imgEl.clientHeight || imgEl.offsetHeight;
    const m = document.createElement('div');
    m.className = 'marker';
    m.dataset.diffIdx = diffIdx;
    const size = d.r * 2;
    m.style.left   = (d.cx * w) + 'px';
    m.style.top    = (d.cy * h) + 'px';
    m.style.width  = size + 'px';
    m.style.height = size + 'px';
    container.appendChild(m);
  }

  function clearMarkers() {
    document.querySelectorAll('.marker, .star-burst').forEach(el => el.remove());
  }

  // ─── Visual effects ──────────────────────────────────────────────────────────
  function spawnRipple(container, x, y, type) {
    const r = document.createElement('div');
    r.className = 'ripple ' + type;
    r.style.left = x + 'px';
    r.style.top  = y + 'px';
    container.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  function spawnStarBurst(container, x, y) {
    const emojis = ['⭐','✨','🌟','💫'];
    const s = document.createElement('div');
    s.className = 'star-burst';
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    container.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }

  function spawnConfetti() {
    const colors = ['#FFD700','#FF6699','#00FF88','#66CCFF','#FF9900','#CC00FF'];
    for (let i = 0; i < 80; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      c.style.animationDelay    = Math.random() * 0.5 + 's';
      c.style.width  = (6 + Math.random() * 8) + 'px';
      c.style.height = (6 + Math.random() * 8) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(c);
      c.addEventListener('animationend', () => c.remove());
    }
  }

  // ─── Hint ────────────────────────────────────────────────────────────────────
  function showHint() {
    if (hintsLeft <= 0 || gameOver) return;
    const unfound = scene.differences.filter(d => !d.found);
    if (!unfound.length) return;
    const pick = unfound[Math.floor(Math.random() * unfound.length)];

    const container = document.getElementById('left-container');
    const imgEl = container.querySelector('img');
    const w = imgEl.clientWidth || imgEl.offsetWidth;
    const h = imgEl.clientHeight || imgEl.offsetHeight;
    const size = pick.r * 2 + 20;

    const flash = document.createElement('div');
    flash.style.cssText = `
      position:absolute; border-radius:50%; border:4px solid #FFD700;
      background:rgba(255,215,0,0.2);
      width:${size}px; height:${size}px;
      left:${pick.cx * w}px; top:${pick.cy * h}px;
      transform:translate(-50%,-50%);
      pointer-events:none; z-index:15;
      animation: hintFlash 1.5s ease-out forwards;
    `;
    const style = document.createElement('style');
    style.textContent = `@keyframes hintFlash { 0%,100%{opacity:0} 20%,80%{opacity:1} }`;
    document.head.appendChild(style);
    container.appendChild(flash);
    flash.addEventListener('animationend', () => flash.remove());

    hintsLeft--;
    document.getElementById('hint-remaining').textContent = hintsLeft;
    if (hintsLeft === 0) document.getElementById('hint-btn').disabled = true;
    score = Math.max(0, score - 15);
    document.getElementById('score').textContent = score;
  }

  // ─── End game ────────────────────────────────────────────────────────────────
  function endGame(won) {
    clearInterval(timerInterval);
    gameOver = true;
    if (won) {
      spawnConfetti();
      const bonus = timeLeft * 2;
      score += bonus;
      document.getElementById('score').textContent = score;
      document.getElementById('win-msg').textContent =
        `מצאת את כל ${scene.differences.length} ההבדלים! 🏆  בונוס זמן: +${bonus}  ניקוד סופי: ${score}`;
      document.getElementById('win-overlay').classList.add('show');
    } else {
      document.getElementById('lose-msg').textContent =
        `מצאת ${foundCount} מתוך ${scene.differences.length} הבדלים. ניקוד: ${score}`;
      document.getElementById('lose-overlay').classList.add('show');
    }
  }

  // ─── Start with random scene ─────────────────────────────────────────────────
  loadScene(Math.floor(Math.random() * ALL_SCENES.length));
</script>
</body>
</html>
