<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מזג האוויר והירח</title>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FC; --sky-dark:#D9EEF8; --ink:#22303A; --accent:#1E88C7;
    --muted:#7B8C97; --shadow:rgba(30,60,80,.12);
  }
  *{box-sizing:border-box}
  body{font-family:'Rubik',sans-serif;color:var(--ink);background:var(--sky);
    margin:0;padding:20px 16px 60px;min-height:100vh}
  a.back{display:inline-block;margin:0 0 6px;color:var(--muted);text-decoration:none;font-size:.85rem}
  a.back:hover{color:var(--accent)}
  header.masthead{max-width:480px;margin:8px auto 6px;display:flex;align-items:center;
    justify-content:center;gap:10px}
  .badge{flex:none;width:52px;height:52px;background:var(--sky-dark);
    border:2px dashed var(--accent);border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:24px;box-shadow:0 3px 0 var(--shadow)}
  h1{font-family:'Suez One',serif;color:var(--accent);text-align:center;font-size:1.8rem;margin:0}
  .subtitle{text-align:center;color:var(--muted);margin:2px 0 22px;font-size:.95rem}

  .card{background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 8px 22px var(--shadow);
    max-width:420px;margin:0 auto 18px;text-align:center;transition:background-color .4s}
  .card h2{font-family:'Suez One',serif;font-weight:400;font-size:1.1rem;color:var(--ink);margin:0 0 14px}
  .loading{color:var(--muted);font-size:13px}
  .err{color:#b23b2f}

  .weather-emoji{font-size:56px;line-height:1}
  .weather-temp{font-family:'Suez One',serif;font-size:2.6rem;color:var(--accent);margin:2px 0}
  .weather-label{font-size:15px;color:var(--muted)}

  .thermo-row{display:flex;align-items:center;justify-content:center;gap:18px}

  .outfit-title{font-size:13px;color:var(--muted);margin:18px 0 8px}
  .outfit-list{display:flex;flex-direction:column;gap:8px}
  .outfit-row{display:flex;align-items:center;gap:12px;background:var(--sky-dark);
    border-radius:12px;padding:8px 14px;text-align:start}
  .outfit-icon{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    font-size:24px}
  .outfit-text{font-size:15px}
  .outfit-text b{color:var(--accent)}

  .moon-emoji{font-size:56px;line-height:1}
  .moon-name{font-family:'Suez One',serif;font-size:1.3rem;color:var(--ink);margin-top:6px}

  .day-row{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
  .day-btn{padding:8px 16px;border:2px solid var(--sky-dark);border-radius:999px;background:#fff;
    color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer}
  .day-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent)}

  .clock-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px;
    padding-bottom:18px;border-bottom:1px dashed var(--sky-dark)}
  .clock-hint{font-size:12px;color:var(--muted)}
  #pick-clock{touch-action:none;cursor:grab;user-select:none}
  .clock-controls{display:flex;align-items:center;gap:10px}
  .clock-readout{font-family:'Suez One',serif;font-size:1.1rem;color:var(--accent);min-width:70px}
  #ampm-toggle{padding:7px 14px;font-size:16px;border:2px solid var(--sky-dark);border-radius:999px;
    background:#fff;cursor:pointer;font-family:inherit}

  .sunset-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;
    padding-top:14px;border-top:1px dashed var(--sky-dark);font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<a class="back" href="../index.html">⟵ חזרה</a>
<header class="masthead">
  <span class="badge">☁️</span>
  <span class="badge">🌙</span>
  <h1>מזג האוויר והירח</h1>
</header>
<p class="subtitle">חם או קר עכשיו בחוץ? מה ללבוש? ואיך הירח נראה הלילה?</p>

<div class="card" id="weather-card">
  <div class="day-row" id="day-row">
    <button type="button" class="day-btn" data-offset="0">היום</button>
    <button type="button" class="day-btn" data-offset="1">מחר</button>
    <button type="button" class="day-btn" data-offset="2">מחרתיים</button>
  </div>

  <div class="clock-wrap">
    <svg id="pick-clock" width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">
      <circle cx="70" cy="70" r="66" fill="#fff" stroke="#dbe6ec" stroke-width="3"/>
      <g id="clock-ticks"></g>
      <line id="clock-hand" x1="70" y1="70" x2="70" y2="26" stroke="#1E88C7" stroke-width="5" stroke-linecap="round"/>
      <circle cx="70" cy="70" r="5" fill="#1E88C7"/>
    </svg>
    <div class="clock-controls">
      <button type="button" id="ampm-toggle"></button>
      <span class="clock-readout" id="clock-readout"></span>
    </div>
    <div class="clock-hint">גררו את המחוג לשעה שמעניינת אתכם</div>
  </div>

  <div id="weather-box"><p class="loading">טוען...</p></div>
</div>

<div class="card">
  <h2 id="moon-title">🌙 הירח הלילה</h2>
  <div id="moon-box"><p class="loading">טוען...</p></div>
</div>

<script>
// Icons are composed from a small set of parts (☀️/☁️/🌧️/⛈️) rather than
// picked from unrelated single glyphs, so any code that includes a sun can
// have just that sun swapped for the moon phase after sunset (see the
// emoji.startsWith("☀️") check below) while the rest of the icon stays put.
const WEATHER_CODES = {
  0: ["☀️", "שמיים בהירים"], 1: ["☀️☁️", "בהיר בעיקר"], 2: ["☀️☁️☁️", "מעונן חלקית"], 3: ["☁️☁️", "מעונן"],
  45: ["🌫️", "ערפל"], 48: ["🌫️", "ערפילי כפור"],
  51: ["☀️🌧️", "טפטוף קל"], 53: ["🌧️", "טפטוף"], 55: ["🌧️", "טפטוף חזק"],
  61: ["🌧️", "גשם קל"], 63: ["🌧️", "גשם"], 65: ["🌧️", "גשם חזק"],
  71: ["🌨️", "שלג קל"], 73: ["🌨️", "שלג"], 75: ["❄️", "שלג כבד"],
  80: ["☀️🌧️", "ממטרים"], 81: ["☀️🌧️", "ממטרים"], 82: ["⛈️", "ממטרים עזים"],
  95: ["⛈️", "סופת רעמים"],
};
const RAIN_CODES = [51, 53, 55, 61, 63, 65, 80, 81, 82, 95];
const SNOW_CODES = [71, 73, 75];

// Picture-based cues (thermometer color/height + an outfit checklist) so a
// child who can't read yet can still tell hot-vs-cold and what to put on.
// There's no "long sleeve shirt" emoji, so that one row draws a tiny SVG
// instead - short vs. long rectangles standing in for sleeves.
function thermoColor(temp) {
  if (temp >= 32) return "#EB5757";
  if (temp >= 25) return "#F2994A";
  if (temp >= 15) return "#F2C94C";
  if (temp >= 5) return "#56C596";
  return "#2F80ED";
}
function renderThermometer(temp) {
  const fill = document.getElementById("thermo-fill");
  const bulb = document.getElementById("thermo-bulb");
  const frac = Math.min(1, Math.max(0, (temp + 10) / 55)); // scale: -10°C..45°C
  const height = Math.round(frac * 94);
  const color = thermoColor(temp);
  fill.setAttribute("y", 104 - height);
  fill.setAttribute("height", height);
  fill.setAttribute("fill", color);
  bulb.setAttribute("fill", color);
}
function shirtIcon(long) {
  const sleeveH = long ? 26 : 9;
  return `<svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true">
    <rect x="9" y="4" width="12" height="28" rx="3" fill="#1E88C7"/>
    <rect x="1" y="4" width="8" height="${sleeveH}" rx="3" fill="#1E88C7"/>
    <rect x="21" y="4" width="8" height="${sleeveH}" rx="3" fill="#1E88C7"/>
  </svg>`;
}
// Outfit decisions look at the whole day's forecast (min/max temp, whether
// it rains or snows at ANY hour that day), not just the moment the clock is
// set to - a kid heading out in the morning still needs to know it'll rain
// in the afternoon, or that a currently-warm evening started off cold.
function outfitFor(dayStats, uvMax) {
  const { minTemp, maxTemp, hasRain, hasSnow } = dayStats;
  return {
    shirtLong: minTemp < 20,
    pantsLong: minTemp < 22,
    // Sandals go by the day's HOT end, not the cold end - if it gets hot at
    // any point, that's sandal weather, as long as it won't be rained/snowed on.
    sandals: maxTemp >= 24 && !hasRain && !hasSnow,
    umbrella: hasRain,
    coat: minTemp < 10 || hasSnow,
    sweater: minTemp >= 10 && minTemp < 16,
    // UV index scale (WHO): 3+ is "moderate" and up - sunscreen recommended.
    sunscreen: uvMax >= 3,
  };
}
// Shirt/pants/shoes always show, state told by both the symbol and the word.
// Umbrella/coat/sweater/sunscreen only show up at all when actually needed.
function outfitRows(dayStats, uvMax) {
  const out = outfitFor(dayStats, uvMax);
  const rows = [
    { icon: shirtIcon(out.shirtLong), text: `חולצה ${out.shirtLong ? "ארוכה" : "קצרה"}` },
    { icon: out.pantsLong ? "👖" : "🩳", text: `מכנסיים ${out.pantsLong ? "ארוכים" : "קצרים"}` },
    { icon: out.sandals ? "👡" : "👟", text: out.sandals ? "סנדלים" : "נעליים" },
  ];
  if (out.sunscreen) rows.push({ icon: "🧴", text: "קרם הגנה" });
  if (out.umbrella) rows.push({ icon: "☂️", text: "מטרייה" });
  if (out.coat) rows.push({ icon: "🧥", text: "מעיל" });
  if (out.sweater) rows.push({ icon: "🧶", text: "סווצ'ר" });
  return rows;
}

// Forecast for today + the next 2 days, at hourly resolution, fetched once.
// The day buttons and the draggable clock just pick an (offset, hour) into
// this already-downloaded data - no extra request per selection.
let weatherData = null;
let selectedOffset = 0;
let selectedHour = new Date().getHours();
let isPM = selectedHour >= 12;

function staticClockSvg(hour24, minute) {
  const hourAngle = ((hour24 % 12) + minute / 60) * 30;
  const minuteAngle = minute * 6;
  let numbers = "";
  for (let h = 1; h <= 12; h++) {
    const angle = (h / 12) * 2 * Math.PI - Math.PI / 2;
    const x = 70 + Math.cos(angle) * 52;
    const y = 70 + Math.sin(angle) * 52;
    numbers += `<text x="${x}" y="${y + 5}" font-size="13" text-anchor="middle" fill="#22303A">${h}</text>`;
  }
  return `<svg width="110" height="110" viewBox="0 0 140 140" aria-hidden="true">
    <circle cx="70" cy="70" r="66" fill="#fff" stroke="#dbe6ec" stroke-width="3"/>
    ${numbers}
    <line x1="70" y1="70" x2="70" y2="32" stroke="#F2994A" stroke-width="5" stroke-linecap="round"
      transform="rotate(${hourAngle} 70 70)"/>
    <line x1="70" y1="70" x2="70" y2="20" stroke="#7B8C97" stroke-width="3" stroke-linecap="round"
      transform="rotate(${minuteAngle} 70 70)"/>
    <circle cx="70" cy="70" r="5" fill="#22303A"/>
  </svg>`;
}

function dayStartIndex(offset) {
  const dayStr = weatherData.daily.time[offset];
  return weatherData.hourly.time.findIndex((t) => t.slice(0, 10) === dayStr);
}
function hourlyIndex(offset, hour) {
  return dayStartIndex(offset) + hour;
}
// Only waking hours count toward the outfit recommendation - a cold 3am
// doesn't mean pack a coat, nobody's outside then.
const WAKE_START_HOUR = 7;
const WAKE_END_HOUR = 21; // exclusive
function dayStats(offset) {
  const start = dayStartIndex(offset) + WAKE_START_HOUR;
  const count = WAKE_END_HOUR - WAKE_START_HOUR;
  const temps = weatherData.hourly.temperature_2m.slice(start, start + count);
  const codes = weatherData.hourly.weathercode.slice(start, start + count);
  return {
    minTemp: Math.min(...temps),
    maxTemp: Math.max(...temps),
    hasRain: codes.some((c) => RAIN_CODES.includes(c)),
    hasSnow: codes.some((c) => SNOW_CODES.includes(c)),
  };
}

function renderForSelection() {
  const box = document.getElementById("weather-box");
  if (!weatherData) return;
  const idx = hourlyIndex(selectedOffset, selectedHour);
  const temp = Math.round(weatherData.hourly.temperature_2m[idx]);
  const code = weatherData.hourly.weathercode[idx];
  const uvMax = weatherData.daily.uv_index_max[selectedOffset];
  let [emoji, label] = WEATHER_CODES[code] || ["🌡️", "מזג אוויר"];

  const [sh, sm] = weatherData.daily.sunset[selectedOffset].split("T")[1].split(":").map(Number);
  const now = new Date();
  const isToday = selectedOffset === 0;
  const minsToSunset = isToday ? sh * 60 + sm - (now.getHours() * 60 + now.getMinutes()) : null;
  const sunsetText = isToday && minsToSunset > 0
    ? `שקיעה בעוד ${Math.floor(minsToSunset / 60)} שעות ו-${minsToSunset % 60} דקות (${String(sh).padStart(2, "0")}:${String(sm).padStart(2, "0")})`
    : `שקיעה בשעה ${String(sh).padStart(2, "0")}:${String(sm).padStart(2, "0")}`;

  // Any icon starting with the sun glyph (clear, partly cloudy, sunny
  // showers, ...) - after sunset, swap just the sun for tonight's actual
  // moon phase, keeping the rest of the icon (clouds, rain, ...) as-is.
  if (emoji.startsWith("☀️") && selectedHour * 60 >= sh * 60 + sm) {
    emoji = moonPhaseFor(selectedOffset)[0] + emoji.slice("☀️".length);
  }

  box.innerHTML = `
    <div class="thermo-row">
      <svg width="46" height="140" viewBox="0 0 46 140" aria-hidden="true">
        <rect x="16" y="6" width="14" height="100" rx="7" fill="#fff" stroke="#dbe6ec" stroke-width="2"/>
        <rect id="thermo-fill" x="18" y="104" width="10" height="0" fill="#2F80ED"/>
        <circle cx="23" cy="118" r="16" fill="#fff" stroke="#dbe6ec" stroke-width="2"/>
        <circle id="thermo-bulb" cx="23" cy="118" r="12" fill="#2F80ED"/>
      </svg>
      <div>
        <div class="weather-emoji">${emoji}</div>
        <div class="weather-temp">${temp}°C</div>
        <div class="weather-label">${label}</div>
      </div>
    </div>
    <div class="outfit-title">מה ללבוש היום? (לפי כל היום, לא רק השעה שנבחרה)</div>
    <div class="outfit-list">${outfitRows(dayStats(selectedOffset), uvMax).map((r) =>
      `<div class="outfit-row"><span class="outfit-icon">${r.icon}</span><span class="outfit-text">${r.text}</span></div>`
    ).join("")}</div>
    <div class="sunset-row">${staticClockSvg(sh, sm)}<span>🌇 ${sunsetText}</span></div>
  `;
  renderThermometer(temp);
  document.getElementById("weather-card").style.backgroundColor =
    temp >= 25 ? "#FFF6EC" : temp < 10 ? "#EEF6FC" : "#fff";
}

function buildClockFace() {
  const g = document.getElementById("clock-ticks");
  let svg = "";
  for (let h = 1; h <= 12; h++) {
    const angle = (h / 12) * 2 * Math.PI - Math.PI / 2;
    const x = 70 + Math.cos(angle) * 52;
    const y = 70 + Math.sin(angle) * 52;
    svg += `<text x="${x}" y="${y + 5}" font-size="13" text-anchor="middle" fill="#22303A">${h === 12 ? 12 : h}</text>`;
  }
  g.innerHTML = svg;
}
function updateClockUi() {
  const hour12 = selectedHour % 12;
  const hand = document.getElementById("clock-hand");
  hand.style.transformOrigin = "70px 70px";
  hand.style.transform = `rotate(${hour12 * 30}deg)`;
  document.getElementById("ampm-toggle").textContent = isPM ? "🌙 אחה״צ/ערב" : "☀️ בוקר/צהריים";
  document.getElementById("clock-readout").textContent = `${String(selectedHour).padStart(2, "0")}:00`;
}
function angleToHour12(svg, clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let angle = Math.atan2(clientY - cy, clientX - cx) + Math.PI / 2;
  if (angle < 0) angle += 2 * Math.PI;
  return Math.round((angle / (2 * Math.PI)) * 12) % 12;
}
function setupClock() {
  buildClockFace();
  const svg = document.getElementById("pick-clock");
  let dragging = false;
  const handlePointer = (e) => {
    const hour12 = angleToHour12(svg, e.clientX, e.clientY);
    selectedHour = hour12 + (isPM ? 12 : 0);
    updateClockUi();
    renderForSelection();
  };
  svg.addEventListener("pointerdown", (e) => { dragging = true; svg.setPointerCapture(e.pointerId); handlePointer(e); });
  svg.addEventListener("pointermove", (e) => { if (dragging) handlePointer(e); });
  svg.addEventListener("pointerup", () => { dragging = false; });
  document.getElementById("ampm-toggle").onclick = () => {
    isPM = !isPM;
    selectedHour = (selectedHour % 12) + (isPM ? 12 : 0);
    updateClockUi();
    renderForSelection();
  };
  updateClockUi();
}
function setupDayButtons() {
  document.querySelectorAll(".day-btn").forEach((btn) => {
    if (btn.dataset.offset === "0") btn.classList.add("selected");
    btn.onclick = () => {
      selectedOffset = Number(btn.dataset.offset);
      document.querySelectorAll(".day-btn").forEach((b) => b.classList.toggle("selected", b === btn));
      renderForSelection();
      loadMoon(selectedOffset);
    };
  });
}

async function loadWeather(lat, lon) {
  const box = document.getElementById("weather-box");
  try {
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode&daily=uv_index_max,sunset&timezone=auto&forecast_days=3`);
    if (!res.ok) throw new Error("weather fetch failed");
    weatherData = await res.json();
    setupClock();
    setupDayButtons();
    renderForSelection();
  } catch {
    box.innerHTML = `<p class="err">לא הצלחנו לטעון את מזג האוויר. נסו שוב מאוחר יותר ☁️</p>`;
  }
}
function initWeather() {
  const TEL_AVIV = [32.0853, 34.7818];
  if (!navigator.geolocation) { loadWeather(...TEL_AVIV); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude),
    () => loadWeather(...TEL_AVIV),
    { timeout: 5000 }
  );
}

// Local calculation (no API needed) - moon age in days since a known new moon,
// mapped to one of 8 phase names across the ~29.53-day synodic month.
// Names follow the Hebrew Wikipedia moon-phase table (he.wikipedia.org/wiki/מופע_הירח).
// Takes a day offset so it can follow the same היום/מחר/מחרתיים selection
// as the weather card.
const MOON_DAY_TITLES = ["🌙 הירח הלילה", "🌙 הירח מחר בלילה", "🌙 הירח מחרתיים בלילה"];
const MOON_PHASES = [
  ["🌑", "ירח חדש"], ["🌒", "סהר מתמלא"], ["🌓", "רבע ראשון"], ["🌔", "לקראת מילוא"],
  ["🌕", "ירח מלא"], ["🌖", "אחרי מילוא"], ["🌗", "רבע אחרון"], ["🌘", "סהר דועך"],
];
function moonPhaseFor(offset = 0) {
  const synodicMonth = 29.53058867;
  const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14);
  const daysSince = (Date.now() + offset * 86400000 - knownNewMoon) / 86400000;
  const age = ((daysSince % synodicMonth) + synodicMonth) % synodicMonth;
  const idx = Math.round((age / synodicMonth) * 8) % 8;
  return MOON_PHASES[idx];
}
function loadMoon(offset = 0) {
  document.getElementById("moon-title").textContent = MOON_DAY_TITLES[offset];
  const box = document.getElementById("moon-box");
  const [emoji, name] = moonPhaseFor(offset);
  box.innerHTML = `<div class="moon-emoji">${emoji}</div><div class="moon-name">${name}</div>`;
}

initWeather();
loadMoon();
</script>
</body>
</html>
