<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צביעה לפי מספרים 🎨</title>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Assistant:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#FFF0E6,#E6F0FF);
  font-family:'Varela Round','Assistant',Arial,sans-serif;
  direction:rtl;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Header */
.header{
  width:100%;
  background:linear-gradient(90deg,#FF6B9D,#FF8AB3);
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 3px 10px rgba(0,0,0,0.15);
}
.back-btn{
  background:rgba(255,255,255,0.3);
  border:none;
  color:white;
  font-size:1.4rem;
  padding:6px 14px;
  border-radius:10px;
  cursor:pointer;
  font-family:inherit;
  transition:background 0.2s;
}
.back-btn:hover{background:rgba(255,255,255,0.5);}
.header h1{
  color:white;
  font-size:1.6rem;
  text-shadow:1px 2px 4px rgba(0,0,0,0.2);
  flex:1;
  text-align:center;
}

/* Scene selector */
.scene-selector{
  display:flex;
  gap:10px;
  padding:14px 16px;
  overflow-x:auto;
  width:100%;
  justify-content:center;
  flex-wrap:wrap;
}
.scene-btn{
  background:white;
  border:3px solid #ddd;
  border-radius:14px;
  padding:8px 16px;
  font-size:1rem;
  cursor:pointer;
  font-family:inherit;
  transition:all 0.2s;
  white-space:nowrap;
  color:#555;
}
.scene-btn.active{
  border-color:#FF6B9D;
  background:#FFF0F5;
  color:#FF6B9D;
  font-weight:700;
  transform:scale(1.05);
}
.scene-btn:hover{border-color:#FF6B9D;transform:scale(1.03);}

/* Color legend */
.legend{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  padding:10px 16px;
  background:white;
  border-radius:16px;
  margin:0 12px 10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  max-width:520px;
  width:calc(100% - 24px);
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
  background:#f8f8f8;
  border-radius:10px;
  padding:5px 10px;
  font-size:0.95rem;
  font-weight:700;
  border:2px solid transparent;
}
.legend-swatch{
  width:28px;
  height:28px;
  border-radius:8px;
  border:2px solid rgba(0,0,0,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:0.85rem;
  font-weight:900;
  color:rgba(0,0,0,0.5);
}

/* Progress */
.progress-bar-wrap{
  width:calc(100% - 24px);
  max-width:520px;
  background:#eee;
  border-radius:999px;
  height:14px;
  margin:0 12px 10px;
  overflow:hidden;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,#FF6B9D,#FFA0C0);
  border-radius:999px;
  transition:width 0.5s ease;
  width:0%;
}
.progress-text{
  font-size:0.9rem;
  color:#888;
  text-align:center;
  margin-bottom:6px;
}

/* SVG canvas */
.canvas-wrap{
  width:calc(100% - 24px);
  max-width:520px;
  background:white;
  border-radius:20px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
  overflow:hidden;
  margin:0 12px 16px;
}
#coloring-svg{
  width:100%;
  height:auto;
  display:block;
}
.region{
  cursor:pointer;
  stroke:#333;
  stroke-width:2.5;
  transition:filter 0.15s;
}
.region:hover{filter:brightness(0.9);}
.region.colored{cursor:default;}
.region.colored:hover{filter:none;}
.num-label{
  font-family:'Varela Round',Arial,sans-serif;
  font-weight:900;
  font-size:18px;
  fill:#333;
  text-anchor:middle;
  dominant-baseline:central;
  pointer-events:none;
  user-select:none;
}
.num-label.done{
  fill:rgba(255,255,255,0.7);
}

/* Celebration overlay */
#celebration{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:999;
  justify-content:center;
  align-items:center;
}
#celebration.show{display:flex;}
.celebration-box{
  background:white;
  border-radius:24px;
  padding:36px 40px;
  text-align:center;
  max-width:320px;
  animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
}
@keyframes popIn{
  from{transform:scale(0.5);opacity:0;}
  to{transform:scale(1);opacity:1;}
}
.celebration-box h2{font-size:2rem;margin-bottom:10px;color:#FF6B9D;}
.celebration-box p{font-size:1.1rem;color:#555;margin-bottom:20px;}
.next-btn{
  background:linear-gradient(90deg,#FF6B9D,#FF8AB3);
  color:white;
  border:none;
  padding:14px 30px;
  border-radius:14px;
  font-size:1.1rem;
  font-family:inherit;
  cursor:pointer;
  font-weight:700;
  box-shadow:0 4px 12px rgba(255,107,157,0.4);
  transition:transform 0.2s;
}
.next-btn:hover{transform:scale(1.05);}

.confetti-piece{
  position:fixed;
  pointer-events:none;
  border-radius:3px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">← חזור</button>
  <h1>🎨 צביעה לפי מספרים</h1>
  <div style="width:60px"></div>
</div>

<div class="scene-selector" id="sceneSelector"></div>

<div class="legend" id="legend"></div>
<div class="progress-text" id="progressText">צבע את כל החלקים!</div>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>

<div class="canvas-wrap">
  <svg id="coloring-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div id="celebration">
  <div class="celebration-box">
    <div style="font-size:3.5rem">🌟</div>
    <h2>כל הכבוד!</h2>
    <p id="celebrationMsg">צבעת את כל החלקים בצורה מושלמת!</p>
    <button class="next-btn" id="nextSceneBtn">הסצנה הבאה ➡️</button>
  </div>
</div>

<script>
// ─── Scene definitions ───────────────────────────────────────────────
const SCENES = [

  // ── 2. BUTTERFLY ─────────────────────────────────────────────────
  {
    id: 'butterfly',
    name: '🦋 פרפר',
    colors: {
      1: { hex: '#B0E8FF', name: 'תכלת' },

      3: { hex: '#FF69B4', name: 'ורוד' },

      // lower left wing

      { tag:'circle', attrs:{cx:270,cy:118,r:17}, num:5, lx:270, ly:118 }
    ]

  // ── 3. FISH ───────────────────────────────────────────────────────
  {
    id: 'fish',
    name: '🐠 דג',
    colors: {
      1: { hex: '#4BAFD4', name: 'כחול' },
      2: { hex: '#FF8C00', name: 'כתום' },
      3: { hex: '#E63946', name: 'אדום' },

    },
    regions: [
      // water
      { tag:'rect', attrs:{x:0,y:0,width:400,height:300}, num:1, lx:25, ly:25 },
      // seaweed stem left
      { tag:'rect', attrs:{x:38,y:155,width:14,height:145}, num:5, lx:45, ly:230 },
      // seaweed leaf left-1
      { tag:'ellipse', attrs:{cx:20,cy:185,rx:22,ry:11,transform:'rotate(-30 20 185)'}, num:5, lx:18, ly:185 },
      // seaweed leaf right-1
      { tag:'ellipse', attrs:{cx:65,cy:210,rx:22,ry:11,transform:'rotate(30 65 210)'}, num:5, lx:67, ly:210 },
      // seaweed leaf left-2
      { tag:'ellipse', attrs:{cx:20,cy:245,rx:22,ry:11,transform:'rotate(-30 20 245)'}, num:5, lx:18, ly:245 },
      // seaweed stem right
      { tag:'rect', attrs:{x:348,y:170,width:14,height:130}, num:5, lx:355, ly:240 },
      // seaweed leaf right-2
      { tag:'ellipse', attrs:{cx:330,cy:210,rx:22,ry:11,transform:'rotate(-30 330 210)'}, num:5, lx:328, ly:210 },
      // tail
      { tag:'polygon', attrs:{points:'110,155 75,110 75,200'}, num:3, lx:88, ly:155 },
      // dorsal fin
      { tag:'polygon', attrs:{points:'170,98 200,60 240,98'}, num:3, lx:203, ly:85 },
      // fish body
      { tag:'ellipse', attrs:{cx:215,cy:155,rx:100,ry:56}, num:2, lx:215, ly:155 },
      // eye white
      { tag:'circle', attrs:{cx:288,cy:140,r:20}, num:4, lx:288, ly:140 },
      // pupil (same region as eye for simplicity)
      { tag:'circle', attrs:{cx:292,cy:137,r:8}, num:4, lx:292, ly:137 }
    ]
  },

  // ── 4. FLOWER ────────────────────────────────────────────────────
  {
    id: 'flower',
    name: '🌸 פרח',
    colors: {
      1: { hex: '#87CEEB', name: 'כחול' },
      2: { hex: '#FF69B4', name: 'ורוד' },
      3: { hex: '#FFD700', name: 'צהוב' },
      4: { hex: '#3CB55A', name: 'ירוק' },
      5: { hex: '#C68642', name: 'חום' }
    },
    regions: [
      // sky
      { tag:'rect', attrs:{x:0,y:0,width:400,height:215}, num:1, lx:25, ly:25 },
      // ground
      { tag:'rect', attrs:{x:0,y:215,width:400,height:85}, num:5, lx:30, ly:255 },
      // petal 0° (top)
      { tag:'ellipse', attrs:{cx:200,cy:68,rx:23,ry:44,transform:'rotate(0 200 120)'}, num:2, lx:200, ly:67 },
      // petal 60°
      { tag:'ellipse', attrs:{cx:200,cy:68,rx:23,ry:44,transform:'rotate(60 200 120)'}, num:2, lx:243, ly:94 },
      // petal 120°

      // petal 180° (bottom)
      { tag:'ellipse', attrs:{cx:200,cy:68,rx:23,ry:44,transform:'rotate(180 200 120)'}, num:2, lx:200, ly:173 },
      // petal 240°
      { tag:'ellipse', attrs:{cx:200,cy:68,rx:23,ry:44,transform:'rotate(240 200 120)'}, num:2, lx:157, ly:146 },
      // petal 300°
      { tag:'ellipse', attrs:{cx:200,cy:68,rx:23,ry:44,transform:'rotate(300 200 120)'}, num:2, lx:157, ly:94 },
      // flower center
      { tag:'circle', attrs:{cx:200,cy:120,r:36}, num:3, lx:200, ly:120 },
      // stem
      { tag:'rect', attrs:{x:192,y:156,width:16,height:60}, num:4, lx:200, ly:186 },
      // leaf left
      { tag:'ellipse', attrs:{cx:155,cy:195,rx:42,ry:16,transform:'rotate(-30 155 195)'}, num:4, lx:148, ly:192 },
      // leaf right
      { tag:'ellipse', attrs:{cx:245,cy:195,rx:42,ry:16,transform:'rotate(30 245 195)'}, num:4, lx:252, ly:192 }
    ]
  },

  // ── 5. ROCKET ────────────────────────────────────────────────────
  {
    id: 'rocket',
    name: '🚀 רקטה',
    colors: {
      1: { hex: '#1A1A3E', name: 'כחול כהה' },
      2: { hex: '#E0E8FF', name: 'לבנבן' },
      3: { hex: '#E63946', name: 'אדום' },
      4: { hex: '#FFD700', name: 'צהוב' },
      5: { hex: '#7EC8E3', name: 'תכלת' }
    },
    regions: [
      // space background
      { tag:'rect', attrs:{x:0,y:0,width:400,height:300}, num:1, lx:25, ly:25 },
      // stars group (3 circles)
      { tag:'circle', attrs:{cx:50,cy:60,r:5}, num:2, lx:50, ly:60 },
      { tag:'circle', attrs:{cx:130,cy:30,r:4}, num:2, lx:130, ly:30 },
      { tag:'circle', attrs:{cx:320,cy:50,r:6}, num:2, lx:320, ly:50 },
      { tag:'circle', attrs:{cx:360,cy:110,r:4}, num:2, lx:360, ly:110 },
      { tag:'circle', attrs:{cx:70,cy:180,r:5}, num:2, lx:70, ly:180 },
      { tag:'circle', attrs:{cx:350,cy:200,r:4}, num:2, lx:350, ly:200 },
      // rocket body
      { tag:'rect', attrs:{x:165,y:80,width:70,height:130}, num:3, lx:200, ly:145 },
      // nose cone
      { tag:'polygon', attrs:{points:'165,80 200,20 235,80'}, num:3, lx:200, ly:60 },
      // left fin
      { tag:'polygon', attrs:{points:'165,175 140,230 165,210'}, num:4, lx:152, ly:210 },
      // right fin
      { tag:'polygon', attrs:{points:'235,175 260,230 235,210'}, num:4, lx:248, ly:210 },
      // window
      { tag:'circle', attrs:{cx:200,cy:120,r:25}, num:5, lx:200, ly:120 },
      // flame left
      { tag:'ellipse', attrs:{cx:185,cy:240,rx:16,ry:35}, num:4, lx:185, ly:255 },
      // flame right
      { tag:'ellipse', attrs:{cx:215,cy:240,rx:16,ry:35}, num:4, lx:215, ly:255 }
    ]
  }
];

// ─── State ───────────────────────────────────────────────────────────
let currentSceneIdx = 0;
let colored = new Set(); // set of element IDs that have been colored
let totalRegions = 0;

// ─── Build UI ────────────────────────────────────────────────────────
function buildSceneSelector() {
  const wrap = document.getElementById('sceneSelector');
  wrap.innerHTML = '';
  SCENES.forEach((scene, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-btn' + (i === currentSceneIdx ? ' active' : '');
    btn.textContent = scene.name;
    btn.onclick = () => loadScene(i);
    wrap.appendChild(btn);
  });
}

function buildLegend(scene) {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  Object.entries(scene.colors).forEach(([num, col]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <div class="legend-swatch" style="background:${col.hex}">${num}</div>
      <span>${col.name}</span>
    `;
    legend.appendChild(item);
  });
}

function buildSVG(scene) {
  const svg = document.getElementById('coloring-svg');
  svg.innerHTML = '';

  colored = new Set();
  totalRegions = scene.regions.length;

  scene.regions.forEach((r, i) => {
    const id = `${scene.id}_${i}`;
    const color = scene.colors[r.num].hex;

    // Create shape element
    const el = document.createElementNS('http://www.w3.org/2000/svg', r.tag);
    Object.entries(r.attrs).forEach(([k, v]) => el.setAttribute(k, v));
    el.setAttribute('id', id);
    el.setAttribute('fill', 'white');
    el.setAttribute('class', 'region');
    el.dataset.num = r.num;
    el.dataset.color = color;

    el.addEventListener('click', () => colorRegion(id, color, el));
    svg.appendChild(el);

    // Create number label
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', r.lx);
    txt.setAttribute('y', r.ly);
    txt.setAttribute('class', 'num-label');
    txt.setAttribute('id', `lbl_${id}`);
    txt.textContent = r.num;
    svg.appendChild(txt);
  });
}

function colorRegion(id, color, el) {
  if (colored.has(id)) return;
  el.setAttribute('fill', color);
  el.classList.add('colored');
  colored.add(id);

  // Dim the label
  const lbl = document.getElementById(`lbl_${id}`);
  if (lbl) lbl.classList.add('done');

  updateProgress();
  if (colored.size === totalRegions) {
    setTimeout(celebrate, 400);
  }
}

function updateProgress() {
  const pct = totalRegions > 0 ? (colored.size / totalRegions) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    colored.size === totalRegions
      ? '🎉 סיימת!'
      : `צבעת ${colored.size} מתוך ${totalRegions} חלקים`;
}

function loadScene(idx) {
  currentSceneIdx = idx;
  const scene = SCENES[idx];
  buildSceneSelector();
  buildLegend(scene);
  buildSVG(scene);
  updateProgress();
}

// ─── Celebration ─────────────────────────────────────────────────────
function celebrate() {
  const scene = SCENES[currentSceneIdx];
  document.getElementById('celebrationMsg').textContent =
    `צבעת את ${scene.name.replace(/^\S+\s/, '')} בצורה מושלמת! 🌟`;
  document.getElementById('celebration').classList.add('show');
  launchConfetti();
  try { new Audio('../effects/Confetti.mp3').play().catch(()=>{}); } catch(e){}
  try { new Audio('../effects/newlevel.mp3').play().catch(()=>{}); } catch(e){}
}

document.getElementById('nextSceneBtn').addEventListener('click', () => {
  document.getElementById('celebration').classList.remove('show');
  loadScene((currentSceneIdx + 1) % SCENES.length);
});

// ─── Confetti ────────────────────────────────────────────────────────
function launchConfetti() {
  const colors = ['#FF6B9D','#FFD700','#5CB85C','#4BAFD4','#9B59B6','#FF8C00','#E63946','#FF69B4'];
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6 + Math.random() * 10;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    const dur = 1.5 + Math.random() * 2.5;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = Math.random() * 0.8 + 's';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

// ─── Init ────────────────────────────────────────────────────────────
loadScene(0);
</script>
</body>
</html>
