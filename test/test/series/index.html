<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סדרה</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Varela Round', 'Fredoka', sans-serif; background: linear-gradient(135deg, #EDE9FE, #F5F3FF); min-height: 100vh; color: #2D2A4A; }
        header { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: linear-gradient(90deg, #8B5CF6, #A78BFA); color: #fff; }
        header h1 { font-size: 1.4rem; }
        .back { background: rgba(255,255,255,0.25); border: 0; color: #fff; font: inherit; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        main { display: grid; grid-template-columns: 1fr 340px; gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .player { background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; }
        .player iframe { width: 100%; height: 100%; border: 0; display: block; }
        .now { margin-top: 12px; font-size: 1.2rem; font-weight: 600; }
        .nav { display: flex; gap: 10px; margin-top: 12px; }
        .nav button { flex: 1; padding: 12px; border: 0; border-radius: 14px; background: #8B5CF6; color: #fff; font: inherit; font-size: 1rem; cursor: pointer; }
        .nav button:disabled { opacity: 0.4; cursor: default; }
        ol { list-style: none; background: #fff; border-radius: 16px; max-height: 70vh; overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        aside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
        .search { display: flex; gap: 8px; }
        .search input { flex: 1; min-width: 0; padding: 12px 16px; border: 2px solid #DDD6FE; border-radius: 14px; font: inherit; font-size: 1rem; background: #fff; color: inherit; }
        .search input:focus { outline: none; border-color: #8B5CF6; }
        .mic { width: 48px; border: 0; border-radius: 14px; background: #8B5CF6; color: #fff; font-size: 1.3rem; cursor: pointer; }
        .mic.listening { background: #EF4444; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { transform: scale(1.08); } }
        .hint { font-size: 0.9rem; color: #6B6890; min-height: 1.2em; }
        li[hidden] { display: none; }
        .thumb { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: #DDD6FE; flex: none; }
        .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        li button { width: 100%; text-align: right; background: none; border: 0; border-bottom: 1px solid #EEE; padding: 10px 14px; font: inherit; cursor: pointer; display: flex; gap: 10px; align-items: center; }
        li button:hover { background: #F5F3FF; }
        li.active button { background: #DDD6FE; font-weight: 700; }
        .num { color: #8B5CF6; min-width: 2ch; }
        .dur { color: #888; font-size: 0.85rem; white-space: nowrap; }
        .msg { text-align: center; padding: 60px 20px; font-size: 1.2rem; }
        @media (max-width: 800px) { main { grid-template-columns: 1fr; } ol { max-height: 50vh; } }
    </style>
</head>
<body>
    <header>
        <button class="back" onclick="goBack()">← חזור</button>
        <h1 id="title">טוען...</h1>
    </header>
    <div id="msg" class="msg" hidden></div>
    <main id="main" hidden>
        <section>
            <div class="player"><div id="yt"></div></div>
            <div class="now" id="now"></div>
            <div class="nav">
                <button id="prev">פרק קודם ▶</button>
                <button id="next">◀ פרק הבא</button>
            </div>
        </section>
        <aside>
            <div class="search">
                <input id="q" type="search" placeholder="חפשו פרק..." aria-label="חיפוש פרק" autocomplete="off">
                <button id="mic" class="mic" type="button" aria-label="חיפוש בקול" title="חיפוש בקול" hidden>🎤</button>
            </div>
            <div class="hint" id="hint" aria-live="polite"></div>
            <ol id="list"></ol>
        </aside>
    </main>

    <script>
        const params = new URLSearchParams(location.search);
        // כמו ב-live-cam: דף אחד לכל הסדרות, וקובץ JSON נפרד לכל סדרה (?config=data/<id>.json)
        const configUrl = params.get('config') || '';
        const configValid = /^[\w\-./]+\.json$/.test(configUrl) && !configUrl.startsWith('/') && !configUrl.includes('..');
        const storeKey = 'kidlearn-series-' + configUrl;
        let videos = [], index = 0, player = null;

        function goBack() {
            if (history.length > 1) history.back(); else location.href = '../category.html?category=series';
        }

        function showMessage(text) {
            document.getElementById('main').hidden = true;
            const m = document.getElementById('msg');
            m.textContent = text;
            m.hidden = false;
        }

        function fmt(sec) {
            const m = Math.floor(sec / 60);
            return m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' ש׳' : m + ' דק׳';
        }

        function saveIndex() { try { localStorage.setItem(storeKey, String(index)); } catch (e) {} }
        function loadIndex() { try { return parseInt(localStorage.getItem(storeKey), 10) || 0; } catch (e) { return 0; } }

        // מסירים ניקוד, אימוג'ים ותווי פיסוק כדי שהחיפוש יתאים גם לדיבור
        function normalize(s) {
            return s.toLowerCase().replace(/[֑-ׇ]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
        }

        function filterList() {
            const words = normalize(document.getElementById('q').value).split(' ').filter(Boolean);
            let shown = 0;
            document.querySelectorAll('#list li').forEach(li => {
                const ok = words.every(w => li.dataset.search.includes(w));
                li.hidden = !ok;
                if (ok) shown++;
            });
            document.getElementById('hint').textContent = words.length && !shown ? 'לא נמצאו פרקים. נסו מילה אחרת.' : '';
        }

        function setupSearch() {
            const q = document.getElementById('q');
            q.addEventListener('input', filterList);
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return; // בלי תמיכה בדפדפן, נשאר חיפוש בהקלדה בלבד
            const mic = document.getElementById('mic'), hint = document.getElementById('hint');
            mic.hidden = false;
            let rec = null;
            mic.onclick = () => {
                if (rec) { rec.stop(); return; }
                rec = new SR();
                rec.lang = 'he-IL';
                rec.interimResults = false;
                rec.maxAlternatives = 1;
                rec.onstart = () => { mic.classList.add('listening'); hint.textContent = 'מקשיבים... אמרו שם של פרק'; };
                rec.onresult = e => { q.value = e.results[0][0].transcript; filterList(); };
                rec.onerror = e => {
                    hint.textContent = e.error === 'not-allowed' || e.error === 'service-not-allowed'
                        ? 'צריך לאשר גישה למיקרופון בדפדפן.'
                        : e.error === 'no-speech' ? 'לא שמענו. נסו שוב.' : 'החיפוש בקול לא זמין כרגע.';
                };
                rec.onend = () => {
                    mic.classList.remove('listening');
                    rec = null;
                    if (hint.textContent.startsWith('מקשיבים')) hint.textContent = '';
                };
                try { rec.start(); } catch (e) { rec = null; }
            };
        }

        function render() {
            const v = videos[index];
            document.getElementById('now').textContent = v.title;
            document.getElementById('prev').disabled = index === 0;
            document.getElementById('next').disabled = index === videos.length - 1;
            document.querySelectorAll('#list li').forEach((li, i) => li.classList.toggle('active', i === index));
        }

        function play(i, autoplay) {
            index = Math.max(0, Math.min(videos.length - 1, i));
            saveIndex();
            render();
            if (player && player.loadVideoById) {
                if (autoplay) player.loadVideoById(videos[index].id); else player.cueVideoById(videos[index].id);
            }
        }

        function initPlayer() {
            player = new YT.Player('yt', {
                width: '100%', height: '100%',
                videoId: videos[index].id,
                host: 'https://www.youtube-nocookie.com',
                playerVars: { rel: 0, playsinline: 1, hl: 'he' },
                events: { onStateChange: e => { if (e.data === YT.PlayerState.ENDED && index < videos.length - 1) play(index + 1, true); } }
            });
        }

        // ה-API של יוטיוב קורא לפונקציה הזו כשהוא נטען
        window.onYouTubeIframeAPIReady = initPlayer;

        function loadYouTubeApi() {
            const s = document.createElement('script');
            s.src = 'https://www.youtube.com/iframe_api';
            // אם ה-API נחסם, נשארים עם iframe רגיל בלי מעבר אוטומטי
            s.onerror = () => {
                document.getElementById('yt').outerHTML = '<iframe id="yt" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" src="https://www.youtube-nocookie.com/embed/' + videos[index].id + '?rel=0&hl=he"></iframe>';
            };
            document.head.appendChild(s);
        }

        async function init() {
            if (!configValid) return showMessage('לא נבחרה סדרה.');
            let data;
            try {
                const res = await fetch(configUrl);
                if (!res.ok) throw new Error(res.status);
                data = await res.json();
            } catch (e) {
                return showMessage('לא הצלחנו לטעון את הסדרה.');
            }
            videos = data.videos;
            if (!videos.length) return showMessage('אין פרקים בסדרה הזו.');
            document.title = data.title;
            document.getElementById('title').textContent = data.title;

            const list = document.getElementById('list');
            videos.forEach((v, i) => {
                const li = document.createElement('li');
                const b = document.createElement('button');
                const img = document.createElement('img');
                img.className = 'thumb'; img.loading = 'lazy'; img.alt = '';
                img.src = 'https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg';
                img.onerror = () => img.remove();
                const txt = document.createElement('span'); txt.className = 'txt';
                const t = document.createElement('span'); t.textContent = v.title;
                const d = document.createElement('span'); d.className = 'dur'; d.textContent = v.duration ? fmt(v.duration) : '';
                txt.append(t, d);
                b.append(img, txt);
                li.dataset.search = normalize((i + 1) + ' ' + v.title);
                b.onclick = () => play(i, true);
                li.appendChild(b);
                list.appendChild(li);
            });
            document.getElementById('prev').onclick = () => play(index - 1, true);
            document.getElementById('next').onclick = () => play(index + 1, true);

            setupSearch();
            index = Math.min(loadIndex(), videos.length - 1);
            render();
            document.getElementById('main').hidden = false;
            loadYouTubeApi();
        }

        init();
    </script>
</body>
</html>
