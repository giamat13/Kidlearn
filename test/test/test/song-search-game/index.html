<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חיפוש שירים 🎵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #333;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-box button:active {
            transform: scale(0.95);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 18px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .results {
            margin-bottom: 20px;
        }

        .result-item {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .result-item:hover {
            background: #efefef;
            border-color: #667eea;
            transform: translateX(-5px);
        }

        .result-item.playing {
            background: #e8e8ff;
            border-color: #667eea;
        }

        .result-thumbnail {
            width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #ddd;
            object-fit: cover;
        }

        .result-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .result-channel {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .player-container {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 15px;
        }

        .now-playing-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            word-break: break-word;
        }

        iframe {
            width: 100%;
            border: none;
            border-radius: 8px;
        }

        .favorites-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .favorites-title {
            font-weight: bold;
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .favorite-item {
            background: #fff8e1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ffe082;
        }

        .favorite-item-title {
            flex: 1;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            word-break: break-word;
        }

        .favorite-item-title:hover {
            color: #667eea;
        }

        .favorite-remove {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 30px 20px;
            font-size: 16px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                border-radius: 15px;
            }

            .header h1 {
                font-size: 28px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 חיפוש שירים</h1>
            <p>חפש שיר, בחר ותנגן</p>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="songInput"
                placeholder="הקלד את שם השיר או הזמר..."
                autocomplete="off"
            >
            <button onclick="searchSongs()">חפש</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="loading" id="loading">
            ⏳ מחפש שירים...
        </div>

        <div class="player-container" id="playerContainer" style="display: none;">
            <div class="now-playing-title" id="nowPlayingTitle">בחר שיר כדי להנגן</div>
            <iframe
                id="youtubePlayer"
                width="100%"
                height="315"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
            <button
                onclick="addToFavorites()"
                style="width: 100%; margin-top: 10px; padding: 10px; background: #ffc107; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;"
            >
                ⭐ הוסף לשירים אהובים
            </button>
        </div>

        <div class="results" id="results"></div>
        <div class="no-results" id="noResults"></div>

        <div class="favorites-section" id="favoritesSection" style="display: none;">
            <div class="favorites-title">⭐ שירים אהובים</div>
            <div id="favoritesList"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
