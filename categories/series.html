<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סדרות חינוכיות - KidLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #a855f7;
            --bg: #f5f3ff;
            --card-bg: #FFFFFF;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Varela Round', 'Fredoka', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .back-button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Varela Round', sans-serif;
            font-weight: 600;
        }

        .back-button:hover {
            background: #7c3aed;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px var(--shadow);
            border-top: 4px solid var(--primary);
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .app-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(139, 92, 246, 0.2);
        }

        .app-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .app-description {
            font-size: 0.95rem;
            color: #888;
            line-height: 1.6;
        }

        .grade-tag {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 14px;
            border-radius: 18px;
            background: #ede9fe;
            color: #581c87;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .settings-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .settings-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .back-button {
                width: 100%;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-button" onclick="window.location.href='../categories.html'">← חזור</button>
            <h1>📺 סדרות חינוכיות</h1>
        </div>

        <div class="apps-grid">
            <a href="https://www.youtube.com/playlist?list=PLCEfoQuDNmplcZ4FLYIO9bEvtdzs2fo39" target="_blank" class="app-card">
                <span class="app-icon">🎥</span>
                <div class="app-title">בלי סודות</div>
                <div class="app-description">סדרה חינוכית ללימוד אותיות בעברית.</div>
                <div class="grade-tag">גן חובה, כיתה א׳</div>
            </a>
        </div>
    </div>

    <script>
        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return cookie.substring(nameEQ.length);
                }
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        }

        const studentName = getCookie('studentName');
        if (studentName) {
            const btn = document.createElement('button');
            btn.className = 'settings-button';
            btn.textContent = '⚙️ החלף תלמיד';
            btn.onclick = function() {
                deleteCookie('studentName');
                deleteCookie('studentGrade');
                window.location.href = '../index.html';
            };
            document.body.appendChild(btn);
        }
    </script>
</body>
</html>
