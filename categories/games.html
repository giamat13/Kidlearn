<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחקים חינוכיים - KidLearn</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FEC163;
            --secondary: #FBB040;
            --accent: #F59E0B;
            --bg: #FFFBF0;
            --card-bg: #FFFFFF;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Varela Round', 'Fredoka', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(254, 193, 99, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.08) 0%, transparent 50%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .back-button {
            background: var(--primary);
            color: #333;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Varela Round', sans-serif;
            font-weight: 600;
        }

        .back-button:hover {
            background: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(254, 193, 99, 0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--accent);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px var(--shadow);
            border-top: 4px solid var(--accent);
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .app-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(245, 158, 11, 0.2);
        }

        .app-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .app-description {
            font-size: 0.95rem;
            color: #888;
            line-height: 1.6;
        }

        .grade-tag {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 14px;
            border-radius: 18px;
            background: #fef9c3;
            color: #b45309;
            font-size: 0.85rem;
            font-weight: 700;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .apps-grid .app-card:nth-child(1) {
            animation: fadeInDown 0.6s ease-out 0.1s both;
        }

        .apps-grid .app-card:nth-child(2) {
            animation: fadeInDown 0.6s ease-out 0.2s both;
        }

        .apps-grid .app-card:nth-child(3) {
            animation: fadeInDown 0.6s ease-out 0.3s both;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .back-button {
                width: 100%;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-button" onclick="window.location.href='../categories.html'">← חזור</button>
            <h1>🎮 משחקים חינוכיים</h1>
        </div>

        <div class="apps-grid" id="gamesGrid"></div>
        <div class="no-tools-message hidden" id="noGamesMessage"> </div>
    </div>
    
    <script>
        // Cookie functions
        function getCookie(name) {
            const nameEQ = name + "=";
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return cookie.substring(nameEQ.length);
                }
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        }

        // Create style for settings button
        const style = document.createElement('style');
        style.textContent = `
            .settings-button {
                position: fixed;
                bottom: 30px;
                right: 30px;
                background: linear-gradient(135deg, #FEC163, #FBB040);
                color: #333;
                border: none;
                padding: 12px 25px;
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
                transition: all 0.3s ease;
                z-index: 100;
                font-family: 'Varela Round', sans-serif;
            }

            .settings-button:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 20px rgba(254, 193, 99, 0.4);
            }
        `;
        document.head.appendChild(style);

        // Create and add settings button
        const studentName = getCookie('studentName');
        if (studentName) {
            const settingsBtn = document.createElement('button');
            settingsBtn.className = 'settings-button';
            settingsBtn.textContent = '⚙️ החלף תלמיד';
            settingsBtn.onclick = function() {
                deleteCookie('studentName');
                deleteCookie('studentGrade');
                window.location.href = '../index.html';
            };
            document.body.appendChild(settingsBtn);
        }

        function renderGameCards() {
            const grade = getCookie('studentGrade');
            const gamesGrid = document.getElementById('gamesGrid');
            const noGamesMessage = document.getElementById('noGamesMessage');
            const games = [
                {
                    icon: '🧠',
                    title: 'משחק הזיכרון',
                    description: 'תרגל את הזיכרון שלך עם משחק זכרון קלאסי!',
                    url: '../memory-game/index.html',
                    grades: ['kindergarten', 'first', 'second']
                },
                {
                    icon: '🔤',
                    title: 'משחק האותיות',
                    description: 'משחק כיף עם אותיות עבריות וזיכרון!',
                    url: '../Letters-game/index.html',
                    grades: ['kindergarten', 'first']
                },
                {
                    icon: '🧊',
                    title: 'המקרר הקסום',
                    description: 'אילו מאכלים בריאים ואילו לא?',
                    url: '../the magical fridge/index.html',
                    grades: ['preschool', 'kindergarten', 'first', 'second']
                }
            ];

            const visibleGames = games.filter(game => {
                if (!grade) return true;
                return game.grades.includes(grade);
            });

            gamesGrid.innerHTML = '';

            if (visibleGames.length === 0) {
                noGamesMessage.classList.remove('hidden');
                return;
            }

            noGamesMessage.classList.add('hidden');
            visibleGames.forEach(game => {
                const card = document.createElement('a');
                card.className = 'app-card';
                card.href = game.url;
                card.innerHTML = `
                    <span class="app-icon">${game.icon}</span>
                    <div class="app-title">${game.title}</div>
                    <div class="app-description">${game.description}</div>
                `;
                gamesGrid.appendChild(card);
            });
        }

        renderGameCards();
    </script>
